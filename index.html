C.push({id:'3-2', th:'t3', title:'Les moteurs et la propulsion', min:18,
goals:['décrire le cycle du moteur à pistons à quatre temps','expliquer turboréacteur, turbopropulseur, statoréacteur et fusée','comparer leurs domaines d’emploi et leurs carburants'],
body:`
<p>Un avion avance en repoussant de l’air vers l’arrière (action-réaction). Selon la vitesse visée, on utilise différents types de moteurs.</p>
<h2>Moteur à pistons</h2>
<p>Un moteur à pistons à quatre temps accomplit un cycle en deux tours de vilebrequin :</p>
<div class="simslot" data-sim="engine"></div>
<ol><li><b>Admission</b> : le piston descend et aspire le mélange air-carburant.</li><li><b>Compression</b> : le piston remonte et comprime le mélange.</li><li><b>Combustion-détente</b> : la bougie enflamme le mélange, la pression pousse le piston vers le bas. C’est le seul temps où le moteur fournit de la puissance (le « temps moteur »).</li><li><b>Échappement</b> : le piston remonte et chasse les gaz brûlés.</li></ol>
<p>Un moteur d’avion léger est refroidi par air et possède un <b>double allumage</b> (deux magnétos et deux bougies par cylindre) : en cas de panne de l’un, le second assure le fonctionnement. Il fait tourner une <b>hélice</b>, dont chaque pale est un petit profil d’aile qui crée une force de traction. Une hélice à pas variable peut changer l’inclinaison de ses pales selon la vitesse, comme on change de vitesse sur un vélo. Carburant : essence aviation <b>AVGAS 100LL</b>.</p>
<h2>Turbomachines</h2>
<div class="tw"><table><tr><th>Moteur</th><th>Principe</th><th>Utilisation</th></tr>
<tr><td><dfn>Turboréacteur</dfn></td><td>Compresseur → chambre de combustion → turbine → tuyère. Les gaz éjectés à grande vitesse poussent l’avion (poussée).</td><td>Avions rapides</td></tr>
<tr><td><dfn>Turbosoufflante</dfn> (double flux)</td><td>Une grande soufflante accélère un flux d’air qui contourne le cœur du moteur : plus silencieux et plus économe.</td><td>Presque tous les avions de ligne</td></tr>
<tr><td><dfn>Turbopropulseur</dfn></td><td>Une turbine entraîne une hélice par un réducteur.</td><td>Avions régionaux (ATR 72), transport</td></tr>
<tr><td><dfn>Turbomoteur</dfn></td><td>Une turbine entraîne le rotor.</td><td>Hélicoptères</td></tr>
<tr><td><dfn>Statoréacteur</dfn></td><td>Pas de pièces mobiles : l’air est comprimé par la vitesse même de l’engin. Ne fonctionne qu’à grande vitesse.</td><td>Missiles, projets supersoniques</td></tr></table></div>
<p>Les turbines brûlent du <b>kérosène</b> (Jet A-1).</p>
<h2>Le moteur-fusée</h2>
<p>Une fusée emporte à la fois son carburant et son comburant (le comburant est ce qui permet au carburant de brûler : l’oxygène). Ensemble, on les appelle les ergols. Elle n’a donc pas besoin de l’air extérieur et fonctionne dans le vide. Les ergols peuvent être <b>liquides</b> (hydrogène et oxygène liquides du moteur Vulcain) ou <b>solides</b> (poudre des boosters).</p>
<h2>Qui pour quelle vitesse ?</h2>
<p>Hélice : bas régime subsonique. Turbosoufflante : vitesse proche de Mach 0,8. Statoréacteur : supersonique. Fusée : spatial.</p>
<h2>Moteurs et environnement</h2>
<p>Le transport aérien représente environ <b>2 à 3 %</b> des émissions mondiales de CO₂. Pour les réduire : avions plus sobres, carburants d’aviation durables (<b>SAF</b>) fabriqués à partir de déchets ou de ressources renouvelables, avions électriques ou hybrides pour les petits trajets, hydrogène à plus long terme, et amélioration des trajectoires.</p>
`,
keep:['4 temps : admission, compression, combustion-détente, échappement.','Turboréacteur : compresseur, chambre de combustion, turbine, tuyère.','Turbopropulseur = turbine + hélice ; turbosoufflante = avions de ligne.','Double allumage = sécurité par redondance.','Fusée : emporte carburant et comburant, fonctionne dans le vide. SAF = carburants d’aviation durables.'],
traps:['Dans le cycle à 4 temps, un seul temps est moteur : la combustion-détente.','Le turbopropulseur n’est pas un moteur à pistons : il contient une turbine.'],
qs:[
['Quel est l’ordre des quatre temps d’un moteur à pistons ?','Admission, compression, combustion-détente, échappement','Compression, admission, échappement, combustion','Admission, combustion, compression, échappement','Échappement, admission, détente, compression','Le mélange est d’abord aspiré, puis comprimé, enflammé (temps moteur) et enfin évacué.'],
['Quels sont les éléments d’un turboréacteur, dans l’ordre de passage de l’air ?','Compresseur, chambre de combustion, turbine, tuyère','Chambre, compresseur, tuyère, turbine','Turbine, compresseur, chambre, tuyère','Tuyère, turbine, chambre, compresseur','L’air est comprimé, mélangé au kérosène, brûlé, puis détendu dans la turbine et éjecté par la tuyère.'],
['Pourquoi les moteurs d’avions légers ont-ils deux systèmes d’allumage ?','Pour la sécurité : si l’un tombe en panne, l’autre fonctionne','Pour doubler la puissance','Pour consommer moins','Pour démarrer plus vite en hiver','Le double allumage est une redondance qui améliore la sécurité.'],
['Un turbopropulseur entraîne :','une hélice par l’intermédiaire d’un réducteur','un compresseur seul','un rotor de queue uniquement','un statoréacteur','Une turbine fournit de la puissance, transmise à l’hélice par un réducteur.'],
['Qu’est-ce qui permet à une fusée de fonctionner dans le vide ?','Elle emporte à la fois son carburant et son comburant','Elle utilise l’air extérieur','Elle utilise l’énergie solaire','Elle s’appuie sur la Terre','Les ergols (carburant + comburant) ne dépendent pas de l’oxygène atmosphérique.']
]});

C.push({id:'3-3', th:'t3', title:'Instruments de bord et systèmes', min:16,
goals:['associer chaque instrument à sa source de mesure','lire l’anémomètre et l’horizon artificiel','expliquer la panne d’une prise Pitot ou statique et le principe des commandes électriques'],
body:`
<p>Le tableau de bord de base d’un avion léger regroupe six instruments. Il faut savoir ce qu’ils mesurent, comment, et ce qui se passe quand ils se trompent.</p>
<h2>Les instruments « pitot-statique »</h2>
<div class="figslot" data-fig="pitotstatic"></div>
<ul><li><b>Anémomètre</b> : vitesse indiquée. Relié à la prise Pitot (pression totale) <b>et</b> à la prise statique.</li><li><b>Altimètre</b> : altitude. Relié à la prise statique : il convertit la pression en altitude.</li><li><b>Variomètre</b> : vitesse verticale (en ft/min ou m/s). Relié à la prise statique : il détecte si la pression baisse (tu montes) ou augmente (tu descends), et à quelle vitesse.</li></ul>
<h2>Les instruments gyroscopiques</h2>
<ul><li><b>Horizon artificiel</b> : indique l’attitude de l’avion (tangage et inclinaison). Un gyroscope est une toupie qui tourne très vite : comme une toupie, elle garde son axe dans la même direction, même quand l’avion s’incline autour d’elle.</li><li><b>Conservateur de cap</b> (directionnel) : indique le cap. Il dérive lentement : on le recale régulièrement sur le compas magnétique.</li><li><b>Indicateur de virage et bille</b> (coordinateur) : taux de virage et qualité de la coordination.</li></ul>
<div class="simslot" data-sim="panel"></div>
<h2>Le compas magnétique</h2>
<p>Indique le nord magnétique. Il est simple, sans électricité, mais il est faussé en virage et en accélération, et le métal de l’avion (moteur, structure) perturbe un peu l’aiguille (c’est la déviation).</p>
<h2>Instruments moteur</h2>
<p>Compte-tours, pression d’huile, température d’huile, indicateur de carburant. Une pression d’huile trop basse est une alerte grave.</p>
<h2>Quand une prise se bouche</h2>
<ul><li><b>Pitot bouché</b> (givre, insecte) : l’anémomètre devient faux, souvent figé ou lisant en fonction de l’altitude.</li><li><b>Prise statique bouchée</b> : l’altimètre se fige, le variomètre indique zéro, l’anémomètre est faux. Une prise de secours est prévue.</li></ul>
<h2>Systèmes et avionique</h2>
<ul><li><b>Circuit électrique</b> : batterie, alternateur, disjoncteurs.</li><li><b>Hydraulique</b> : sur les gros avions, il actionne train, freins, gouvernes.</li><li><b>Commandes de vol électriques</b> (<i>fly-by-wire</i>) : le pilote transmet un ordre à des calculateurs, qui commandent les gouvernes. L’Airbus A320, en 1987, fut le premier avion de ligne civil à en être équipé.</li><li><b>Pilote automatique</b>, <b>transpondeur</b> (renvoie un code et l’altitude au radar), <b>balise de détresse</b> (ELT).</li><li><b>Cockpit « tout écran »</b> (<i>glass cockpit</i>) : les instruments classiques sont remplacés par des écrans (PFD pour les données de vol, ND ou MFD pour la navigation).</li></ul>
<h2>Radionavigation à bord</h2>
<p>Récepteurs VOR, ADF, DME, ILS, GNSS (voir chapitre 4.3).</p>
`,
keep:['Anémomètre : Pitot + statique. Altimètre et variomètre : statique.','Horizon artificiel = assiette (tangage, inclinaison) ; conservateur de cap à recaler ; bille = coordination.','Pitot bouché : anémomètre faux. Statique bouchée : altimètre figé, variomètre à zéro.','Anémomètre : arc blanc (volets), arc vert (normal), arc jaune (prudence), trait rouge (Vne).','A320 (1987) : premier avion de ligne à commandes de vol électriques.'],
traps:['Le variomètre n’est pas relié au Pitot.','Un trait rouge sur l’anémomètre est une limite à ne jamais dépasser, pas une zone de « vitesse maximale conseillée ».'],
qs:[
['Quel instrument utilise à la fois la pression totale (Pitot) et la pression statique ?','L’anémomètre','L’altimètre','Le variomètre','L’horizon artificiel','L’anémomètre mesure la différence entre pression totale et pression statique, soit la pression dynamique.'],
['L’horizon artificiel indique :','l’attitude de l’avion (tangage et inclinaison)','la vitesse verticale','le cap magnétique','l’altitude','Un gyroscope maintient une référence horizontale ; l’instrument montre l’avion par rapport à elle.'],
['Pourquoi doit-on recaler régulièrement le conservateur de cap ?','Il dérive lentement','Il perd sa pile','Il est sensible au Pitot','Il dépend de la pression','Le gyroscope directionnel dérive : on le recale sur le compas magnétique.'],
['Si la prise statique est bouchée en croisière, que fait le variomètre ?','Il indique zéro','Il indique une montée constante','Il se bloque sur la dernière valeur de vitesse','Il indique une descente rapide','Sans variation de pression, le variomètre croit que l’avion reste à altitude constante.'],
['Un arc vert sur l’anémomètre signale :','la plage normale d’utilisation','la plage volets sortis','la vitesse à ne jamais dépasser','la zone de décrochage','L’arc vert va de la vitesse de décrochage (volets rentrés) à Vno.']

C.push({id:'3-4', th:'t3', title:'Hélicoptères, planeurs, ULM et drones', min:16,
goals:['expliquer comment vole et se pilote un hélicoptère','comprendre l’autorotation','décrire le vol à voile, l’ULM et les règles de base des drones'],
body:`
<h2>L’hélicoptère</h2>
<p>Le rotor principal est une grande aile qui tourne. Il fournit à la fois la portance (il soutient l’hélicoptère) et la propulsion : en inclinant le disque qu’il forme en tournant, l’hélicoptère avance dans cette direction. L’hélicoptère peut décoller à la verticale, rester en <b>vol stationnaire</b>, reculer. En contrepartie, sa vitesse est limitée (environ 300 km/h) et il consomme beaucoup.</p>
<div class="simslot" data-sim="heli"></div>
<p>Quand le rotor tourne dans un sens, le fuselage a tendance à tourner dans l’autre (action-réaction) : c’est le <b>couple de réaction</b>. Pour compenser, l’hélicoptère a un petit rotor à l’arrière : le rotor anti-couple (ou le fenestron, un rotor placé dans un carénage). Il empêche le fuselage de tourner et permet aussi de choisir où pointe le nez (c’est le lacet).</p>
<div class="tabset"><div class="tb"><button type="button" data-t="a">Pas collectif</button><button type="button" data-t="b">Cyclique</button><button type="button" data-t="c">Palonnier</button></div>
<div class="pane" data-p="a"><p><b>Levier du pas collectif</b> (main gauche) : change l’angle de toutes les pales en même temps. Plus de pas, plus de portance : l’hélicoptère <b>monte</b>. On le baisse pour descendre. La puissance moteur est ajustée en conséquence.</p></div>
<div class="pane" data-p="b"><p><b>Manche cyclique</b> (main droite) : change l’angle des pales à chaque tour, ce qui <b>incline le disque rotor</b>. L’hélicoptère se déplace dans la direction où le disque est incliné : avant, arrière, côtés.</p></div>
<div class="pane" data-p="c"><p><b>Palonnier</b> (pieds) : modifie le pas du rotor anti-couple et commande le <b>lacet</b>, c’est-à-dire l’orientation du nez.</p></div></div>
<h3>L’autorotation</h3>
<p>Si le moteur tombe en panne, le pilote baisse aussitôt le collectif pour que l’air qui monte à travers le rotor continue de le faire tourner : l’hélicoptère descend comme une graine d’érable. Juste avant le sol, le pilote « arrondit » pour utiliser l’énergie de rotation du rotor et se poser en douceur.</p>
<p>L’<b>autogire</b> a un rotor libre, non motorisé, qui tourne en autorotation en permanence, et une hélice pour avancer. Le <b>convertible</b> (V-22 Osprey) bascule ses rotors d’une position verticale à une position horizontale.</p>
<h2>Le planeur</h2>
<p>Un planeur n’a pas de moteur. Il décolle <b>remorqué</b> par un avion ou tiré par un <b>treuil</b>, puis il exploite les mouvements d’air ascendants pour rester en l’air :</p>
<div class="simslot" data-sim="glider"></div>
<ul><li>les <b>thermiques</b> : colonnes d’air chaud sous les cumulus ;</li><li>les <b>ascendances de pente</b> : le vent remonte le long d’un relief ;</li><li>les <b>ondes</b> sous le vent d’une montagne.</li></ul>
<p>Sa grande envergure et sa forme très fine lui donnent une <b>finesse</b> qui peut dépasser 60. Le vol à voile est l’une des meilleures écoles de pilotage.</p>
<h2>L’ULM</h2>
<p>L’<b>ULM</b> (ultra-léger motorisé) regroupe des appareils légers : pendulaires, multiaxes (qui ressemblent à de petits avions), autogires, paramoteurs, aérostats. Les masses sont limitées (de l’ordre de 500 kg). Il est soumis à une réglementation allégée.</p>
<h2>Les drones</h2>
<p>Un <b>drone</b> (UAS) est un aéronef sans pilote à bord, télécommandé ou autonome. Usages : photographie, agriculture, inspection d’ouvrages, secours. En France et en Europe, un drone de loisir doit rester en vue, ne pas voler à plus de <b>120 m (400 ft)</b> de hauteur, respecter les zones interdites et être enregistré selon son poids.</p>
`,
keep:['Hélicoptère : le rotor principal assure portance et propulsion ; le rotor anti-couple contre le couple de réaction.','Collectif = monter/descendre ; cyclique = avancer/reculer/côtés ; palonnier = lacet.','Autorotation : descente sans moteur, rotor entraîné par le flux d’air montant.','Planeur : décollage par remorquage ou treuil ; ascendances thermiques, de pente et d’onde.','Drone de loisir : 120 m maximum, en vue, enregistré.'],
traps:['Le rotor anti-couple ne sert pas qu’à tourner : il compense d’abord le couple de réaction.','Un planeur n’est pas « en panne » de moteur : il est conçu sans moteur.'],
qs:[

['Le levier de pas collectif d’un hélicoptère permet de :','monter ou descendre','avancer ou reculer','tourner à droite ou à gauche','démarrer le moteur','Il change le pas de toutes les pales : plus de portance ou moins.'],
['L’autorotation est :','une descente sans moteur, le rotor tournant sous l’effet du flux d’air','un décollage vertical','un virage coordonné','une manœuvre de stationnaire','En cas de panne moteur, le pilote profite de l’air montant pour garder le rotor en rotation.'],
['Comment un planeur décolle-t-il généralement ?','Remorqué par un avion ou tiré par un treuil','Par son propre moteur à réaction','Lancé depuis un ballon','Par catapulte','Il n’a pas de moteur : l’énergie du décollage vient d’une source extérieure.'],
['Quelle est la hauteur maximale de vol d’un drone de loisir dans la catégorie ouverte européenne ?','120 m','30 m','500 m','1 000 m','La règle générale est 120 m (400 ft) au-dessus du sol.']
]});

C.push({id:'3-5', th:'t3', title:'Engins spatiaux et orbites', min:20,
goals:['expliquer la propulsion d’une fusée et le principe de l’étagement','comprendre ce qu’est une orbite et pourquoi on est en apesanteur','citer les grandes orbites et leurs usages'],
body:`
<h2>Une fusée : action et réaction</h2>
<p>Une fusée expulse des gaz à très grande vitesse vers l’arrière : par <b>réaction</b>, elle avance vers l’avant (troisième loi de Newton : à chaque action correspond une réaction opposée, comme quand tu repousses le bord de la piscine et que tu pars en arrière). Elle n’a besoin ni d’air ni de sol pour s’appuyer, et peut donc fonctionner dans le vide.</p>
<div class="figslot" data-fig="stages"></div>
<div class="simslot" data-sim="rocket"></div>
<p>Elle est <b>étagée</b> : à mesure que les réservoirs se vident, les étages vides sont largués pour ne pas porter de poids inutile. Ariane 6 comprend deux ou quatre boosters à poudre, un étage principal (moteur Vulcain 2.1) et un étage supérieur (moteur Vinci).</p>
<h2>Pourquoi lancer depuis Kourou ?</h2>
<ul><li>Située à 5° de l’équateur, la base de Kourou (Guyane) profite de la rotation de la Terre : le sol y tourne vers l’est à environ 460 m/s, ce qui donne un gain de vitesse « gratuit ».</li><li>Le lancement se fait vers l’est, au-dessus de l’océan Atlantique : en cas de problème, les retombées ne menacent pas d’habitations.</li><li>C’est idéal pour atteindre l’orbite géostationnaire.</li></ul>
<h2>Qu’est-ce qu’une orbite ?</h2>
<div class="callout en-clair"><b>En clair</b>Un satellite ne « flotte » pas : il <b>tombe en permanence</b>, mais il va si vite horizontalement (environ 7,7 km/s, soit 28 000 km/h à 400 km) que la Terre se dérobe sous lui. Il retombe sans jamais toucher le sol. Les astronautes de la station spatiale ne sont donc pas hors de la gravité : ils sont en <b>chute libre</b>, d’où l’apesanteur.</div>
<p>Plus l’orbite est haute, plus la vitesse du satellite est faible et plus sa période est longue (c’est une loi découverte par l’astronome Kepler).</p>
<div class="simslot" data-sim="orbit"></div>
<h2>Les principales orbites</h2>
<div class="figslot" data-fig="orbits"></div>
<div class="tw"><table><tr><th>Orbite</th><th>Altitude</th><th>Usages</th></tr>
<tr><td><dfn>Basse (LEO)</dfn></td><td>200 à 2 000 km</td><td>Station spatiale (ISS ≈ 400 km, une orbite en 92 min), observation de la Terre</td></tr>
<tr><td><dfn>Héliosynchrone</dfn></td><td>≈ 600-800 km, polaire</td><td>Observation : le satellite passe toujours à la même heure solaire locale</td></tr>
<tr><td><dfn>Moyenne (MEO)</dfn></td><td>≈ 20 000 km</td><td>Navigation : GPS (20 200 km), Galileo (23 222 km)</td></tr>
<tr><td><dfn>Géostationnaire (GEO)</dfn></td><td>35 786 km, sur l’équateur</td><td>Télécoms, TV, météo (Météosat). Période 23 h 56 min : le satellite reste au-dessus du même point.</td></tr></table></div>
<h2>Les engins spatiaux</h2>
<ul><li><b>Satellites</b> : télécommunications, observation de la Terre, navigation, météo, science.</li><li><b>Sondes spatiales</b> : explorent le système solaire (Rosetta, Voyager).</li><li><b>Stations</b> : la Station spatiale internationale (ISS), habitée en permanence depuis novembre 2000.</li><li><b>Capsules</b> (Soyouz, Dragon) et <b>navettes</b> (Space Shuttle, 1981-2011) transportent des équipages.</li></ul>
<p>Au retour dans l’atmosphère, la capsule est protégée par un <b>bouclier thermique</b> qui supporte plus de 1 500 °C. Les <b>débris spatiaux</b> sont un enjeu croissant pour la sécurité.</p>
<p>Principales agences : <b>CNES</b> (France), <b>ESA</b> (Europe), <b>NASA</b> (États-Unis), <b>Roscosmos</b> (Russie), CNSA (Chine), ISRO (Inde), JAXA (Japon).</p>
`,
keep:['Fusée : action-réaction ; elle fonctionne dans le vide ; elle est étagée.','Vitesse orbitale basse ≈ 7,7 à 7,8 km/s (28 000 km/h) ; ISS : 400 km, 92 min par tour.','Apesanteur = chute libre, pas absence de gravité.','Géostationnaire : 35 786 km, équateur, période 23 h 56 min.','Kourou : proche de l’équateur et tir vers l’est sur l’océan.'],
traps:['L’apesanteur ne signifie pas qu’il n’y a plus de gravité : à 400 km, elle vaut encore environ 90 % de celle du sol.','Un satellite géostationnaire n’est pas « immobile » : il tourne avec la Terre, à la même vitesse angulaire.'],
qs:[
['Quel principe permet à une fusée d’avancer dans le vide ?','L’action et la réaction','La portance','La poussée d’Archimède','La traînée','Les gaz sont éjectés vers l’arrière, la fusée est poussée vers l’avant.'],
['Un satellite géostationnaire se trouve :','à 35 786 km au-dessus de l’équateur','à 400 km au-dessus des pôles','à 20 200 km sur une orbite inclinée','à 700 km sur une orbite héliosynchrone','Sur cette orbite, la période est égale à celle de la rotation de la Terre.'],
['Pourquoi lance-t-on depuis Kourou ?','Proche de l’équateur, on profite de la rotation terrestre, et le tir est sur l’océan','Il y fait toujours beau','Le sol y est plus froid','Il n’y a pas de vent en Guyane','La rotation de la Terre donne un gain de vitesse, et le tir vers l’est survole l’océan.'],
['Quand l’altitude d’une orbite circulaire augmente, la période du satellite :','augmente','diminue','reste constante','devient nulle','Plus on est haut, plus la vitesse est faible et plus l’orbite est longue à parcourir.'],
['Pourquoi les astronautes de l’ISS sont-ils en apesanteur ?','Ils sont, avec la station, en chute libre autour de la Terre','Il n’y a plus de gravité à 400 km','La station est dans le vide','La Terre est trop loin','La gravité existe encore à 400 km. Station et astronautes tombent ensemble autour de la Terre.']
]});
})();

C.push({id:'4-1', th:'t4', title:'Se repérer : Terre, cartes et unités', min:14,
goals:['se repérer avec latitude et longitude','utiliser les unités de l’aviation : mille nautique, nœud, pied','lire une échelle de carte et convertir l’heure locale en UTC'],
body:`
<h2>La Terre et ses repères</h2>
<p>La Terre est quasiment une sphère, légèrement aplatie aux pôles. Pour y situer un point, on utilise deux angles :</p>
<div class="figslot" data-fig="latlon"></div>
<ul><li>la <dfn>latitude</dfn> : de 0° (équateur) à 90° nord ou sud (pôles). Les lignes de même latitude sont les <b>parallèles</b> ;</li><li>la <dfn>longitude</dfn> : de 0° (méridien de Greenwich) à 180° est ou ouest. Les lignes de même longitude sont les <b>méridiens</b>.</li></ul>
<p>Toulouse se trouve environ à 43,6° N, 1,4° E.</p>
<h2>Les unités de l’aviation</h2>
<div class="tw"><table><tr><th>Grandeur</th><th>Unité</th><th>Équivalence</th></tr><tr><td>Distance</td><td>Mille nautique (NM)</td><td>1 NM = 1 852 m = 1 minute d’arc de latitude</td></tr><tr><td>Vitesse</td><td>Nœud (kt)</td><td>1 kt = 1 NM/h = 1,852 km/h</td></tr><tr><td>Altitude</td><td>Pied (ft)</td><td>1 ft = 0,3048 m ; 1 000 ft ≈ 300 m</td></tr><tr><td>Pression</td><td>Hectopascal (hPa)</td><td>1 013,25 hPa en atmosphère standard</td></tr></table></div>
<div class="simslot" data-sim="conv"></div>
<div class="callout en-clair"><b>En clair</b>Le mille nautique est lié à la forme de la Terre : un degré de latitude fait 60 NM. Voilà pourquoi le calcul est facile sur une carte : 1° de latitude = 60 NM.</div>
<h2>La carte aéronautique</h2>
<p>Les pilotes VFR utilisent la carte <b>OACI au 1/500 000</b>, en projection de Lambert (une façon d’aplatir la Terre sur le papier). Elle est dite « conforme » : cela signifie que les angles sont conservés : on peut y mesurer une route avec un rapporteur. Sur cette carte, une ligne droite est (presque) le plus court chemin entre deux points.</p>
<p class="formule">échelle 1/500 000 : 1 cm sur la carte = 5 km sur le terrain</p>
<p>On y lit : le relief (courbes de niveau et teintes), les aérodromes, les espaces aériens, les obstacles, les radiophares, des repères visuels (rivières, voies ferrées, lacs).</p>
<h2>Nord vrai, nord magnétique</h2>
<p>Le <b>nord vrai</b> est la direction du pôle géographique. Le <b>nord magnétique</b> est celui qu’indique le compas : il s’en écarte d’un petit angle, la <dfn>déclinaison magnétique</dfn> (faible en France métropolitaine, de l’ordre de 1 à 3°). On mesure une route sur la carte par rapport au nord vrai (route vraie), puis on la convertit en cap magnétique à afficher au compas.</p>
<div class="figslot" data-fig="northfig"></div>
<h2>L’heure en aviation : UTC</h2>
<p>Pour éviter les confusions entre fuseaux horaires, toutes les heures aéronautiques sont en <b>UTC</b> (temps universel coordonné), notée <b>Z</b>. En France, l’heure locale vaut <b>UTC + 1 l’hiver</b> et <b>UTC + 2 l’été</b>.</p>
<div class="callout exemple"><b>Exemple</b>Un décollage à 14 h 00 en été, heure locale, correspond à 12 h 00 UTC.</div>
`,
keep:['Latitude (0-90° N/S) et longitude (0-180° E/O).','1 NM = 1 852 m = 1 minute d’arc de latitude ; 1 kt = 1 NM/h = 1,852 km/h ; 1 ft = 0,3048 m.','Carte OACI : 1/500 000, projection de Lambert ; 1 cm = 5 km.','La déclinaison sépare nord vrai et nord magnétique.','UTC = heure locale − 1 h l’hiver, − 2 h l’été (en France).'],
traps:['Ne mélange pas NM et km : une erreur de 10 % sur la distance fausse tout le calcul de durée.','Les heures météo (METAR, TAF) et les plans de vol sont en UTC, pas en heure locale.'],
qs:[
['Un mille nautique (NM) vaut :','1 852 m','1 609 m','1 000 m','1 480 m','Un mille nautique correspond à une minute d’arc de latitude, soit 1 852 m.'],
['Sur une carte au 1/500 000, 4 cm représentent :','20 km','2 km','200 km','4 km','1 cm correspond à 5 km sur le terrain : 4 × 5 = 20 km.'],
['Une vitesse de 1 nœud est égale à :','1 mille nautique par heure','1 km par heure','1 mètre par seconde','1 pied par minute','Un nœud = 1 NM/h = 1,852 km/h.'],
['En France, en été, quand il est 14 h 00 à l’heure locale, il est en UTC :','12 h 00','13 h 00','15 h 00','16 h 00','L’été, l’heure locale est UTC + 2 : 14 h − 2 h = 12 h UTC.']
]});

C.push({id:'4-2', th:'t4', title:'Navigation à l’estime et vent', min:18,
goals:['définir route, cap, dérive, vitesse propre et vitesse sol','calculer durée et distance avec la formule temps = distance / vitesse','construire un triangle des vitesses pour corriger le vent'],
body:`
<p>Naviguer, c’est savoir où l’on est, où l’on va, et à quelle heure on y sera. La méthode de base est la navigation <b>à l’estime</b> : on part d’un point connu, on calcule le chemin parcouru à partir de la route, de la vitesse et du temps.</p>
<h2>Vocabulaire</h2>
<ul><li><dfn>Route</dfn> (Rv) : direction de la <b>trajectoire</b> de l’avion sur le sol, mesurée depuis le nord.</li><li><dfn>Cap</dfn> (Cv) : direction dans laquelle <b>pointe le nez</b> de l’avion.</li><li><dfn>Dérive</dfn> : angle entre le cap et la route, causé par le vent.</li><li><dfn>Vitesse propre</dfn> (TAS) : vitesse de l’avion dans l’air. <dfn>Vitesse sol</dfn> (GS) : vitesse par rapport au sol.</li></ul>
<h2>Temps, distance, vitesse</h2>
<p class="formule">t (min) = 60 × d (NM) / V (kt)</p>
<div class="callout exemple"><b>Exemple</b>Pour 60 NM à 120 kt de vitesse sol : t = 60 × 60 / 120 = 30 minutes. La consommation se calcule de la même façon : 30 litres par heure × 0,5 h = 15 litres.</div>
<h2>Le vent et le triangle des vitesses</h2>
<p>L’avion se déplace dans une masse d’air qui se déplace elle-même. Imagine un nageur qui traverse une rivière : s’il pointe droit vers l’autre rive, le courant l’entraîne. Pour arriver en face, il doit nager un peu en amont.</p>
<div class="figslot" data-fig="windtri"></div>
<p>Le <b>triangle des vitesses</b> assemble trois vecteurs : trois flèches (des vecteurs) : celle de l’avion dans l’air (cap et vitesse propre), celle du vent, et leur somme, celle de l’avion par rapport au sol (route et vitesse sol). Pour une route et un vent donnés, on le résout pour trouver le <b>cap</b> à afficher et la <b>vitesse sol</b>.</p>
<div class="simslot" data-sim="nav"></div>
<ul><li>Le <b>vent de face</b> diminue la vitesse sol ; le <b>vent arrière</b> l’augmente.</li><li>Le <b>vent traversier</b> crée la dérive. Pour la compenser, on affiche un cap <b>du côté d’où vient le vent</b> par rapport à la route.</li><li>Exemple : route au nord (360°), vent d’ouest. Le vent pousse vers l’est. On affiche un cap un peu à gauche de la route, par exemple 350°.</li></ul>
<h2>La règle du 1 sur 60</h2>
<p>À 60 NM de distance, une erreur de cap de 1° produit un écart de <b>1 NM</b>. C’est une approximation très utile pour estimer rapidement une correction : si, à 30 NM du départ, tu as 2 NM d’écart, ton erreur de cap est d’environ 4°.</p>
<h2>Préparer un vol</h2>
<ol><li>Tracer la route sur la carte, choisir des points de repère.</li><li>Mesurer route et distance.</li><li>Récupérer le vent prévu, calculer cap, vitesse sol, durée.</li><li>Calculer le carburant (avec les réserves réglementaires, dont 30 minutes de vol à vue de jour minimum au-delà du terrain de destination).</li><li>Déposer un plan de vol si nécessaire, et prévenir un proche de l’heure d’arrivée.</li></ol>
<p>En vol, on vérifie la route par des <b>repères visuels</b> (rivière, route, ville) et on ajuste.</p>
`,
keep:['Route = trajectoire sur le sol ; cap = direction du nez ; dérive = angle entre les deux.','t = d / V : 60 NM à 120 kt de vitesse sol = 30 min.','Vent de face : vitesse sol plus faible ; vent arrière : plus forte.','Le cap se corrige du côté d’où vient le vent.','Règle du 1 sur 60 : 1° d’erreur = 1 NM d’écart pour 60 NM.'],
traps:['Cap et route sont différents dès qu’il y a du vent.','Le calcul de durée utilise la vitesse sol, pas la vitesse propre.'],
qs:[
['La dérive est l’angle entre :','le cap et la route','la route et le nord','le cap et le vent','le sol et l’horizon','Sans vent, cap = route. Avec du vent, la dérive les sépare.'],
['Un avion vole à 100 kt de vitesse propre avec 20 kt de vent de face. Sa vitesse sol est :','80 kt','120 kt','100 kt','20 kt','Le vent de face retranche 20 kt : 100 − 20 = 80 kt.'],
['Quelle est la durée d’un vol de 60 NM à 120 kt de vitesse sol ?','30 minutes','60 minutes','15 minutes','2 heures','t = 60 × 60 / 120 = 30 minutes.'],
['Route au 360°, vent d’ouest (270°). Pour tenir la route, le cap sera :','inférieur à 360° (par exemple 350°)','supérieur à 360° (par exemple 010°)','égal à 360°','180°','Le vent pousse vers l’est. On affiche un cap qui « remonte le vent », donc du côté ouest de la route.'],
['Selon la règle du 1 sur 60, une erreur de cap de 1° produit à 60 NM un écart de :','1 NM','6 NM','60 NM','0,1 NM','C’est la règle de base : 1° vaut environ 1 NM à 60 NM de distance.']
]});

C.push({id:'4-3', th:'t4', title:'Radionavigation et GNSS', min:12,
goals:['décrire VOR, NDB/ADF, DME, ILS','expliquer le principe du GNSS','citer les limites et la complémentarité des moyens'],
body:`
<p>La navigation à vue ne suffit plus quand la visibilité baisse ou que le voyage est long. Les aides à la navigation s’appuient sur des signaux radio.</p>
<h2>Les moyens classiques</h2>
<div class="figslot" data-fig="vor"></div>
<div class="tw"><table><tr><th>Moyen</th><th>Ce qu’il donne</th><th>Détails</th></tr>
<tr><td><dfn>VOR</dfn></td><td>Un radial : la demi-droite, numérotée de 0 à 360°, sur laquelle tu te trouves autour de la balise</td><td>Ondes VHF (108-118 MHz). Précis, avec peu de perturbations</td></tr>
<tr><td><dfn>NDB / ADF</dfn></td><td>La <b>direction</b> de la balise (aiguille du radiocompas)</td><td>Ondes moyennes ; sensible aux orages. En voie de disparition</td></tr>
<tr><td><dfn>DME</dfn></td><td>La <b>distance</b> oblique à la station, en NM</td><td>Interrogation-réponse. Souvent associé à un VOR</td></tr>
<tr><td><dfn>ILS</dfn></td><td>Un <b>guidage vertical et horizontal</b> pour l’approche aux instruments</td><td>Le localizer donne l’axe de piste ; le glide donne le plan de descente (≈ 3°)</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Un VOR est comme un phare qui émet 360 faisceaux : chaque faisceau a un numéro, c’est un radial. Si tu sais sur quel radial tu es, et à quelle distance (DME), tu sais où tu es.</div>
<h2>Le GNSS (navigation par satellite)</h2>
<p>Un récepteur GNSS reçoit les signaux de plusieurs satellites. Chaque signal contient l’heure d’émission et la position du satellite ; en comparant l’heure de réception, le récepteur calcule sa distance à chacun. Avec au moins 4 satellites, il détermine sa position en trois dimensions (latitude, longitude, altitude) et remet son horloge à l’heure (une erreur d’un millionième de seconde fausserait le calcul de centaines de mètres).</p>
<div class="figslot" data-fig="gnss"></div>
<ul><li>Constellations : <b>GPS</b> (États-Unis), <b>Galileo</b> (Europe), GLONASS (Russie), BeiDou (Chine).</li><li>Les satellites sont en orbite moyenne (≈ 20 000 km).</li><li>Limites : brouillage, perturbations, panne. Un pilote doit toujours savoir naviguer sans GNSS (carte, repères, compas).</li></ul>
<h2>La surveillance</h2>
<p>Le radar primaire envoie une onde qui rebondit sur l’avion, comme l’écho dans une grotte. Le <b>radar secondaire</b> interroge le <b>transpondeur</b> de l’avion qui répond avec un code et son altitude. L’<b>ADS-B</b> diffuse automatiquement la position de l’avion calculée par GNSS.</p>
`,
keep:['VOR : radial vers/depuis la balise ; DME : distance ; NDB : direction.','ILS : localizer (axe) + glide (pente 3°).','GNSS : au moins 4 satellites pour la position 3D ; GPS, Galileo, GLONASS, BeiDou.','Radar secondaire : réponse du transpondeur.','Garder toujours une capacité de navigation sans GNSS.'],
traps:['Le DME donne une distance oblique : à la verticale d’une balise en altitude, il n’indique pas zéro.','Galileo est européen, pas américain.'],
qs:[
['Combien de satellites faut-il au minimum pour obtenir une position en 3D par GNSS ?','4','2','3 satellites suffisent toujours','12','Trois satellites donnent trois distances ; un quatrième permet de corriger l’horloge du récepteur.'],
['L’ILS fournit :','le guidage horizontal (axe de piste) et vertical (pente de descente)','seulement la distance à la piste','la météo de l’aérodrome','le cap magnétique de la piste','Le localizer donne l’axe, le glide donne la pente, pour un atterrissage aux instruments.'],
['Le DME donne :','la distance à la station','l’altitude','le cap à suivre','la vitesse du vent','Le DME mesure le temps de réponse d’une station au sol : il en déduit la distance.'],
['Galileo est un système de navigation par satellite :','européen','américain','russe','chinois','Galileo est la constellation européenne, comme GPS pour les États-Unis.']
]});

C.push({id:'4-4', th:'t4', title:'Altimétrie : altitude, hauteur, niveau de vol', min:16,
goals:['différencier altitude, hauteur et niveau de vol','choisir le bon calage (QNH, QFE, 1013)','expliquer l’erreur de l’altimètre quand la pression change'],
body:`
<p>L’altimètre est en réalité un baromètre : il mesure la pression statique et la traduit en altitude grâce à l’atmosphère standard. Comme la pression change avec la météo, on doit l’étalonner : c’est le <b>calage</b>.</p>
<h2>Trois mots à ne pas confondre</h2>
<ul><li><dfn>Altitude</dfn> : distance verticale au-dessus du <b>niveau moyen de la mer</b> (MSL, « mean sea level » : le niveau moyen de la mer).</li><li><dfn>Hauteur</dfn> : distance verticale au-dessus d’un point précis (le sol survolé, l’aérodrome).</li><li><dfn>Niveau de vol</dfn> (FL) : altitude-pression calculée avec le calage standard 1013,25 hPa, en centaines de pieds. FL 075 = 7 500 ft ; FL 350 ≈ 35 000 ft.</li></ul>
<h2>Les trois calages</h2>
<div class="tw"><table><tr><th>Calage</th><th>Que lit-on ?</th><th>Quand l’utiliser ?</th></tr><tr><td><dfn>QNH</dfn></td><td>L’<b>altitude</b> au-dessus de la mer. Au sol sur l’aérodrome, l’altimètre donne l’altitude du terrain.</td><td>En dessous de l’altitude de transition : voler à vue, approche et atterrissage</td></tr><tr><td><dfn>QFE</dfn></td><td>La <b>hauteur</b> au-dessus de l’aérodrome. Au sol, il indique zéro.</td><td>Circuits d’aérodrome (certains pays)</td></tr><tr><td><dfn>1013</dfn></td><td>Le <b>niveau de vol</b>.</td><td>Au-dessus de l’altitude de transition : tous les avions utilisent la même référence, ce qui évite les erreurs de calage entre pilotes et garantit les séparations</td></tr></table></div>
<p>Le QNH est communiqué par le METAR, l’ATIS ou le contrôle. L’<b>altitude de transition</b> (souvent 3 500 à 5 000 ft selon la région) sépare le domaine des altitudes (QNH) de celui des niveaux de vol (1013).</p>
<div class="figslot" data-fig="altlevels"></div>
<div class="simslot" data-sim="alti"></div>
<h2>Une erreur à connaître</h2>
<p>Un changement de pression modifie l’indication de l’altimètre : environ <b>1 hPa = 30 ft</b>. Si tu voles d’une zone de haute pression vers une zone de basse pression sans retoucher le calage, l’altimètre <b>surestime</b> ton altitude : tu es plus bas que tu ne le crois. D’où le moyen mnémotechnique anglais : « From high to low, look out below » (de haut en bas, attention en dessous).</p>
<div class="callout attention"><b>Attention</b>Le froid fait aussi surestimer l’altitude : par temps très froid, l’altimètre indique plus haut que la vraie altitude (tu es plus bas que ce qu’il affiche). Il faut prendre de la marge sur les obstacles.</div>
<h2>Radio-altimètre</h2>
<p>Sur les gros avions, un radio-altimètre mesure directement la hauteur au-dessus du sol par écho radar.</p>
`,

C.push({id:'4-5', th:'t4', title:'Règles de l’air et espaces aériens', min:16,
goals:['connaître les règles de priorité et d’évitement','distinguer VFR et IFR, VMC et IMC','reconnaître les principaux espaces aériens et leurs services'],
body:`
<h2>Voler à vue ou aux instruments</h2>
<ul><li><dfn>VFR</dfn> (<i>Visual Flight Rules</i>) : le pilote se repère et évite les obstacles par la vue. Il faut des conditions météo suffisantes : <dfn>VMC</dfn> (<i>Visual Meteorological Conditions</i>).</li><li><dfn>IFR</dfn> (<i>Instrument Flight Rules</i>) : le pilote suit ses instruments, même dans les nuages. Qualification supplémentaire.</li></ul>
<p>Ordres de grandeur des minima VFR dans l’espace contrôlé sous le FL 100 : visibilité de <b>5 km</b>, distance aux nuages de <b>1 500 m horizontalement</b> et <b>300 m (1 000 ft) verticalement</b>.</p>
<h2>Évitement des collisions : « voir et éviter »</h2>
<p>En VFR, c’est le pilote qui regarde dehors. Les règles de priorité :</p>
<div class="figslot" data-fig="rightofway"></div>
<div class="tw"><table><tr><th>Situation</th><th>Règle</th></tr><tr><td>Routes qui se croisent</td><td>Celui qui voit l’autre arriver à sa droite lui cède le passage</td></tr><tr><td>Face à face</td><td>Chacun <b>dévie vers sa droite</b></td></tr><tr><td>Dépassement</td><td>Le plus rapide dépasse <b>par la droite</b> ; l’avion dépassé a priorité</td></tr><tr><td>Atterrissage</td><td>L’aéronef le plus bas, en phase finale, a priorité sur ceux qui sont plus hauts et sur ceux au sol</td></tr><tr><td>Type d’aéronef (le moins facile à manœuvrer est prioritaire)</td><td>Le moins manœuvrable a priorité : ballon &gt; planeur &gt; dirigeable &gt; aéronef remorquant &gt; aéronef à moteur</td></tr><tr><td>Détresse</td><td>L’aéronef en détresse a toujours priorité</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Plus un aéronef est difficile à manœuvrer, plus il a priorité : un ballon n’a pas de gouvernail.</div>
<h2>Hauteurs minimales</h2>
<p>En règle générale, on ne vole pas en dessous de <b>500 ft</b> (150 m) au-dessus du sol ou de l’eau, et de <b>1 000 ft</b> (300 m) au-dessus des agglomérations et rassemblements de personnes. Exceptions : décollage et atterrissage.</p>
<h2>L’espace aérien</h2>
<p>L’espace est découpé en volumes pour organiser la circulation. On distingue :</p>
<div class="figslot" data-fig="airspace"></div>
<ul><li>les espaces <b>contrôlés</b> : un contrôleur donne des autorisations et sépare les avions. Exemples : <dfn>CTR</dfn> (zone de contrôle autour d’un aérodrome, du sol jusqu’à un plafond), <dfn>TMA</dfn> (région de contrôle terminale, au-dessus des CTR, là où convergent les routes), <dfn>CTA</dfn>, <dfn>AWY</dfn> (voies aériennes) ;</li><li>les espaces non contrôlés (classe G) : personne ne donne d’autorisation, le pilote est responsable de sa séparation avec les autres, il peut obtenir un service d’information de vol ;</li><li>les <b>zones à statut particulier</b> : <b>P</b> (interdites), <b>R</b> (réglementées), <b>D</b> (dangereuses : tirs, parachutage), zones de protection de la nature, etc. La carte et les NOTAM indiquent leur activité.</li></ul>
<p>Le <b>service de la navigation aérienne</b> assure trois services : le <b>contrôle</b> (séparation), l’<b>information de vol</b> (renseignements utiles) et l’<b>alerte</b> (déclenchement des secours). Un <b>NOTAM</b> est un message qui signale une modification temporaire (piste fermée, zone active…).</p>
<p>Le <b>transpondeur</b> doit être sur le code <b>7000</b> en VFR lorsqu’aucun autre code ne t’a été attribué.</p>
`,

C.push({id:'4-6', th:'t4', title:'Aérodrome, circuit et approche', min:18,
goals:['décrire le circuit d’aérodrome et ses étapes','lire la numérotation de piste et le vent','utiliser le PAPI pour juger la pente d’approche'],
body:`
<h2>La piste et ses repères</h2>
<div class="figslot" data-fig="runway"></div>
<ul><li><b>Numéro de piste</b> : cap magnétique de la piste divisé par 10 et arrondi. Piste 27 = cap 270° ; elle a une extrémité opposée numérotée 09 (090°). Le suffixe L, C, R précise gauche, centre, droite pour les pistes parallèles.</li><li><b>Manche à air</b> (windsock) : indique l’origine et la force du vent. Le « T » d’atterrissage indique la piste en service sur certains terrains.</li><li><b>Marquage</b> : seuils (barres), axe (traits discontinus), zone de toucher, numéros.</li><li><b>Balisage lumineux de nuit</b> : bord de piste blanc, seuil vert, fin de piste rouge ; voies de circulation en bleu.</li></ul>
<h2>On atterrit et on décolle face au vent</h2>
<p>Face au vent, la vitesse par rapport au sol est plus faible pour la même vitesse dans l’air : distances de roulage plus courtes, impact moins violent, contrôle facilité. Quand la piste n’est pas alignée avec le vent, il apparaît un <b>vent traversier</b>.</p>
<h2>Le circuit d’aérodrome</h2>
<p>Pour organiser les avions autour de la piste, tous suivent le même <b>tour de piste</b>, par défaut <b>à main gauche</b> (virages à gauche), à environ <b>1 000 ft</b> au-dessus de l’aérodrome. Cinq étapes :</p>
<ol><li><b>Montée initiale</b> dans l’axe.</li><li><b>Vent traversier</b> : virage de 90° à environ 500 ft.</li><li><b>Vent arrière</b> : parallèle à la piste, sens inverse de l’atterrissage, en palier.</li><li><b>Étape de base</b> : virage de 90° en direction de la piste, en descendant.</li><li><b>Finale</b> : alignement sur l’axe, descente, arrondi, toucher.</li></ol>
<div class="simslot" data-sim="circuit"></div>
<p>À chaque étape, on annonce sa position à la radio (ou on regarde les autres en l’absence de contrôle). Si l’approche n’est pas stabilisée, on fait une <b>remise de gaz</b> (<i>go-around</i>) : plein gaz, on remonte et on recommence. Aucune honte à cela, c’est une décision de sécurité.</p>
<h2>Le PAPI</h2>
<p>Le <dfn>PAPI</dfn> (<i>Precision Approach Path Indicator</i>) est un ensemble de quatre feux placés à côté de la piste. Chaque feu est blanc ou rouge selon l’angle sous lequel tu le vois. Pente nominale : <b>3°</b>.</p>
<div class="tw"><table><tr><th>Ce que tu vois</th><th>Position</th></tr><tr><td>4 blancs</td><td>Bien trop haut</td></tr><tr><td>3 blancs, 1 rouge</td><td>Un peu haut</td></tr><tr><td><b>2 blancs, 2 rouges</b></td><td><b>Sur la pente</b></td></tr><tr><td>1 blanc, 3 rouges</td><td>Un peu bas</td></tr><tr><td>4 rouges</td><td>Bien trop bas</td></tr></table></div>
<div class="simslot" data-sim="papi"></div>
<h2>Signaux lumineux de la tour (pistolet)</h2>
<p>En cas de panne radio : <b>vert fixe</b> = autorisé à atterrir ; <b>rouge fixe</b> = cède le passage et continue à tourner ; <b>rouge clignotant</b> = aérodrome dangereux, n’atterris pas.</p>
`,

C.push({id:'4-7', th:'t4', title:'Radio, urgences, facteurs humains et organisation', min:18,
goals:['utiliser les messages Mayday et Pan Pan et les codes du transpondeur','appliquer la méthode « Aviser, Naviguer, Communiquer »','citer les principaux facteurs humains et organismes de l’aviation'],
body:`
<h2>La radio en aviation</h2>
<p>Les communications utilisent la VHF aéronautique (118 à 137 MHz) en anglais ou en français selon le contexte, avec une <b>phraséologie normalisée</b> : brève, claire, sans ambiguïté. Chaque message commence par le nom de la station appelée, puis l’indicatif de l’appareil. Les consignes importantes sont répétées mot pour mot (on dit « collationnées ») pour vérifier qu’on a bien compris.</p>
<div class="figslot" data-fig="radiocall"></div>
<h2>Détresse et urgence</h2>
<div class="tw"><table><tr><th>Message</th><th>Situation</th></tr><tr><td><dfn>MAYDAY</dfn> (3 fois)</td><td><b>Détresse</b> : danger grave et imminent pour l’aéronef ou ses occupants</td></tr><tr><td><dfn>PAN PAN</dfn> (3 fois)</td><td><b>Urgence</b> : situation difficile mais sans danger immédiat (problème technique, malaise…)</td></tr></table></div>
<ul><li>Fréquence de détresse : <b>121,5 MHz</b> (VHF).</li><li>Codes de transpondeur : <b>7700</b> détresse ; <b>7600</b> panne radio ; <b>7500</b> intervention illicite ; <b>7000</b> VFR.</li><li>La <b>balise de détresse</b> (ELT) se déclenche automatiquement après un choc et émet sur 406 MHz.</li></ul>
<h2>Panne moteur : aviser, naviguer, communiquer</h2>
<ol><li><b>Aviser (Aviate)</b> : piloter l’avion d’abord. Afficher la vitesse de meilleure finesse, trimer.</li><li><b>Naviguer (Navigate)</b> : choisir un terrain d’atterrissage, se diriger vers lui.</li><li><b>Communiquer (Communicate)</b> : lancer un message Mayday, afficher le code 7700.</li></ol>
<div class="callout attention"><b>Règle d’or</b>Le pilote ne se laisse jamais distraire de sa mission première : piloter l’avion. Un avion en panne de moteur plane encore longtemps.</div>
<h2>Facteurs humains</h2>
<p>La majorité des accidents ont une cause humaine. Quelques facteurs à connaître :</p>
<div class="figslot" data-fig="swiss"></div>
<ul><li><b>Fatigue et stress</b> altèrent le jugement et la mémoire.</li><li><b>Hypoxie</b> : manque d’oxygène dans le sang, en altitude (au-delà de 10 000 ft sans oxygène) ; signes : euphorie, maux de tête, vision dégradée.</li><li><b>Alcool, médicaments, drogues</b> : incompatibles avec le vol.</li><li><b>Illusions sensorielles</b> : sans repère extérieur (nuages, nuit), l’oreille interne trompe le pilote. Il doit se fier aux instruments.</li><li><b>Pression du temps</b> : vouloir arriver à tout prix conduit à ignorer la météo.</li><li><b>Vision</b> : balayer l’horizon en tournant la tête, car l’œil a un angle mort.</li></ul>
<p>La <b>gestion des ressources de l’équipage</b> (CRM) apprend à communiquer, partager la charge de travail et prendre des décisions. La culture juste (un climat de confiance où l’on ne punit pas l’erreur honnête) encourage à déclarer ses erreurs pour en tirer des enseignements.</p>
<h2>Titres et organismes</h2>
<div class="tw"><table><tr><th>Organisme</th><th>Rôle</th></tr><tr><td><b>OACI</b> (ICAO)</td><td>Organisation de l’aviation civile internationale, créée à Chicago en 1944, siège à Montréal, dépend de l’ONU. Elle fixe les normes mondiales.</td></tr><tr><td><b>AESA</b> (EASA)</td><td>Agence européenne de la sécurité aérienne (Cologne)</td></tr><tr><td><b>DGAC</b></td><td>Direction générale de l’aviation civile : réglementation et sécurité en France. Elle comprend la DSNA (navigation aérienne).</td></tr><tr><td><b>Météo-France</b></td><td>Service météorologique national</td></tr><tr><td><b>BEA</b></td><td>Bureau d’enquêtes et d’analyses : enquête sur les accidents pour en tirer des leçons, sans chercher à désigner un coupable.</td></tr><tr><td><b>CNES</b></td><td>Centre national d’études spatiales</td></tr></table></div>
<p>Pour devenir pilote : le <b>BIA</b> n’est pas un brevet de pilote, mais une base de connaissances. L’âge minimal est de 16 ans pour la licence LAPL, 17 ans pour la licence de pilote privé (PPL), 18 ans pour pilote professionnel (CPL) et 21 ans pour pilote de ligne (ATPL), avec un certificat médical d’aptitude. Le vol en planeur peut commencer plus tôt.</p>
`,

C.push({id:'5-1', th:'t5', title:'Des premiers rêves aux premiers avions (jusqu’en 1914)', min:14,
goals:['situer les débuts de l’aérostation et de l’aviation','associer pionniers, machines et dates','comprendre pourquoi la France a joué un rôle central'],
body:`
<p>Les hommes ont toujours regardé les oiseaux avec envie : le mythe d’Icare en est le témoin. Mais voler vraiment a demandé du génie, des essais et du courage.</p>
<h2>Les ballons : l’air conquis en 1783</h2>
<ul><li><b>Léonard de Vinci</b> (vers 1490) dessine des machines volantes, mais aucune ne vole.</li><li>Juin 1783 : les frères <b>Montgolfier</b> font s’élever un ballon à air chaud à Annonay.</li><li><b>21 novembre 1783</b> : <b>Pilâtre de Rozier</b> et le <b>marquis d’Arlandes</b> sont les premiers humains à voler, à Paris, en montgolfière.</li><li><b>1er décembre 1783</b> : <b>Jacques Charles</b> et Robert volent dans un ballon à hydrogène.</li><li><b>1852</b> : <b>Henri Giffard</b> réalise le premier dirigeable à vapeur. <b>1900</b> : premier Zeppelin allemand.</li></ul>
<h2>Les planeurs, puis l’avion</h2>
<div class="figslot" data-fig="wrightbar"></div>
<ul><li><b>Otto Lilienthal</b> (1891-1896), Allemand, accomplit plus de 2 000 vols planés.</li><li><b>9 octobre 1890</b> : <b>Clément Ader</b> décolle avec l’<b>Éole</b>, un appareil à moteur à vapeur, sur environ 50 m. Il invente le mot « avion ».</li><li><b>17 décembre 1903</b> : les frères <b>Wright</b> réussissent à Kitty Hawk le premier vol motorisé, soutenu et contrôlé.</li><li><b>1906</b> : <b>Alberto Santos-Dumont</b> vole avec le 14-bis à Paris (Bagatelle), premier vol homologué en Europe.</li><li><b>1907</b> : <b>Paul Cornu</b> réalise le premier décollage libre d’un hélicoptère.</li></ul>
<h2>L’effervescence de 1909-1914</h2>
<ul><li><b>25 juillet 1909</b> : <b>Louis Blériot</b> traverse la Manche en 37 minutes. Le monde comprend que l’avion peut franchir des obstacles.</li><li><b>1910</b> : <b>Henri Fabre</b> fait voler le premier hydravion ; <b>Raymonde de Laroche</b> est la première femme à obtenir le brevet de pilote.</li><li><b>1913</b> : <b>Roland Garros</b> traverse la Méditerranée (Fréjus-Bizerte).</li></ul>
<div class="callout en-clair"><b>En clair</b>Jusqu’en 1903 on apprenait à flotter (ballons) puis à planer (Lilienthal). Les Wright ont réussi à combiner le vol motorisé et la maîtrise du pilotage : c’est ce qui fait leur gloire.</div>
<div class="simslot" data-sim="timeline" data-era="o"></div>
`,
keep:['21 novembre 1783 : premiers humains en montgolfière (Pilâtre de Rozier, marquis d’Arlandes). 1er décembre : Charles et Robert, ballon à hydrogène.','1852 : dirigeable de Giffard. 1890 : Éole d’Ader.','17 décembre 1903 : premier vol motorisé contrôlé, frères Wright.','1906 : Santos-Dumont (14-bis). 25 juillet 1909 : Blériot traverse la Manche.','1910 : premier hydravion (Fabre) et première femme brevetée (Raymonde de Laroche).'],
traps:['Ader a décollé en 1890 mais son vol n’était pas contrôlé ni soutenu : on retient les Wright pour le premier vol complet.','Ne confonds pas les Montgolfier (air chaud) et Charles (hydrogène).'],

['Quel gaz Jacques Charles utilisait-il pour son ballon, le 1er décembre 1783 ?','L’hydrogène','L’air chaud','L’hélium','Le méthane','Charles lança les ballons à gaz (« charlières ») avec de l’hydrogène.'],
['Quel pionnier français décolle avec l’Éole en 1890 ?','Clément Ader','Louis Blériot','Henri Fabre','Alberto Santos-Dumont','Ader fit décoller l’Éole le 9 octobre 1890. C’est lui qui a baptisé « avion » ses machines.'],
['Que réussissent les frères Wright le 17 décembre 1903 ?','Le premier vol motorisé, soutenu et contrôlé','La traversée de la Manche','Le premier vol en ballon','Le premier vol en hélicoptère','Le Wright Flyer a volé à Kitty Hawk, en Caroline du Nord.'],

C.push({id:'5-2', th:'t5', title:'Guerre, records et lignes aériennes (1914-1939)', min:14,
goals:['expliquer le rôle de l’aviation pendant la Première Guerre mondiale','situer les grands records et les premières lignes commerciales','citer les grandes figures de l’entre-deux-guerres'],
body:`
<h2>La Grande Guerre (1914-1918)</h2>
<p>En quatre ans, l’avion passe de curiosité à arme décisive. Les premiers avions servent à la <b>reconnaissance</b>. Pour les abattre, on invente la <b>chasse</b>, avec des mitrailleuses qui tirent à travers le disque de l’hélice. Puis viennent le <b>bombardement</b> et la photographie aérienne. Des as marquent les esprits : <b>Georges Guynemer</b> (France), <b>René Fonck</b> (France, premier as allié en nombre de victoires), <b>Manfred von Richthofen</b>, « le Baron rouge » (Allemagne). Avions célèbres : <b>SPAD XIII</b>, Nieuport, Sopwith Camel, Fokker Dr.I.</p>
<h2>L’aviation civile naît</h2>
<ul><li><b>1919</b> : <b>Alcock et Brown</b> effectuent la première traversée sans escale de l’Atlantique Nord (Terre-Neuve → Irlande).</li><li><b>1919</b> : <b>Pierre-Georges Latécoère</b> ouvre la ligne <b>Toulouse-Casablanca</b>, qui deviendra l’<b>Aéropostale</b> avec <b>Jean Mermoz</b>, <b>Henri Guillaumet</b> et <b>Antoine de Saint-Exupéry</b>, pilotes du courrier vers l’Amérique du Sud.</li><li><b>1927</b> : <b>Charles Lindbergh</b> relie <b>New York à Paris</b> en solitaire, sans escale, en 33 h 30.</li><li><b>1930</b> : Mermoz traverse l’Atlantique Sud avec du courrier. Dieudonné <b>Costes</b> et Maurice <b>Bellonte</b> réalisent Paris-New York.</li><li><b>1933</b> : création de la compagnie nationale <b>Air France</b>.</li></ul>
<h2>Des pionnières</h2>
<p>Raymonde de Laroche (1910), Adrienne Bolland (traversée des Andes, 1921), Maryse Bastié et Hélène Boucher (records dans les années 1930), l’Américaine Amelia Earhart (traversée de l’Atlantique en solitaire en 1932).</p>
<h2>Évolution technique</h2>
<p>Entre 1919 et 1939, l’avion passe du bois et de la toile au métal, du biplan au monoplan, du train fixe au train rentrant. Les vitesses et les distances explosent. En 1937, le Hindenburg, dirigeable rempli d’hydrogène, brûle à Lakehurst : la fin de l’ère des grands dirigeables transatlantiques. L’avion de ligne prend le relais.</p>
<div class="simslot" data-sim="timeline" data-era="g"></div>
`,
keep:['Première Guerre mondiale : reconnaissance, puis chasse, puis bombardement.','1919 : Alcock et Brown (Atlantique Nord) ; Latécoère (Toulouse-Casablanca) → Aéropostale (Mermoz, Saint-Exupéry).','1927 : Lindbergh, New York-Paris en solitaire.','1933 : naissance d’Air France.','1937 : Hindenburg, fin des grands dirigeables.'],
traps:['Lindbergh a volé de New York à Paris (1927) ; Alcock et Brown ont traversé en 1919 en équipage, de Terre-Neuve à l’Irlande.','Saint-Exupéry est pilote de l’Aéropostale avant d’être l’auteur du Petit Prince.'],
qs:[
['Quel rôle a d’abord joué l’avion pendant la Première Guerre mondiale ?','La reconnaissance','Le bombardement lourd','Le transport de troupes','La lutte anti-sous-marine','Les premiers avions de guerre ont observé les lignes ennemies. La chasse et le bombardement viennent ensuite.'],
['Qui relie New York à Paris en solitaire sans escale en 1927 ?','Charles Lindbergh','Jean Mermoz','Louis Blériot','Roland Garros','Lindbergh traverse l’Atlantique en 33 h 30 à bord du Spirit of St. Louis.'],
['L’Aéropostale transportait principalement :','le courrier','des marchandises lourdes','des soldats','des touristes','L’Aéropostale reliait la France à l’Afrique et à l’Amérique du Sud pour le courrier. Mermoz et Saint-Exupéry y volaient.'],
['Qui a été la première femme à obtenir un brevet de pilote, en 1910 ?','Raymonde de Laroche','Amelia Earhart','Maryse Bastié','Hélène Boucher','Raymonde de Laroche a obtenu le brevet n° 36 de l’Aéro-Club de France.'],
['En 1919, Alcock et Brown réussissent :','la première traversée sans escale de l’Atlantique Nord','le premier vol en hélicoptère','la traversée de la Manche','le premier vol supersonique','Ils ont volé de Terre-Neuve à l’Irlande.']
]});

C.push({id:'5-3', th:'t5', title:'Jets, avions de ligne et Concorde (depuis 1939)', min:14,
goals:['expliquer l’arrivée du moteur à réaction et du vol supersonique','situer Caravelle, Concorde et Airbus','comprendre le rôle de Toulouse dans l’aéronautique européenne'],
body:`
<h2>L’ère du moteur à réaction</h2>
<ul><li><b>27 août 1939</b> : l’allemand <b>Heinkel He 178</b> est le premier avion à réaction à voler, avec un turboréacteur conçu par Hans von Ohain. En Grande-Bretagne, Frank Whittle développe en parallèle son propre moteur.</li><li>Pendant la Seconde Guerre mondiale, la guerre du ciel fait progresser les techniques : radar, avions rapides, premiers chasseurs à réaction, bombardiers lourds. La Bataille d’Angleterre (1940) oppose Spitfire et Messerschmitt Bf 109. Les Français libres combattent dans la RAF et le régiment <b>Normandie-Niemen</b> aux côtés des Soviétiques.</li><li><b>14 octobre 1947</b> : <b>Chuck Yeager</b> franchit le mur du son (Mach 1) à bord du Bell X-1.</li></ul>
<h2>L’avion de ligne à réaction</h2>
<div class="figslot" data-fig="speedbars"></div>
<ul><li>Le <b>de Havilland Comet</b> (Royaume-Uni, 1952) est le premier avion de ligne à réaction en service.</li><li>La <b>Caravelle</b> (Sud-Aviation, premier vol en 1955) est un moyen-courrier français à réaction aux moteurs placés à l’arrière du fuselage : une configuration reprise ensuite par beaucoup d’appareils.</li><li>Le <b>Boeing 747</b> (1969) est le premier avion de ligne à fuselage large, le « jumbo jet ».</li></ul>
<h2>Concorde, symbole franco-britannique</h2>
<p>Le <b>Concorde</b> est un avion de ligne supersonique développé conjointement par la France et le Royaume-Uni. Premier vol le <b>2 mars 1969</b> à Toulouse (pilote André Turcat) ; service commercial le <b>21 janvier 1976</b> ; croisière à <b>Mach 2</b> (plus de 2 100 km/h) vers <b>18 000 m</b> ; Paris-New York en environ <b>3 h 30</b>. Retiré du service en <b>2003</b> (coûts, bruit, accident de 2000, baisse du trafic).</p>
<h2>Airbus : l’Europe unie dans l’air</h2>
<p>Airbus naît en <b>1970</b> comme consortium européen, avec Toulouse pour centre d’assemblage final. <b>A300</b> (premier vol en 1972), <b>A320</b> (1987, premier avion de ligne à commandes de vol électriques), <b>A380</b> (2005, double pont), <b>A350</b> (2013, composites). Autres entreprises françaises : <b>Dassault Aviation</b> (Mirage, Rafale), <b>Airbus Helicopters</b> (ex-Eurocopter, ex-Aérospatiale), <b>Safran</b> (moteurs).</p>
<div class="callout exemple"><b>Exemple</b>Quand un avion passe le mur du son, il laisse derrière lui une onde de choc que l’on entend au sol sous la forme d’un « bang ».</div>
<div class="simslot" data-sim="timeline" data-era="j"></div>
`,
keep:['27 août 1939 : He 178, premier avion à réaction (turboréacteur de von Ohain).','14 octobre 1947 : Yeager franchit le mur du son sur le Bell X-1.','Caravelle (premier vol 1955) : moyen-courrier français à réaction, moteurs à l’arrière.','Concorde : 2 mars 1969, Mach 2, 18 000 m, Paris-New York en 3 h 30, retiré en 2003.','Airbus : 1970 ; A320 (1987), premier avion de ligne civil à commandes de vol électriques.'],

['Quel avion est le premier avion à réaction à voler, en 1939 ?','Le Heinkel He 178','Le Concorde','La Caravelle','Le Comet','Le He 178, allemand, vole avec un turboréacteur à la fin d’août 1939.'],
['Le Concorde effectue son premier vol à :','Toulouse, en 1969','Paris, en 1976','Londres, en 1947','Le Bourget, en 1955','Premier vol le 2 mars 1969 à Toulouse. Le service commercial débute en 1976.'],
['L’Airbus A320 est célèbre car il est le premier avion de ligne civil à :','avoir des commandes de vol électriques numériques','dépasser Mach 1','avoir quatre réacteurs','être fabriqué en composite','L’A320, en 1987, remplace les câbles mécaniques par des calculateurs numériques : le pilote commande l’ordinateur, qui commande les gouvernes.'],
['La Caravelle se distingue par :','ses moteurs placés à l’arrière du fuselage','sa vitesse supersonique','ses quatre hélices','son pont double','La Caravelle, avion de ligne à réaction de 1955, a ses réacteurs à l’arrière.']

C.push({id:'5-4', th:'t5', title:'La conquête spatiale (1957-2000)', min:16,
goals:['situer les grandes premières de l’exploration spatiale','expliquer le contexte de la course à l’espace','citer les acteurs français et européens'],
body:`
<h2>La course à l’espace</h2>
<p>Après la Seconde Guerre mondiale, les États-Unis et l’URSS s’affrontent dans la guerre froide… et dans l’espace. Chaque exploit est une victoire de prestige. Les fusées d’exploration descendent des missiles : la <b>V2</b> allemande, conçue par Wernher von Braun, en est l’ancêtre.</p>
<h2>Les grandes premières</h2>
<div class="figslot" data-fig="apollo"></div>
<div class="tw"><table><tr><th>Date</th><th>Événement</th></tr>
<tr><td>4 octobre 1957</td><td><b>Spoutnik 1</b> (URSS) : premier satellite artificiel</td></tr>
<tr><td>3 novembre 1957</td><td>Spoutnik 2 : la chienne Laïka, premier être vivant en orbite</td></tr>
<tr><td>1958</td><td>Explorer 1 (États-Unis) ; création de la NASA</td></tr>
<tr><td>12 avril 1961</td><td><b>Youri Gagarine</b> (URSS) : premier homme dans l’espace, un tour de Terre en 108 minutes (Vostok 1)</td></tr>
<tr><td>1961</td><td>Création du <b>CNES</b> (France)</td></tr>
<tr><td>1963</td><td>Valentina Terechkova : première femme dans l’espace</td></tr>
<tr><td>1965</td><td>Alexeï Leonov : première sortie dans l’espace. <b>Astérix</b> : premier satellite français, lancé par une fusée française Diamant</td></tr>
<tr><td>20-21 juillet 1969</td><td><b>Apollo 11</b> : <b>Neil Armstrong</b> et Buzz Aldrin marchent sur la Lune (fusée Saturn V). Michael Collins reste en orbite.</td></tr>
<tr><td>1972</td><td>Apollo 17 : dernière mission lunaire habitée</td></tr>
<tr><td>1975</td><td>Création de l’<b>ESA</b> ; mission conjointe Apollo-Soyouz</td></tr>
<tr><td>24 décembre 1979</td><td>Premier vol d’<b>Ariane 1</b>, à Kourou</td></tr>
<tr><td>1981</td><td>Premier vol de la <b>navette spatiale</b> (Columbia)</td></tr>
<tr><td>1982</td><td><b>Jean-Loup Chrétien</b> : premier Français dans l’espace</td></tr>
<tr><td>1986</td><td>Accident de Challenger ; lancement de la station Mir</td></tr>
<tr><td>1990</td><td>Télescope spatial Hubble</td></tr>
<tr><td>1996</td><td>Claudie Haigneré : première Française dans l’espace</td></tr>
<tr><td>1998</td><td>Premier module de la Station spatiale internationale (ISS)</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Un sentiment de rivalité a produit une avance technique incroyable : en douze ans, on est passé du premier satellite à l’homme sur la Lune.</div>
<h2>L’espace comme outil</h2>
<p>À côté de l’exploration, les satellites sont devenus utiles : télécommunications, météorologie (Météosat), observation de la Terre (SPOT), navigation (GPS, puis Galileo). La France, via le CNES, a joué un rôle central dans l’espace européen et a créé le centre spatial guyanais de Kourou.</p>
<div class="simslot" data-sim="timeline" data-era="s"></div>
`,
keep:['1957 : Spoutnik 1 (URSS), premier satellite. 1961 : Gagarine, premier homme dans l’espace.','1965 : Astérix, premier satellite français ; 1961 : CNES ; 1975 : ESA.','Juillet 1969 : Apollo 11, Armstrong et Aldrin sur la Lune.','24 décembre 1979 : premier vol d’Ariane 1, depuis Kourou.','1982 : Jean-Loup Chrétien, premier Français dans l’espace.'],

C.push({id:'5-5', th:'t5', title:'L’espace et l’aéronautique d’aujourd’hui et de demain', min:16,
goals:['connaître les grands programmes spatiaux actuels','citer des astronautes français et des missions européennes','comprendre les enjeux de la transition écologique'],
body:`
<h2>Une présence permanente en orbite</h2>
<p>La <b>Station spatiale internationale</b> (ISS) est occupée en continu depuis novembre 2000. Elle orbite à environ 400 km d’altitude et fait le tour de la Terre en 92 minutes. Quinze nations y ont contribué (États-Unis, Russie, Europe, Japon, Canada). Des astronautes y mènent des expériences en apesanteur.</p>
<div class="figslot" data-fig="iss"></div>
<p>Les astronautes français de l’ESA : Jean-Loup Chrétien, Patrick Baudry, Claudie Haigneré, Jean-Pierre Haigneré, Léopold Eyharts, Philippe Perrin, Michel Tognini, Jean-François Clervoy, Frank De Winne (belge)… et <b>Thomas Pesquet</b>, deux séjours à bord de l’ISS (missions <i>Proxima</i> en 2016-2017 et <i>Alpha</i> en 2021).</p>
<h2>Exploration scientifique</h2>
<ul><li><b>Rosetta et Philae</b> (ESA) : en 2014, après un voyage de dix ans, la sonde Rosetta met en orbite la comète 67P/Tchourioumov-Guérassimenko et dépose l’atterrisseur Philae à sa surface.</li><li><b>Télescopes</b> : Hubble (1990), <b>James Webb</b> (lancé le 25 décembre 2021 par une Ariane 5), qui observe l’Univers lointain en infrarouge.</li><li><b>Mars</b> : robots Spirit et Opportunity (2004), Curiosity (2012), Perseverance (2021).</li><li>Retour vers la <b>Lune</b> : le programme Artemis vise à envoyer à nouveau des humains.</li></ul>
<h2>Les lanceurs</h2>
<p>L’Europe a longtemps lancé avec <b>Ariane 5</b> (1996-2023). <b>Ariane 6</b>, plus modulable, a fait son premier vol le <b>9 juillet 2024</b>. Autre lanceur européen : <b>Vega-C</b>. La société américaine <b>SpaceX</b> a lancé le « New Space » : son lanceur <b>Falcon 9</b> est en partie <b>réutilisable</b> (le premier étage atterrit et repart), ce qui baisse les coûts.</p>
<h2>L’espace au quotidien</h2>
<p>Navigation (GPS, <b>Galileo</b>), météo (Météosat, MetOp), télécoms, surveillance du climat, gestion des catastrophes naturelles : l’espace est devenu une infrastructure indispensable.</p>
<h2>Aéronautique et transition écologique</h2>
<p>Objectif du secteur : atteindre la neutralité carbone en 2050. Pistes :</p>
<ul><li>des avions plus légers et plus sobres (matériaux composites, moteurs plus efficaces) ;</li><li>des <b>carburants d’aviation durables</b> (SAF) ;</li><li>l’<b>électrique</b> et l’<b>hybride</b> pour les petits avions et les hélicoptères ;</li><li>l’<b>hydrogène</b> à plus long terme ;</li><li>de meilleures trajectoires et une réduction du bruit.</li></ul>
<h2>La culture aéronautique</h2>
<p>Le <b>Salon du Bourget</b> (Paris Air Show) a lieu tous les deux ans, les années impaires. Le <b>Musée de l’Air et de l’Espace</b> du Bourget est l’un des plus grands musées de l’aéronautique du monde. La <b>Patrouille de France</b> est la patrouille acrobatique de l’Armée de l’air et de l’espace. Les métiers sont variés : pilote, contrôleur aérien, mécanicien, ingénieur, météorologue, technicien de maintenance, métiers du spatial.</p>

body:`
<p>En aviation, les lettres comme B, D, P, T ou M se confondent facilement au bruit de la radio. L’OACI a donc fixé un <b>alphabet</b> où chaque lettre est un mot clair, compréhensible dans toutes les langues.</p>
<h2>L’alphabet</h2>
<div class="tw"><table class="tbl"><tr><td>A Alpha</td><td>B Bravo</td><td>C Charlie</td><td>D Delta</td></tr><tr><td>E Echo</td><td>F Foxtrot</td><td>G Golf</td><td>H Hotel</td></tr><tr><td>I India</td><td>J Juliett</td><td>K Kilo</td><td>L Lima</td></tr><tr><td>M Mike</td><td>N November</td><td>O Oscar</td><td>P Papa</td></tr><tr><td>Q Quebec</td><td>R Romeo</td><td>S Sierra</td><td>T Tango</td></tr><tr><td>U Uniform</td><td>V Victor</td><td>W Whiskey</td><td>X X-ray</td></tr><tr><td>Y Yankee</td><td>Z Zulu</td><td></td><td></td></tr></table></div>
<h2>Les chiffres</h2>
<p>Certains chiffres se prononcent différemment pour éviter les confusions :</p>
<div class="figslot" data-fig="saynum"></div>
<div class="tw"><table class="tbl"><tr><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr><tr><td>zero</td><td>one</td><td>two</td><td><b>tree</b></td><td><b>fower</b></td><td><b>fife</b></td><td>six</td><td>seven</td><td>eight</td><td><b>niner</b></td></tr></table></div>
<ul><li>Fréquence <b>121,5</b> : « one two one <b>decimal</b> five ».</li><li>Cap <b>270°</b> : « two seven zero ».</li><li>Altitude 3 000 ft : « three thousand feet » ; niveau de vol 85 : « flight level eight five ».</li><li>QNH <b>1013</b> : « one zero one tree ».</li><li>Heure <b>1630 UTC</b> : « one six tree zero ».</li></ul>
<h2>Indicatif d’appel</h2>
<p>Un avion français a une immatriculation commençant par <b>F-</b>, par exemple F-GABC. À la radio : « Foxtrot Golf Alpha Bravo Charlie ». Après un premier contact, on peut abréger en gardant les deux dernières lettres : « Bravo Charlie ».</p>
<div class="simslot" data-sim="alpha"></div>

C.push({id:'6-3', th:'t6', title:'Phraséologie radio', min:16,
goals:['comprendre les messages standard d’un aérodrome','répondre correctement à une instruction','reconnaître les expressions d’urgence et de collationnement'],
body:`
<p>La radio aéronautique est brève et codifiée. Un message type contient : <b>qui j’appelle</b>, <b>qui je suis</b>, <b>où je suis</b>, <b>ce que je veux</b>.</p>
<h2>Expressions de base</h2>
<div class="figslot" data-fig="readback"></div>
<div class="tw"><table class="tbl"><tr><th>Anglais</th><th>Sens</th></tr><tr><td><b>Roger</b></td><td>Message reçu et compris (n’est pas « oui »)</td></tr><tr><td><b>Wilco</b></td><td>Compris et sera exécuté (<i>will comply</i>)</td></tr><tr><td><b>Affirm</b> / <b>Negative</b></td><td>Oui / non</td></tr><tr><td><b>Say again</b></td><td>Répétez</td></tr><tr><td><b>Standby</b></td><td>Attendez</td></tr><tr><td><b>Request</b></td><td>Je demande…</td></tr><tr><td><b>Readback</b></td><td>Collationnement : on répète les consignes importantes</td></tr></table></div>
<h2>Autour de la piste</h2>
<div class="tw"><table class="tbl"><tr><th>Phrase</th><th>Sens</th></tr><tr><td><b>Taxi to holding point runway 27</b></td><td>Roulez jusqu’au point d’attente de la piste 27</td></tr><tr><td><b>Hold short of runway</b></td><td>Arrêtez-vous avant la piste</td></tr><tr><td><b>Line up and wait</b></td><td>Alignez-vous et attendez</td></tr><tr><td><b>Cleared for take-off</b></td><td>Autorisé à décoller</td></tr><tr><td><b>Report final</b></td><td>Annoncez-vous en finale</td></tr><tr><td><b>Cleared to land</b></td><td>Autorisé à atterrir</td></tr><tr><td><b>Go around</b></td><td>Remise de gaz</td></tr></table></div>
<h2>Autres instructions utiles</h2>
<ul><li><b>Squawk 7000</b> : afficher 7000 au transpondeur.</li><li><b>QNH 1013</b> : le calage altimétrique est 1013 hPa.</li><li><b>Contact tower 118.7</b> : appelez la tour sur 118,7 MHz.</li><li><b>Report position</b> : annoncez votre position.</li></ul>
<h2>Urgence</h2>
<p><b>Mayday, mayday, mayday</b> : détresse. <b>Pan pan, pan pan, pan pan</b> : urgence. Puis : le nom de la station, l’indicatif, la nature du problème, les intentions, la position, le nombre de personnes à bord.</p>
<div class="callout exemple"><b>Exemple de dialogue</b>
<p>Pilote : « Toulouse Tower, Foxtrot Golf Alpha Bravo Charlie, ready for departure, runway three two left. »</p>
<p>Tour : « Foxtrot Golf Alpha Bravo Charlie, line up and wait runway three two left. »</p>
<p>Pilote : « Line up and wait, three two left, Alpha Bravo Charlie. »</p>
<p>Tour : « Foxtrot Golf Alpha Bravo Charlie, wind two seven zero, one zero knots, runway three two left, cleared for take-off. »</p>
<p>Pilote : « Cleared for take-off, three two left, Alpha Bravo Charlie. »</p></div>
`,

(function(){
const S = window.BIA.sims;
const f1 = (x,d)=>x.toFixed(d===undefined?1:d).replace('.',',');
const NS='http://www.w3.org/2000/svg';

/* ---------- 1.1 Atmosphère standard ---------- */
function isa(h){
  let T,p;
  if(h<=11000){ T=288.15-0.0065*h; p=1013.25*Math.pow(T/288.15,5.2559); }
  else { T=216.65; p=226.32*Math.exp(-(h-11000)/6341.6); }
  return {T:T-273.15, p};
}
S.isa={title:'Atmosphère standard', th:'t1', ch:'1-1',
desc:'Monte en altitude : lis la température, la pression et la densité de l’air.',
try:['Place-toi à 5 500 m : la pression vaut à peu près la moitié de celle du sol.','Dépasse 11 000 m : la température cesse de baisser (tropopause).','Passe l’écart à +20 °C : l’air devient moins dense, donc les performances de l’avion baissent.'],
mount(root,x){
  root.innerHTML=x.r('alt','Altitude',0,20000,100,0,' m')+x.r('dev','Écart par rapport à la température standard',-30,30,1,0,' °C')+
  '<svg viewBox="0 0 640 300" role="img" aria-label="Profil de température de l’atmosphère standard"><g id="'+x.uid+'g"></g></svg><div class="readout"><div><small>Altitude</small><b id="'+x.uid+'a"></b></div><div><small>Température</small><b id="'+x.uid+'t"></b></div><div><small>Pression</small><b id="'+x.uid+'p"></b></div><div><small>Masse volumique</small><b id="'+x.uid+'r"></b></div></div><div class="verdict" id="'+x.uid+'v"></div>';
  const g=x.q('#'+x.uid+'g');
  const Y=h=>280-h/20000*260, X=T=>340+(T+70)/100*270;
  function draw(){
    const h=x.v('alt'), dev=x.v('dev'); const s=isa(h), T=s.T+dev, rho=s.p*100/(287.05*(T+273.15));
    let o='';
    o+='<rect x="40" y="'+Y(11000)+'" width="260" height="'+(280-Y(11000))+'" fill="var(--c1)" opacity=".18"/><rect x="40" y="20" width="260" height="'+(Y(11000)-20)+'" fill="var(--c4)" opacity=".14"/>';
    o+='<text x="50" y="'+(Y(5500)+4)+'" fill="var(--ink)" font-size="15" font-weight="600">TROPOSPHÈRE</text><text x="50" y="'+(Y(5500)+22)+'" fill="var(--mute)" font-size="12">météo, nuages, T qui baisse</text>';
    o+='<text x="50" y="'+(Y(15500)+4)+'" fill="var(--ink)" font-size="15" font-weight="600">STRATOSPHÈRE</text><text x="50" y="'+(Y(15500)+22)+'" fill="var(--mute)" font-size="12">couche d’ozone, T stable puis ↑</text>';
    o+='<line x1="40" x2="300" y1="'+Y(11000)+'" y2="'+Y(11000)+'" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="302" y="'+(Y(11000)-5)+'" fill="var(--ink)" font-size="12" text-anchor="start">tropopause 11 km</text>';
    for(let k=0;k<=20;k+=5){ o+='<text x="34" y="'+(Y(k*1000)+4)+'" text-anchor="end" fill="var(--mute)" font-size="12">'+k+' km</text><line x1="40" x2="300" y1="'+Y(k*1000)+'" y2="'+Y(k*1000)+'" stroke="var(--line)" stroke-width=".6"/>'; }
    [[4808,'Mont Blanc'],[8849,'Everest'],[11000,'Avion de ligne'],[18000,'Concorde']].forEach(a=>{ if(a[0]!==11000) o+='<text x="296" y="'+(Y(a[0])+4)+'" text-anchor="end" fill="var(--mute)" font-size="11">'+a[1]+'</text>'; });
    for(let t=-60;t<=20;t+=20){ o+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="20" y2="280" stroke="var(--line)" stroke-width=".6"/><text x="'+X(t)+'" y="296" text-anchor="middle" fill="var(--mute)" font-size="11">'+t+' °C</text>'; }
    let pts=''; for(let a=0;a<=20000;a+=500){ pts+=X(isa(a).T+dev)+','+Y(a)+' '; }
    o+='<polyline points="'+pts+'" fill="none" stroke="var(--c1)" stroke-width="3"/>';
    o+='<line x1="40" x2="620" y1="'+Y(h)+'" y2="'+Y(h)+'" stroke="var(--acc)" stroke-width="2"/><circle cx="'+X(T)+'" cy="'+Y(h)+'" r="7" fill="var(--acc)"/>';
    g.innerHTML=o;
    x.q('#'+x.uid+'a').textContent=Math.round(h)+' m ('+Math.round(h/0.3048)+' ft)';
    x.q('#'+x.uid+'t').textContent=f1(T)+' °C'; x.q('#'+x.uid+'p').textContent=Math.round(s.p)+' hPa'; x.q('#'+x.uid+'r').textContent=f1(rho,3)+' kg/m³';

  }

}};

/* ---------- 1.2 Vent et isobares ---------- */
S.wind={title:'Pression et vent', th:'t1', ch:'1-2',
desc:'Clique sur la carte : le vent tourne autour des hautes et des basses pressions.',
try:['Choisis « Dépression » et clique à gauche, puis à droite du centre. Vérifie la règle de Buys-Ballot.','Resserre les isobares : le vent se renforce.','Passe en anticyclone : le sens de rotation s’inverse.'],
mount(root,x){
  root.innerHTML=x.seg('type',[['L','Dépression (D)'],['H','Anticyclone (A)']],'L')+x.r('sp','Écart entre les isobares',1,3,0.1,2,'')+
  '<svg viewBox="0 0 400 400" id="'+x.uid+'m" role="img" aria-label="Carte d’isobares cliquable" style="max-width:480px;margin:0 auto;cursor:crosshair"></svg><div class="verdict" id="'+x.uid+'v">Clique sur la carte pour placer une station météo.</div>';
  let type='L', pin=null; const svg=x.q('#'+x.uid+'m');
  function wind(px,py){ const dx=px-200, dy=py-200, r=Math.hypot(dx,dy)||1, rx=dx/r, ry=dy/r;
    const tcw=[-ry,rx], tccw=[ry,-rx], ang=Math.PI/6; let v;
    if(type==='L') v=[Math.cos(ang)*tccw[0]-Math.sin(ang)*rx, Math.cos(ang)*tccw[1]-Math.sin(ang)*ry];
    else v=[Math.cos(ang)*tcw[0]+Math.sin(ang)*rx, Math.cos(ang)*tcw[1]+Math.sin(ang)*ry];
    return v; }
  function draw(){
    const sp=x.v('sp'); let o='<rect width="400" height="400" fill="var(--soft)"/>';
    for(let k=1;k<=5;k++){ const r=k*30*sp/2; if(r<190) o+='<circle cx="200" cy="200" r="'+r+'" fill="none" stroke="var(--c1)" stroke-width="2" opacity="'+(1-k*.12)+'"/><text x="'+(200+r+3)+'" y="196" fill="var(--c1)" font-size="10">'+(type==='L'?1000+k*4:1036-k*4)+'</text>'; }
    o+='<text x="200" y="212" text-anchor="middle" font-size="46" font-weight="700" fill="'+(type==='L'?'var(--c1)':'var(--bad)')+'" font-family="var(--disp)">'+(type==='L'?'D':'A')+'</text>';
    for(let a=0;a<360;a+=30) for(let rr of [70,125,175]){ const px=200+rr*Math.cos(a*Math.PI/180), py=200+rr*Math.sin(a*Math.PI/180), v=wind(px,py); const L=14+10/sp; o+='<line x1="'+(px-v[0]*L/2)+'" y1="'+(py-v[1]*L/2)+'" x2="'+(px+v[0]*L/2)+'" y2="'+(py+v[1]*L/2)+'" stroke="var(--mute)" stroke-width="2"/><circle cx="'+(px+v[0]*L/2)+'" cy="'+(py+v[1]*L/2)+'" r="3" fill="var(--mute)"/>'; }
    if(pin){ const v=wind(pin[0],pin[1]); const L=46; o+='<circle cx="'+pin[0]+'" cy="'+pin[1]+'" r="6" fill="var(--acc)"/><line x1="'+pin[0]+'" y1="'+pin[1]+'" x2="'+(pin[0]+v[0]*L)+'" y2="'+(pin[1]+v[1]*L)+'" stroke="var(--acc)" stroke-width="4"/><circle cx="'+(pin[0]+v[0]*L)+'" cy="'+(pin[1]+v[1]*L)+'" r="5" fill="var(--acc)"/>'; }
    o+='<g font-size="12" fill="var(--ink)" font-weight="600"><text x="200" y="14" text-anchor="middle">N</text><text x="390" y="204" text-anchor="end">E</text><text x="200" y="395" text-anchor="middle">S</text><text x="10" y="204">O</text></g>';
    svg.innerHTML=o;
    const vv=x.q('#'+x.uid+'v');
    if(pin){ const v=wind(pin[0],pin[1]); let brg=Math.atan2(v[0],-v[1])*180/Math.PI; brg=(brg+360)%360; const from=Math.round(((brg+180)%360)/10)*10; const dist=Math.hypot(pin[0]-200,pin[1]-200); const kt=Math.round((8+ (160/Math.max(dist,40))*3 )*(2/sp)*0.8*(type==='L'?1.1:0.9));
      vv.textContent='Vent de '+String(from%360===0?360:from).padStart(3,'0')+'° (il vient de ce secteur) · environ '+kt+' kt. '+(type==='L'?'Autour d’une dépression, l’air tourne dans le sens inverse des aiguilles d’une montre et converge vers le centre.':'Autour d’un anticyclone, l’air tourne dans le sens des aiguilles d’une montre et s’écarte du centre.'); vv.className='verdict ok'; }
  }
  svg.addEventListener('click',e=>{ const r=svg.getBoundingClientRect(); pin=[(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*400]; draw(); });

S.parcel={title:'Bulle d’air et nuages', th:'t1', ch:'1-3',
desc:'Une bulle d’air chaud monte : s’arrête-t-elle, forme-t-elle un nuage, un orage ?',
