<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap BIA</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0D1B2E">
<meta name="description" content="Cap BIA : préparer le Brevet d’Initiation Aéronautique avec des leçons illustrées, des simulateurs, des quiz et des examens blancs.">
<style>
/* Layout idea: carnet de vol sur fond de carte VFR; check-list de vol en page d'accueil, tout le reste reste calme. */
:root{
  --bg:#E9EFF5; --surface:#FFFFFF; --soft:#E1E9F1; --ink:#0D1B2E; --mute:#4F6078; --line:#C7D3E0;
  --acc:#C94310; --acc-ink:#FFFFFF; --mag:#A8185A;
  --ok:#1E7B4E; --warn:#935C08; --bad:#B8322A; --okbg:#DDF1E6; --badbg:#F9E1DE; --warnbg:#F8EBD0;
  --c1:#1D6FB8; --c2:#C4520F; --c3:#0C7C70; --c4:#A8185A; --c5:#7E6210; --c6:#4F5D75;
  --disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sky:#BFDDF5; --ground:#8A6B45;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08121D; --surface:#0F1D2D; --soft:#16273B; --ink:#E7EEF6; --mute:#93A6BC; --line:#233750;
    --acc:#FFB02E; --acc-ink:#1A1200; --mag:#FF7FB5;
    --ok:#4FD08A; --warn:#F0B24A; --bad:#FF7468; --okbg:#10321F; --badbg:#3A1714; --warnbg:#38290B;
    --c1:#5FB0FF; --c2:#FF9A57; --c3:#4FD3C0; --c4:#FF7FB5; --c5:#E3C25A; --c6:#9FB0C9;
    --sky:#1B3A5A; --ground:#5A4630; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121D; --surface:#0F1D2D; --soft:#16273B; --ink:#E7EEF6; --mute:#93A6BC; --line:#233750;
  --acc:#FFB02E; --acc-ink:#1A1200; --mag:#FF7FB5;
  --ok:#4FD08A; --warn:#F0B24A; --bad:#FF7468; --okbg:#10321F; --badbg:#3A1714; --warnbg:#38290B;
  --c1:#5FB0FF; --c2:#FF9A57; --c3:#4FD3C0; --c4:#FF7FB5; --c5:#E3C25A; --c6:#9FB0C9;
  --sky:#1B3A5A; --ground:#5A4630; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:780px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3,h4{font-family:var(--disp);text-transform:uppercase;letter-spacing:.025em;line-height:1.05;margin:0 0 .5em;text-wrap:balance}
h1{font-size:2.5rem;font-weight:700}
h2{font-size:1.65rem;font-weight:600;margin-top:1.4em}
h3{font-size:1.25rem;font-weight:600;margin-top:1.2em}
p{margin:0 0 .9em}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.small{font-size:.9rem}
.sr{position:absolute;left:-9999px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--disp);font-weight:700;font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid var(--acc);position:relative}
.brand i:after{content:"";position:absolute;left:50%;top:-7px;width:3px;height:9px;background:var(--acc);transform:translateX(-50%)}
.crumb{font-size:.9rem;color:var(--mute);text-decoration:none}

/* tab bar */
.tabs-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs-bar nav{display:flex;width:100%;max-width:780px}
.tabs-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--mute);font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tabs-bar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs-bar a[aria-current="page"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 14px}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.chip{display:inline-block;font:600 .74rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;border:1px solid currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:6px;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700;text-decoration:none;font-size:1rem}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.kicker{font:600 .78rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sep{height:1px;background:var(--line);margin:18px 0}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
input[type=text],input[type=date],input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:44px;max-width:100%}

/* check-list (accueil) */
.hero{margin-bottom:18px}
.hero p{max-width:34em;color:var(--mute)}
.checklist{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:4px;padding:6px 14px 10px;font-family:var(--mono)}
.checklist .ch-h{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.cl-row{display:flex;align-items:baseline;gap:8px;padding:11px 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--soft);font-size:.92rem}
.cl-row:last-child{border-bottom:0}
.cl-row b{font-weight:600;white-space:nowrap}
.cl-row .lead{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.cl-row .st{font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)} .st.mid{color:var(--warn)} .st.no{color:var(--mute)}
.cl-row:hover b{color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--mute)}
.t1 .dot,.dot.t1{background:var(--c1)} .t2 .dot,.dot.t2{background:var(--c2)} .t3 .dot,.dot.t3{background:var(--c3)}
.t4 .dot,.dot.t4{background:var(--c4)} .t5 .dot,.dot.t5{background:var(--c5)} .t6 .dot,.dot.t6{background:var(--c6)}
.tc1{color:var(--c1)} .tc2{color:var(--c2)} .tc3{color:var(--c3)} .tc4{color:var(--c4)} .tc5{color:var(--c5)} .tc6{color:var(--c6)}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat>div{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font:700 1.9rem/1 var(--disp);margin-bottom:2px}

/* chapter list */
.chap{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc,var(--line));border-radius:6px;margin-bottom:8px;text-decoration:none;color:inherit}
.chap:hover{border-color:var(--acc);border-left-color:var(--tc)}
.chap .n{font:700 1.2rem/1 var(--disp);min-width:2.2em;color:var(--tc)}
.chap .t{flex:1;font-weight:600;line-height:1.25}
.chap .t small{display:block;font-weight:400;color:var(--mute)}
.badge{font:600 .72rem/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.mid{background:var(--warnbg);color:var(--warn)}

/* lesson */
.lesson-head{border-left:6px solid var(--tc);padding-left:14px;margin-bottom:16px}
.lesson-head h1{font-size:2.1rem;margin-bottom:.2em}
.goals{background:var(--soft);border-radius:8px;padding:12px 16px;margin-bottom:18px}
.goals ul{margin:.3em 0 0;padding-left:1.1em}
.lesson p,.lesson li{max-width:42em}
.lesson ul,.lesson ol{padding-left:1.2em;margin:0 0 1em}
.lesson li{margin-bottom:.35em}
.lesson dfn{font-style:normal;font-weight:700;color:var(--tc)}
.lesson table,.tbl{border-collapse:collapse;width:100%;font-size:.95rem;margin:0 0 1em}
.tw{overflow-x:auto;margin:0 0 1em}
.lesson th,.lesson td,.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lesson th,.tbl th{background:var(--soft);font-weight:600}
.callout{border-left:5px solid var(--mute);background:var(--surface);border-radius:0 6px 6px 0;padding:10px 14px;margin:0 0 1em;max-width:42em}
.callout>b:first-child{display:block;font:600 .78rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.en-clair{border-color:var(--c1)} .en-clair>b:first-child{color:var(--c1)}
.exemple{border-color:var(--c3)} .exemple>b:first-child{color:var(--c3)}
.attention{border-color:var(--bad)} .attention>b:first-child{color:var(--bad)}
.formule{font-family:var(--mono);background:var(--soft);padding:8px 12px;border-radius:6px;display:inline-block;margin:0 0 1em;font-size:.98rem}
.keep{background:var(--okbg);border-radius:8px;padding:14px 16px;margin:20px 0 14px}
.keep h3,.trap h3{margin:0 0 .4em;font-size:1.1rem}
.keep h3{color:var(--ok)} .trap h3{color:var(--bad)}
.keep ul,.trap ul{margin:0;padding-left:1.1em}
.trap{background:var(--badbg);border-radius:8px;padding:14px 16px;margin:0 0 14px}
.keep li,.trap li{margin-bottom:.3em}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* tabs inside lessons */
.tabset{margin:0 0 1em}
.tabset .tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabset .tb button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:600;font-size:.92rem}
.tabset .tb button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabset .pane{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tabset .pane.on{display:block}
.tabset .pane p:last-child{margin-bottom:0}

/* simulator frame */
.sim{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:8px;padding:14px;margin:0 0 18px}
.sim-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sim-h b{font:600 1.15rem/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.sim-h span{font:600 .7rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.sim .cap{color:var(--mute);font-size:.92rem;margin:0 0 10px}
.sim svg{width:100%;height:auto;display:block;background:var(--soft);border-radius:6px}
.sim canvas{width:100%;display:block;border-radius:6px;background:var(--soft)}
.rng{margin:10px 0}
.rng label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.95rem;margin-bottom:2px}
.rng output{font-family:var(--mono);font-weight:500;color:var(--acc)}
input[type=range]{width:100%;height:34px;background:transparent;accent-color:var(--acc);margin:0}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.readout>div{background:var(--soft);border-radius:6px;padding:8px 10px}
.readout small{display:block;color:var(--mute);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.readout b{font:600 1.15rem/1.2 var(--mono)}
.verdict{border-radius:6px;padding:10px 12px;margin:10px 0 0;font-weight:600;background:var(--soft)}
.verdict.ok{background:var(--okbg);color:var(--ok)} .verdict.bad{background:var(--badbg);color:var(--bad)} .verdict.warn{background:var(--warnbg);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:600;font-size:.92rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tok{font-family:var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;margin:3px;font-size:.95rem}
.tok[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 14px}
.q-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.q-stem{font-weight:600;font-size:1.1rem;line-height:1.4;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:11px 12px;min-height:50px;line-height:1.35}
.opt .l{font:600 .9rem/1.5 var(--mono);min-width:1.4em;color:var(--mute)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.expl{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--soft)}
.expl b.r{display:block;margin-bottom:3px}
.expl.ok b.r{color:var(--ok)} .expl.ko b.r{color:var(--bad)}
.score-big{font:700 3.4rem/1 var(--disp)}
.mark{display:inline-block;min-width:34px;text-align:center;padding:6px 0;margin:0 4px 6px 0;border:1px solid var(--line);border-radius:6px;font:600 .85rem var(--mono);background:var(--surface)}
.mark.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.mark.done{background:var(--soft)} .mark.flag{border-color:var(--warn);color:var(--warn)}
.mark.good{background:var(--okbg);color:var(--ok)} .mark.bad{background:var(--badbg);color:var(--bad)}
.timer{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:12px}
.timer .t{font:600 1.5rem/1 var(--mono)} .timer .t.low{color:var(--bad)}
.th-bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0}
.th-bar .bar{height:12px}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal>div{background:var(--surface);border-radius:10px;max-width:420px;width:100%;padding:20px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600}
.pick button[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}
.gl-item{padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{font-family:var(--disp);font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:16px}
.tl-i{position:relative;margin-bottom:12px}
.tl-i:before{content:"";position:absolute;left:-23px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
.tl-i b{font:700 1.2rem/1 var(--disp);color:var(--acc)}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 1.6rem/1.2 var(--disp);letter-spacing:.03em;text-transform:uppercase;background:var(--soft);border-radius:8px;padding:20px;cursor:pointer;border:0;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){h1{font-size:2.1rem}.lesson-head h1{font-size:1.8rem}body{font-size:16.5px}}

/* ---------- figures illustrées ---------- */
.fig{margin:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px 12px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.92rem;color:var(--mute);margin-top:8px;line-height:1.45}
.fig figcaption b{color:var(--ink)}
.fig .fhint{display:block;font-size:.76rem;margin-top:4px;opacity:.8}
.fig[data-anim="1"]{cursor:pointer}
.fig svg text{font-family:var(--body);font-size:11.5px;font-weight:600;fill:var(--ink)}
.fig svg .sm{font-size:10px;font-weight:500;fill:var(--mute)}
.fig svg .mid{text-anchor:middle}.fig svg .end{text-anchor:end}
.fig svg .big{font-size:14px;font-weight:700}
.fig svg .wh{fill:#fff}
.fig .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fig .thin{stroke-width:1}.fig .dash{stroke-dasharray:5 4}
.fig .fA{fill:var(--acc)}.fig .sA{stroke:var(--acc)}
.fig .fB{fill:var(--c1)}.fig .sB{stroke:var(--c1)}
.fig .fG{fill:var(--c3)}.fig .sG{stroke:var(--c3)}
.fig .fR{fill:var(--bad)}.fig .sR{stroke:var(--bad)}
.fig .fO{fill:var(--ok)}.fig .sO{stroke:var(--ok)}
.fig .fM{fill:var(--mag)}.fig .sM{stroke:var(--mag)}
.fig .fS{fill:var(--soft)}.fig .fK{fill:var(--ink)}
.fig .fSky{fill:var(--sky)}.fig .fGr{fill:var(--ground)}
.fig .fW{fill:var(--surface)}.fig .sW{stroke:var(--surface)}
.fig .cloud{fill:var(--surface);stroke:var(--mute);stroke-width:1.5}
.fig .o1{opacity:.12}.fig .o2{opacity:.22}.fig .o3{opacity:.4}
.fig .flow{stroke-dasharray:6 6;animation:dashmove 1s linear infinite}
.fig .flowr{stroke-dasharray:6 6;animation:dashmove 1s linear infinite reverse}
.fig .jig{animation:jig 1.6s ease-in-out infinite alternate}
.fig .blink{animation:blink 3s steps(1) infinite}
.fig .spinr{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.fig .spinl{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite reverse}
.fig .fastspin{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.fig .bob{animation:bob 3s ease-in-out infinite alternate}
.fig .fade{animation:fadeio 4s ease-in-out infinite}
@keyframes dashmove{to{stroke-dashoffset:-12}}
@keyframes jig{from{transform:translate(0,0)}to{transform:translate(3px,-3px)}}
@keyframes blink{0%,86%{opacity:0}87%,92%{opacity:1}93%,95%{opacity:0}96%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@keyframes fadeio{0%,100%{opacity:.15}50%{opacity:1}}
.fig.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}
/* figures en HTML */
.fh{display:grid;gap:6px}
.fh .row2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.fh .row2:last-child{border:0}
.fh code,.fh .tok{font:600 .95rem var(--mono);background:var(--soft);color:var(--ink);padding:3px 7px;border-radius:4px;white-space:nowrap}
.fh .tok.a{background:var(--acc);color:var(--acc-ink)}
.fh .row2 span{font-size:.93rem}

.idea{background:var(--surface);border-left:6px solid var(--tc,var(--acc));border-radius:6px;padding:12px 14px;margin:14px 0}

(function(){
const C = window.BIA.chapters;

C.push({id:'1-1', th:'t1', title:'L’atmosphère', min:12,
goals:['décrire la composition de l’air et ses couches','donner les valeurs de l’atmosphère standard (ISA)','expliquer comment pression, température et densité varient avec l’altitude'],
body:`
<p>L’atmosphère est l’enveloppe d’air qui entoure la Terre. C’est là que volent les avions, et là que naît la météo. Pour la comprendre, on commence par ce qu’elle contient, puis par la façon dont elle change quand on monte.</p>
<h2>De quoi est faite l’air ?</h2>
<p>L’air sec contient environ <b>78 % de diazote</b> (N₂), <b>21 % de dioxygène</b> (O₂) et 1 % d’argon et d’autres gaz (dont 0,04 % de dioxyde de carbone). À cela s’ajoute de la <b>vapeur d’eau</b>, en quantité variable : c’est elle qui fait les nuages.</p>
<div class="callout en-clair"><b>En clair</b>L’air est un mélange gazeux qui a un poids. Une colonne d’air d’un centimètre carré, du sol jusqu’en haut de l’atmosphère, pèse environ 1 kg. La moitié de la masse de l’air se trouve sous 5 500 m.</div>
<h2>Les couches de l’atmosphère</h2>
<div class="figslot" data-fig="layers"></div>
<div class="tw"><table><tr><th>Couche</th><th>Altitude</th><th>À retenir</th></tr>
<tr><td><dfn>Troposphère</dfn></td><td>0 à environ 11 km</td><td>Nuages et météo. La température baisse avec l’altitude.</td></tr>
<tr><td><dfn>Tropopause</dfn></td><td>vers 11 km (8 km aux pôles, 16 km à l’équateur)</td><td>Limite entre les deux premières couches ; avions de ligne.</td></tr>
<tr><td><dfn>Stratosphère</dfn></td><td>11 à 50 km</td><td>Contient la couche d’ozone, qui absorbe les UV. La température remonte.</td></tr>
<tr><td><dfn>Mésosphère</dfn></td><td>50 à 80 km</td><td>La température baisse de nouveau. Les météorites s’y consument.</td></tr>
<tr><td><dfn>Thermosphère</dfn></td><td>80 à 600 km</td><td>Très chaude, très peu dense. Aurores polaires, station spatiale (400 km).</td></tr></table></div>
<h2>L’atmosphère standard (ISA)</h2>
<p>L’atmosphère réelle change tous les jours. Pour comparer les performances des avions, on utilise une atmosphère de référence appelée <b>ISA</b> (International Standard Atmosphere).</p>
<div class="tw"><table><tr><th>Grandeur</th><th>Au niveau de la mer (ISA)</th></tr><tr><td>Température</td><td>15 °C</td></tr><tr><td>Pression</td><td>1 013,25 hPa</td></tr><tr><td>Masse volumique</td><td>1,225 kg/m³</td></tr><tr><td>Variation de température</td><td>−6,5 °C par km (≈ −2 °C par 1 000 ft) jusqu’à 11 km, où l’on atteint −56,5 °C</td></tr></table></div>
<p class="formule">T(h) = 15 − 6,5 × h (h en km, jusqu’à 11 km)</p>
<div class="callout exemple"><b>Exemple</b>À 3 000 m en atmosphère standard : T = 15 − 6,5 × 3 = <b>−4,5 °C</b>.</div>
<h2>Comment l’air change quand on monte</h2>
<ul><li><b>La pression diminue</b> : il y a moins d’air au-dessus de toi. Près du sol, elle baisse d’environ 1 hPa tous les 8 m (≈ 30 ft). Elle vaut la moitié de sa valeur du sol vers 5 500 m.</li><li><b>La densité diminue</b> : l’air est plus « mince ». Les moteurs et les ailes y trouvent moins de matière à utiliser.</li><li><b>La température baisse</b> dans la troposphère.</li></ul>
<p>Une chaleur importante diminue aussi la densité : l’air chaud est moins dense que l’air froid. L’air humide l’est aussi (la vapeur d’eau est plus légère que le diazote et le dioxygène).</p>
<div class="figslot" data-fig="pressure"></div>
<div class="callout attention"><b>Attention</b>« Haut, chaud et humide » : trois facteurs qui réduisent la densité de l’air, donc la portance et la puissance du moteur. Les décollages demandent plus de piste.</div>
<p>Explore ces variations ci-dessous : monte jusqu’à la stratosphère, puis change l’écart de température.</p>
<div class="simslot" data-sim="isa"></div>
`,

['Quelle est la composition approximative de l’air sec ?','78 % de diazote et 21 % de dioxygène','21 % de diazote et 78 % de dioxygène','50 % de diazote et 50 % de dioxygène','78 % de dioxygène et 21 % d’hydrogène','L’air est fait surtout de diazote (78 %), puis de dioxygène (21 %).'],

['Quand l’altitude augmente, la pression atmosphérique :','diminue','augmente','reste constante','augmente jusqu’à 5 000 m puis diminue','La pression est le poids de l’air au-dessus de nous. Plus on monte, moins il y a d’air au-dessus.']

C.push({id:'1-2', th:'t1', title:'Pression et vent', min:14,
goals:['lire une carte d’isobares : anticyclone et dépression','expliquer d’où vient le vent et pourquoi il tourne','donner la direction du vent et l’exprimer en nœuds'],
body:`
<p>Le vent est de l’air qui se déplace. Il naît des différences de pression entre deux endroits, comme l’eau qui s’écoule d’un point haut vers un point bas.</p>
<h2>Anticyclone et dépression</h2>
<p>Sur une carte météo, les <dfn>isobares</dfn> sont les lignes qui relient les points de même pression (ramenée au niveau de la mer). Elles dessinent des centres :</p>
<div class="figslot" data-fig="highlow"></div>
<div class="tw"><table><tr><th></th><th>Anticyclone (A, haute pression)</th><th>Dépression (D, basse pression)</th></tr><tr><td>Air</td><td>Descend et s’écarte du centre</td><td>Monte, en se rapprochant du centre</td></tr><tr><td>Temps</td><td>Plutôt beau, stable</td><td>Nuages, pluie, vent</td></tr><tr><td>Rotation (hémisphère nord)</td><td>Sens des aiguilles d’une montre</td><td>Sens inverse des aiguilles d’une montre</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Quand l’air descend, il se réchauffe et les nuages s’évaporent : beau temps. Quand l’air monte, il se refroidit et la vapeur d’eau se condense : nuages et pluie.</div>
<h2>Pourquoi le vent tourne</h2>
<p>La force qui pousse l’air des hautes vers les basses pressions s’appelle le gradient de pression (la « pente » de la pression : plus elle est forte, plus l’air est poussé fort). Plus les isobares sont <b>serrées</b>, plus le gradient est fort et plus le vent est <b>fort</b>.</p>
<div class="figslot" data-fig="windforce"></div>
<p>Mais la Terre tourne sous l’air pendant qu’il se déplace. Imagine que tu lances un ballon sur un manège qui tourne : il semble dévier. Pour le vent, c’est pareil : il est dévié vers la droite dans l’hémisphère nord (c’est la force de Coriolis). Résultat : en altitude, le vent souffle <b>parallèle aux isobares</b> ; près du sol, le frottement le ralentit et il coupe un peu les isobares vers la basse pression.</p>
<div class="callout exemple"><b>Règle de Buys-Ballot (hémisphère nord)</b>Dos au vent, les basses pressions sont à ta gauche et les hautes pressions à ta droite.</div>
<div class="simslot" data-sim="wind"></div>
<h2>Direction et force du vent</h2>
<ul><li>La <b>direction</b> est celle <b>d’où vient</b> le vent, en degrés par rapport au nord. Un vent de 270° est un vent d’ouest : il souffle de l’ouest vers l’est.</li><li>La <b>force</b> se mesure en nœuds (kt). 1 kt = 1,852 km/h.</li><li>Une <dfn>rafale</dfn> est une pointe de vent brève et nettement supérieure au vent moyen.</li><li>La <b>manche à air</b> se gonfle dans le sens où le vent souffle. Elle est pointée vers l’endroit vers lequel va le vent et montre d’où il vient par son attache.</li></ul>
<h2>Vents locaux</h2>
<ul><li><b>Brise de mer</b> (le jour) : la terre chauffe plus vite que la mer, l’air chaud monte au-dessus de la terre et l’air frais de la mer vient le remplacer. Le vent souffle de la mer vers la terre.</li><li><b>Brise de terre</b> (la nuit) : la terre se refroidit plus vite, le sens s’inverse.</li><li><b>Relief</b> : le vent se renforce dans les cols et vallées, et crée de la turbulence et des rotors sous le vent des montagnes.</li></ul>
`,
keep:['Le vent va des hautes vers les basses pressions, dévié vers la droite (hémisphère nord).','Isobares serrées = vent fort.','Hémisphère nord : autour d’un anticyclone, sens horaire ; autour d’une dépression, sens inverse.','La direction du vent est celle d’où il vient ; la force est en nœuds.','Dos au vent, les basses pressions sont à gauche (Buys-Ballot).'],
traps:['Un vent « de 270° » vient de l’ouest, il ne va pas vers l’ouest.','Anticyclone ne signifie pas toujours ciel bleu : en hiver, il peut garder des stratus bas ou du brouillard.'],
qs:[
['Autour d’un anticyclone de l’hémisphère nord, le vent tourne :','dans le sens des aiguilles d’une montre','dans le sens inverse des aiguilles d’une montre','en ligne droite vers le centre','sans direction régulière','Dans l’hémisphère nord, l’air tourne dans le sens horaire autour d’un anticyclone.'],
['Sur une carte, les isobares se resserrent. Que se passe-t-il pour le vent ?','Il se renforce','Il faiblit','Il change de sens','Il ne change pas','Des isobares serrées traduisent un fort gradient de pression, donc un vent plus fort.'],
['Un vent annoncé à 270° signifie qu’il :','vient de l’ouest','va vers l’ouest','vient du sud','vient de l’est','La direction du vent est toujours celle d’où il vient. 270° correspond à l’ouest.'],
['Pendant la journée, au bord de la mer, une brise souffle typiquement :','de la mer vers la terre','de la terre vers la mer','parallèlement à la côte, sans raison','du sud vers le nord','La terre s’échauffe plus vite que l’eau : l’air chaud monte et l’air frais venu de la mer prend sa place.']
]});

C.push({id:'1-3', th:'t1', title:'Humidité, nuages et stabilité', min:16,
goals:['expliquer comment se forme un nuage et calculer sa base','reconnaître les principaux genres de nuages','distinguer une atmosphère stable d’une atmosphère instable'],
body:`
<p>Il n’y a pas de nuage sans vapeur d’eau, et pas de nuage sans refroidissement. Comprendre ces deux ingrédients permet de prévoir presque tout ce que tu verras dans le ciel.</p>
<h2>L’humidité et le point de rosée</h2>
<p>L’air chaud peut contenir plus de vapeur d’eau que l’air froid. L’<dfn>humidité relative</dfn> compare la quantité de vapeur présente à la quantité maximale possible à cette température. À 100 %, l’air est <b>saturé</b>.</p>
<p>Le <dfn>point de rosée</dfn> (Td) est la température à laquelle il faut refroidir l’air pour qu’il devienne saturé. On compare toujours T (température de l’air) et Td : l’<b>écart T − Td</b> dit si l’air est loin ou près de la saturation.</p>
<div class="callout en-clair"><b>En clair</b>Le verre d’eau glacée se couvre de gouttes : l’air autour de lui est refroidi sous son point de rosée, la vapeur se condense. Un nuage, c’est la même chose, en altitude.</div>
<h2>Comment se forme un nuage</h2>
<p>Un nuage se forme quand l’air est <b>refroidi jusqu’à saturation</b>, le plus souvent parce qu’il <b>monte</b> : en montant, la pression diminue, l’air se détend et se refroidit. Il peut aussi être refroidi par le sol la nuit (brouillard de rayonnement : le sol perd sa chaleur par temps clair et refroidit l’air juste au-dessus) ou en passant sur une surface froide (brouillard d’advection : de l’air doux et humide glisse sur une surface froide).</p>
<div class="figslot" data-fig="cloudform"></div>
<p class="formule">base des nuages (m) ≈ 125 × (T − Td)</p>
<div class="callout exemple"><b>Exemple</b>T = 20 °C, Td = 8 °C : écart de 12 °C. Base des cumulus à 125 × 12 = <b>1 500 m</b>. En pieds : environ 400 ft par degré d’écart.</div>
<h2>Stable ou instable ?</h2>
<p>Une bulle d’air qui monte se refroidit : environ 1 °C par 100 m tant qu’elle est sèche (on parle de gradient adiabatique sec : « adiabatique » veut juste dire que la bulle se refroidit parce qu’elle se détend, sans échanger de chaleur avec l’extérieur), et environ <b>0,5 °C par 100 m</b> une fois saturée (la vapeur d’eau qui se transforme en gouttelettes libère de la chaleur, donc elle se refroidit moins vite). On compare ensuite avec la température de l’air autour d’elle.</p>
<div class="figslot" data-fig="stability"></div>
<ul><li><b>Instable</b> : la bulle reste plus chaude que l’air environnant, elle continue de monter. Résultat : nuages à développement vertical (cumulus, cumulonimbus), averses, thermiques, turbulence, très bonne visibilité entre les nuages.</li><li><b>Stable</b> : la bulle devient plus froide, elle redescend. Résultat : nuages en nappes (stratus), air calme, mais visibilité réduite, brume.</li><li>Une <b>inversion</b> (la température augmente avec l’altitude) est une couche très stable : elle agit comme un couvercle : l’air chaud d’en dessous ne peut plus monter (la convection, c’est ce mouvement de montée de l’air chaud).</li></ul>
<div class="simslot" data-sim="parcel"></div>
<h2>Les genres de nuages</h2>
<div class="tw"><table><tr><th>Étage</th><th>Altitude (régions tempérées)</th><th>Nuages</th></tr><tr><td>Supérieur</td><td>5 à 13 km</td><td>Cirrus (Ci), cirrocumulus (Cc), cirrostratus (Cs) : glace, filaments, halo</td></tr><tr><td>Moyen</td><td>2 à 7 km</td><td>Altocumulus (Ac), altostratus (As)</td></tr><tr><td>Inférieur</td><td>sol à 2 km</td><td>Stratus (St), stratocumulus (Sc), nimbostratus (Ns, pluie continue)</td></tr><tr><td>Développement vertical</td><td>base basse, sommet à plus de 10 km</td><td>Cumulus (Cu), cumulonimbus (Cb : orages, grêle, givrage, turbulence)</td></tr></table></div>
<p>Pour retenir : <b>cirro-</b> = en haut ; <b>alto-</b> = au milieu ; <b>cumulus</b> = en tas ; <b>stratus</b> = en couche ; <b>nimbus</b> = qui donne de la pluie.</p>
<h2>Visibilité et couverture</h2>
<ul><li><b>Brouillard</b> : visibilité inférieure à 1 000 m. <b>Brume</b> : visibilité entre 1 et 5 km.</li><li>La couverture se compte en <dfn>octas</dfn> (huitièmes du ciel) : FEW 1-2, SCT 3-4, BKN 5-7, OVC 8. Le <b>plafond</b> est la base de la plus basse couche BKN ou OVC.</li></ul>
`,

['Quel nuage est associé à l’orage, à la grêle et à une forte turbulence ?','Le cumulonimbus','Le stratus','Le cirrus','Le nimbostratus','Le cumulonimbus est un nuage d’instabilité à fort développement vertical.'],

C.push({id:'1-4', th:'t1', title:'Masses d’air et fronts', min:15,
goals:['expliquer ce qu’est un front chaud, un front froid, une occlusion','décrire les nuages et le temps avant, pendant et après un front','prévoir l’évolution du vent, de la pression et de la température'],
body:`
<p>Une <dfn>masse d’air</dfn> est un grand volume d’air aux caractéristiques homogènes (température, humidité). Une masse d’air froid et une masse d’air chaud ne se mélangent pas facilement : leur frontière s’appelle un <dfn>front</dfn>.</p>
<h2>Deux fronts, deux mécanismes</h2>
<div class="figslot" data-fig="fronts"></div>
<div class="tw"><table><tr><th></th><th>Front chaud</th><th>Front froid</th></tr><tr><td>Qui avance ?</td><td>L’air chaud glisse au-dessus de l’air froid</td><td>L’air froid, plus dense, pousse sous l’air chaud</td></tr><tr><td>Pente du front</td><td>Faible (environ 1/150) : s’étale sur 1 000 km</td><td>Forte (environ 1/50) : zone étroite</td></tr><tr><td>Nuages</td><td>Ci → Cs → As → Ns</td><td>Cumulonimbus</td></tr><tr><td>Temps</td><td>Pluie continue, plafond bas, visibilité réduite</td><td>Averses, orages, rafales, grain (une averse brève et brutale avec un vent soudain)</td></tr><tr><td>Après le passage</td><td>Température qui monte</td><td>Température qui chute, pression qui remonte</td></tr><tr><td>Symbole</td><td>Demi-cercles rouges</td><td>Triangles bleus</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Le front chaud est une rampe douce : tu vois le ciel se dégrader pendant des heures. Le front froid est un mur : tout arrive d’un coup.</div>
<h2>Une perturbation complète</h2>
<p>Une perturbation de nos régions se déplace d’ouest en est. Pour un observateur au sol, la succession est toujours la même : front chaud, puis secteur chaud (la zone d’air doux entre les deux fronts), puis front froid, puis traîne (un ciel variable avec des averses isolées). Le vent <b>tourne vers la droite</b> à chaque passage (sud-est, sud-ouest, nord-ouest). La pression baisse avant le front chaud, reste basse dans le secteur chaud, puis remonte après le front froid.</p>
<div class="simslot" data-sim="front"></div>
<h2>L’occlusion</h2>
<p>Le front froid avance plus vite que le front chaud. Il finit par le rattraper : c’est une <dfn>occlusion</dfn>. L’air chaud est soulevé du sol. Le temps y est mauvais (symbole violet).</p>
<div class="callout attention"><b>Attention</b>Le pire moment pour un pilote : le passage du front froid (cumulonimbus, cisaillement (le vent change brutalement), turbulence, grêle) et le front chaud (plafond très bas, pluie continue, givrage possible en altitude).</div>
`,
keep:['Front chaud : pente douce, Ci-Cs-As-Ns, pluie continue, réchauffement.','Front froid : pente forte, Cb, averses et orages, refroidissement et pression qui remonte.','Ordre de passage : front chaud, secteur chaud, front froid, traîne ; déplacement d’ouest en est.','Hémisphère nord : le vent tourne à droite à chaque front.','Le front froid rattrape le front chaud : occlusion.'],
traps:['Le front chaud n’est pas « plus chaud » partout : c’est l’air chaud qui avance et remplace l’air froid.','Après le front froid, le ciel s’éclaircit mais reste turbulent (cumulus, averses isolées).'],
qs:[
['Quel front est associé à des cumulonimbus, des averses et des orages ?','Le front froid','Le front chaud','L’anticyclone','La dorsale','Le front froid est raide : l’air chaud est soulevé brutalement, ce qui forme des cumulonimbus.'],
['Avant l’arrivée d’un front chaud, la succession typique des nuages est :','Ci, Cs, As, Ns','Cb, Cu, Sc, St','Ns, As, Cs, Ci','St, Sc, Cu, Cb','Un front chaud annonce son arrivée de loin : cirrus, puis cirrostratus, altostratus, nimbostratus.'],
['Au passage d’un front froid dans l’hémisphère nord, le vent :','tourne vers la droite et se renforce par rafales','tourne vers la gauche et faiblit','ne change pas','s’inverse et devient calme','Le vent tourne à droite à chaque front. Derrière le front froid, il vient du nord-ouest et souffle en rafales.'],
['Que se passe-t-il quand un front froid rattrape un front chaud ?','Une occlusion','Un anticyclone','Une brise de mer','Une inversion','Le front froid se déplace plus vite : il rattrape le front chaud et soulève l’air chaud, c’est l’occlusion.']
]});

C.push({id:'1-5', th:'t1', title:'Phénomènes dangereux', min:14,
goals:['identifier les principaux dangers météo pour un aéronef','expliquer le givrage, y compris celui du carburateur','adopter les bons réflexes face à un orage, au cisaillement, à la turbulence et au brouillard'],
body:`
<p>La météo est la première cause de préoccupation du pilote. Voici les phénomènes à connaître, ce qui les provoque, et comment s’en protéger.</p>
<h2>L’orage et le cumulonimbus</h2>
<p>Un orage naît d’un cumulonimbus. Il combine presque tous les dangers : fortes ascendances et descendances, <b>turbulence sévère</b>, <b>grêle</b>, <b>givrage</b>, foudre, visibilité nulle sous l’averse, rafales violentes et <b>cisaillement</b> sous le nuage. Son cycle : développement (courants ascendants), maturité (pluie, grêle, foudre), dissipation.</p>
<div class="figslot" data-fig="cb"></div>
<div class="callout attention"><b>Règle</b>On ne traverse jamais un cumulonimbus. On le contourne largement, on retarde le vol ou on se déroute. Il faut rester loin aussi de son enclume (la partie plate qui s’étale tout en haut) et de l’air sous le nuage.</div>
<h2>Le givrage</h2>
<p>Le givrage apparaît quand l’avion traverse des nuages ou de la pluie à des températures proches de 0 °C, voire négatives : les gouttelettes surfondues (de l’eau restée liquide alors qu’elle est en dessous de 0 °C) gèlent d’un coup au contact de l’avion. Conséquences :</p>
<ul><li>le givre change le profil de l’aile : <b>la portance diminue, la traînée et la masse augmentent</b> ;</li><li>le décrochage arrive plus tôt, à une vitesse plus élevée ;</li><li>les prises de pression (Pitot) peuvent se boucher, l’hélice et les gouvernes sont affectées.</li></ul>
<div class="callout attention"><b>Givrage carburateur</b>Dans un moteur à pistons, le carburant qui s’évapore et l’air qui se détend refroidissent le carburateur de plusieurs dizaines de degrés, comme une bombe aérosol qui devient froide quand on l’utilise. Le givre peut se former même par température extérieure douce (+15 à +20 °C) avec une forte humidité. Remède : réchauffage carburateur.</div>
<h2>Turbulence et cisaillement</h2>
<ul><li><b>Turbulence thermique</b> : sous les cumulus, l’après-midi, sur sol chaud.</li><li><b>Turbulence mécanique</b> : le vent contourne le relief, les bâtiments, les arbres près de la piste.</li><li><b>Turbulence en air clair</b> : près des courants-jets, sans nuage visible.</li><li><b>Ondes de montagne</b> : de fortes oscillations de l’air derrière un relief (côté « sous le vent »), avec des rotors, des tourbillons dangereux près du sol.</li><li><dfn>Cisaillement de vent</dfn> (windshear) : changement brusque de vitesse ou de direction du vent sur une courte distance. À l’atterrissage, il peut faire perdre de la vitesse d’un coup. Les microrafales (un courant d’air qui s’abat du nuage et s’étale sur le sol) en sont la forme la plus violente.</li></ul>
<h2>Visibilité réduite</h2>
<p>Brouillard (visibilité &lt; 1 000 m) et brume sont des pièges : ils empêchent de voir le sol, la piste, le relief. Un vol à vue y est interdit. Les brouillards de rayonnement se forment par nuit claire, vent faible, air humide (T − Td faible) et se dissipent en matinée.</p>
<h2>Vent fort, rafales, vent traversier</h2>
<p>Un vent traversier fort à l’atterrissage peut dépasser les capacités du pilote ou de l’avion. Chaque aéronef a une limite de vent traversier démontré, indiquée dans son manuel de vol.</p>
`,
keep:['Cumulonimbus : turbulence, grêle, givrage, foudre, rafales, cisaillement. On le contourne largement.','Givrage : moins de portance, plus de traînée et de masse ; le décrochage arrive plus tôt.','Le carburateur peut givrer même par temps doux avec de l’humidité : réchauffage carburateur.','Cisaillement : changement brusque du vent en vitesse ou direction ; microrafale sous un orage.','Brouillard : visibilité inférieure à 1 000 m ; vol à vue impossible.'],
traps:['« Il fait +15 °C donc pas de givrage » est faux pour le carburateur.','Sous un Cb, l’air est parfois calme au premier abord, mais les rafales peuvent arriver d’un coup.'],
qs:[
['Quel est l’effet principal du givrage sur une aile ?','Le profil se dégrade : portance diminuée, traînée et masse augmentées','La portance augmente fortement','La vitesse de décrochage baisse','Aucun effet tant que le moteur tourne','Le givre déforme l’aile et l’alourdit : l’avion décroche plus tôt et vole moins bien.'],
['Dans quelles conditions le carburateur peut-il givrer ?','Même par temps doux, avec une forte humidité','Seulement par température négative','Seulement au-dessus de 5 000 m','Seulement par temps sec','La détente de l’air et la vaporisation du carburant refroidissent fortement le carburateur : il peut givrer même à +15 °C si l’air est humide.'],
['Que faire en présence d’un cumulonimbus sur sa route ?','Le contourner largement ou se dérouter','Le traverser à grande vitesse','Voler juste sous sa base','Monter au-dessus en palier','Le Cb est un danger majeur (turbulence, grêle, givrage, foudre). On l’évite largement.'],
['Un cisaillement de vent est :','une variation brusque du vent en vitesse ou en direction sur une courte distance','un vent constant dans la journée','un nuage bas en forme de lame','l’inclinaison des ailes en virage','C’est un changement soudain du vent. À l’atterrissage, il peut faire perdre brutalement de la vitesse.']
]});

C.push({id:'1-6', th:'t1', title:'Informations météo : METAR, TAF, cartes', min:16,
goals:['lire un METAR groupe par groupe','distinguer observation (METAR) et prévision (TAF)','citer les principales cartes et messages d’information météo'],
body:`
<p>Avant chaque vol, le pilote consulte la météo. Les messages sont écrits dans un code international, très compact, qu’il faut savoir décoder.</p>
<h2>METAR : l’observation d’un aérodrome</h2>
<p>Un METAR est un message qui décrit la météo <b>observée</b> sur un aérodrome, écrit dans un code abrégé. Il est publié toutes les 30 minutes ou toutes les heures. Il se lit toujours dans le même ordre :</p>
<div class="figslot" data-fig="metar"></div>
<p class="formule">METAR LFBO 061830Z 24012G25KT 9999 SCT030 BKN080 12/08 Q1015 NOSIG</p>
<div class="tw"><table><tr><th>Groupe</th><th>Signification</th></tr>
<tr><td>LFBO</td><td>Aérodrome (code OACI) : ici Toulouse-Blagnac</td></tr>
<tr><td>061830Z</td><td>Jour 06, 18 h 30 UTC</td></tr>
<tr><td>24012G25KT</td><td>Vent de 240°, 12 nœuds, rafales à 25 nœuds</td></tr>
<tr><td>9999</td><td>Visibilité de 10 km ou plus</td></tr>
<tr><td>SCT030 BKN080</td><td>Nuages épars à 3 000 ft, fragmentés à 8 000 ft (plafond)</td></tr>
<tr><td>12/08</td><td>Température 12 °C, point de rosée 8 °C</td></tr>
<tr><td>Q1015</td><td>QNH 1 015 hPa</td></tr>
<tr><td>NOSIG</td><td>Pas de changement significatif prévu</td></tr></table></div>
<div class="callout en-clair"><b>En clair</b>Les nuages sont toujours donnés en nombre d’octas puis en hauteur en centaines de pieds au-dessus de l’aérodrome : BKN020 = 5 à 7 octas à 2 000 ft.</div>
<p>Quelques abréviations utiles : <b>CAVOK</b> (visibilité ≥ 10 km, pas de nuage sous 5 000 ft ni de Cb, pas de phénomène significatif), <b>RA</b> pluie, <b>SN</b> neige, <b>TS</b> orage, <b>FG</b> brouillard, <b>BR</b> brume, <b>+</b> fort, <b>−</b> faible, <b>BECMG</b> évolution durable, <b>TEMPO</b> variation temporaire.</p>
<p>Décode des messages réels en touchant chaque groupe :</p>
<div class="simslot" data-sim="metar"></div>
<h2>TAF : la prévision d’un aérodrome</h2>
<p>Le <dfn>TAF</dfn> est une <b>prévision</b> pour un aérodrome, sur 9 à 30 heures selon l’aérodrome. Il utilise le même code que le METAR, avec des groupes d’évolution (BECMG, TEMPO, PROB). Règle simple : <b>METAR = ce qui est ; TAF = ce qui sera</b>.</p>
<h2>Autres sources</h2>
<ul><li><b>Cartes de pression au sol</b> (analyse) : isobares, fronts, centres d’action.</li><li><b>Cartes de temps significatif</b> (TEMSI) : phénomènes dangereux prévus (orages, givrage, turbulence), nébulosité, fronts.</li><li><b>WINTEM</b> : vent et température en altitude.</li><li><b>Images satellite et radar</b> : nuages et précipitations en temps quasi réel.</li><li><b>SIGMET</b> : message d’alerte sur les phénomènes dangereux en route.</li><li><b>Météo-France</b> est le service météorologique national.</li></ul>
<div class="callout attention"><b>Attention</b>Les heures météo sont toutes en <b>UTC</b>, notée Z. En France, l’heure locale est UTC + 1 l’hiver et UTC + 2 l’été.</div>
`,
keep:['METAR : observation ; TAF : prévision.','Ordre du METAR : aérodrome, date-heure UTC, vent, visibilité, temps, nuages, T/Td, QNH, tendance.','27015G25KT : 270°, 15 kt, rafales 25 kt. 9999 : visibilité ≥ 10 km. Q1015 : QNH 1 015 hPa.','BKN/OVC = plafond. Nuages en centaines de pieds au-dessus de l’aérodrome.','CAVOK : bonnes conditions (visibilité ≥ 10 km, pas de nuage sous 5 000 ft).'],
traps:['Les hauteurs de nuages du METAR sont en pieds, au-dessus de l’aérodrome, pas au-dessus du niveau de la mer.','Ne confonds pas BECMG (changement durable) et TEMPO (passager).'],
qs:[
['Que signifie « 27015G25KT » dans un METAR ?','Vent de 270°, 15 nœuds, rafales à 25 nœuds','Vent de 150°, 27 nœuds, rafales à 25 nœuds','Visibilité de 27 km','Vent de 25 nœuds venant du 015°','Les trois premiers chiffres donnent la direction d’où vient le vent, les deux suivants la vitesse, puis G pour les rafales.'],
['Quelle est la différence entre un METAR et un TAF ?','Le METAR est une observation, le TAF est une prévision','Le METAR est une prévision, le TAF est une observation','Le METAR concerne les nuages, le TAF le vent','Aucune différence','METAR = ce qui est observé maintenant ; TAF = ce qui est prévu.'],

['Que signifie BKN020 ?','5 à 7 octas de nuages à 2 000 ft','Brouillard de 20 m','Vent de 20 nœuds','Nuages épars à 20 000 ft','BKN = 5 à 7 octas (fragmenté, donc un plafond). 020 = 2 000 ft.'],
['Que signifie CAVOK ?','Visibilité ≥ 10 km, pas de nuage sous 5 000 ft ni de Cb, pas de phénomène significatif','Ciel couvert avec visibilité inférieure à 5 km','Orage à proximité','Visibilité verticale réduite','CAVOK est une expression qui regroupe de bonnes conditions pour le vol à vue.']

(function(){
const C = window.BIA.chapters;

C.push({id:'2-1', th:'t2', title:'Aérostatique : pourquoi un ballon monte', min:12,
goals:['énoncer le principe d’Archimède et l’appliquer à un ballon','distinguer montgolfière, ballon à gaz et dirigeable','expliquer comment un pilote de ballon monte, descend et choisit sa direction'],
body:`
<p>Un ballon vole sans aile, sans moteur et sans vitesse. Il est « plus léger que l’air » : on dit que c’est un <b>aérostat</b>. Ce qui le soutient s’appelle la poussée d’Archimède.</p>
<h2>Le principe d’Archimède</h2>
<div class="callout en-clair"><b>Principe</b>Tout corps plongé dans un fluide subit une poussée verticale, dirigée vers le haut, égale au <b>poids du volume de fluide qu’il déplace</b>.</div>
<p>Un ballon déplace un grand volume d’air. L’air qu’il pousse pèse, par exemple, 3 400 kg. Si le ballon avec son enveloppe, sa nacelle, son gaz et ses passagers pèse moins que cela, il monte. S’il pèse plus, il descend. S’ils sont égaux, il flotte à une altitude stable.</p>
<div class="figslot" data-fig="archimede"></div>
<h2>Deux façons d’être plus léger que l’air</h2>
<div class="tw"><table><tr><th></th><th>Montgolfière (air chaud)</th><th>Ballon à gaz (charlière)</th></tr><tr><td>Principe</td><td>On chauffe l’air de l’enveloppe : il devient moins dense que l’air extérieur</td><td>On remplit l’enveloppe d’un gaz plus léger que l’air : hélium ou hydrogène</td></tr><tr><td>Enveloppe</td><td>Ouverte à la base (le brûleur est dessous)</td><td>Fermée</td></tr><tr><td>Monter</td><td>Chauffer avec le brûleur (propane)</td><td>Lâcher du lest (sable, eau)</td></tr><tr><td>Descendre</td><td>Cesser de chauffer, ouvrir la soupape pour libérer de l’air chaud</td><td>Lâcher un peu de gaz par la soupape</td></tr></table></div>
<div class="simslot" data-sim="balloon"></div>
<h2>Le pilote ne peut pas « conduire » horizontalement</h2>
<p>Le ballon n’a ni moteur ni gouvernail. Il se déplace avec le vent, à la même vitesse que lui. Le pilote ne contrôle que l’<b>altitude</b>. Pour changer de direction, il monte ou descend pour trouver une couche d’air dont le vent est orienté comme il le souhaite.</p>
<h2>Les dirigeables</h2>
<p>Un <dfn>dirigeable</dfn> est un aérostat auquel on a ajouté une <b>propulsion</b> et des <b>gouvernes</b> : il peut avancer et se diriger. Il est rempli d’un gaz porteur (aujourd’hui de l’hélium). Le dirigeable <b>Hindenburg</b> rempli d’hydrogène, gaz inflammable, a pris feu en 1937 ; depuis, on utilise de l’hélium, inerte.</p>
<h2>Autres usages</h2>
<p>Les <b>ballons-sondes</b> mesurent pression, température, humidité et vent jusqu’à 30 km d’altitude : la météo en dépend. Les ballons stratosphériques servent à l’astronomie ou aux télécommunications.</p>
`,

C.push({id:'2-2', th:'t2', title:'L’air en mouvement : pressions et vitesses', min:15,
goals:['distinguer pression statique, dynamique et totale','énoncer le théorème de Bernoulli et expliquer le tube de Venturi','différencier vitesse indiquée, vitesse propre, vitesse sol et nombre de Mach'],
body:`
<p>Pour comprendre la portance, il faut d’abord comprendre ce que fait l’air quand il bouge autour d’un objet. Trois idées suffisent.</p>
<h2>Trois pressions</h2>
<ul><li><dfn>Pression statique</dfn> : celle de l’air ambiant, qui s’exerce dans toutes les directions. C’est la pression atmosphérique.</li><li><dfn>Pression dynamique</dfn> : due au mouvement de l’air. Elle vaut <b>½ × ρ × V²</b> (ρ = masse volumique, V = vitesse).</li><li><dfn>Pression totale</dfn> = statique + dynamique. On la mesure en arrêtant l’air face à une prise (tube de Pitot).</li></ul>
<p class="formule">q = ½ × ρ × V²</p>
<p>La pression dynamique augmente avec le <b>carré</b> de la vitesse : à vitesse double, elle est multipliée par 4.</p>
<h2>Bernoulli : accélérer, c’est perdre de la pression statique</h2>
<div class="callout en-clair"><b>Théorème de Bernoulli</b>Dans un écoulement d’air sans frottement, quand la vitesse <b>augmente</b>, la pression <b>statique</b> <b>diminue</b> (la pression totale reste constante).</div>
<p>Le tube de Venturi le montre bien : l’air est forcé de passer par un rétrécissement. Comme pour l’eau d’un tuyau d’arrosage que l’on pince avec le pouce, l’air doit aller plus vite là où le passage est étroit (c’est l’équation de continuité). Résultat : la pression statique y baisse.</p>
<div class="figslot" data-fig="venturi"></div>
<div class="simslot" data-sim="venturi"></div>
<h2>Comment l’avion mesure sa vitesse</h2>
<p>Le <b>tube de Pitot</b> capte la pression totale ; des prises statiques captent la pression statique. L’<b>anémomètre</b> fait la différence : c’est la pression dynamique, donc la vitesse. Si le Pitot gèle, l’anémomètre devient faux : il est chauffé en vol.</p>
<h2>Quatre vitesses à ne pas confondre</h2>
<div class="tw"><table><tr><th>Vitesse</th><th>Sens</th></tr><tr><td><dfn>Vitesse indiquée</dfn> (IAS)</td><td>Ce que lit le pilote sur l’anémomètre</td></tr><tr><td><dfn>Vitesse propre</dfn> (TAS)</td><td>Vitesse réelle de l’avion dans l’air. En altitude, elle est plus grande que la vitesse indiquée (l’air est moins dense).</td></tr><tr><td><dfn>Vitesse sol</dfn> (GS)</td><td>Vitesse par rapport au sol = vitesse propre corrigée du vent. Vent de face : GS &lt; TAS ; vent arrière : GS &gt; TAS.</td></tr><tr><td><dfn>Nombre de Mach</dfn></td><td>Rapport de la vitesse de l’avion à la vitesse du son. Mach 1 = vitesse du son (≈ 340 m/s, soit 1 225 km/h au niveau de la mer en ISA ; ≈ 1 060 km/h à 11 000 m car il y fait plus froid).</td></tr></table></div>
<p>Régimes de vol : subsonique (&lt; Mach 0,8), transsonique (0,8 à 1,2), supersonique (&gt; 1,2). Passer le mur du son produit une onde de choc, perçue au sol comme un <b>bang</b>.</p>
<h2>La couche limite</h2>
<p>L’air colle à la surface de l’avion : tout près, il est ralenti par frottement. Cette mince couche d’air est la couche limite. Elle est d’abord régulière (laminaire : l’air glisse en filets bien rangés), puis devient turbulente (il tourbillonne). Quand elle se détache de l’aile, on parle de décollement : c’est le début du décrochage.</p>
`,
keep:['Pression dynamique : q = ½ρV². À vitesse double, ×4.','Pression totale = statique + dynamique.','Bernoulli : vitesse ↑ ⇒ pression statique ↓.','L’anémomètre indique la vitesse indiquée ; en altitude la vitesse propre est plus élevée.','Vent de face : vitesse sol inférieure à la vitesse propre.'],
traps:['Ne confonds pas pression dynamique (liée au mouvement) et pression totale.','Mach 1 n’est pas une vitesse fixe : elle dépend de la température.'],
qs:[
['Selon le théorème de Bernoulli, quand la vitesse d’un écoulement augmente :','la pression statique diminue','la pression statique augmente','la pression totale diminue fortement','la température de l’air chute à 0 °C','Dans un écoulement sans frottement, la somme pression statique + pression dynamique reste constante : si l’une monte, l’autre baisse.'],
['La pression totale est égale à :','la pression statique plus la pression dynamique','la pression statique moins la pression dynamique','la pression dynamique seule','la pression atmosphérique au sol','La prise Pitot mesure la pression totale = statique + dynamique.'],
['À haute altitude, comparée à la vitesse indiquée, la vitesse propre est :','plus grande','plus petite','égale','nulle','L’air est moins dense : pour une même vitesse indiquée (même pression dynamique), l’avion va plus vite dans l’air.'],
['Un avion vole à 100 kt de vitesse propre avec un vent de face de 20 kt. Sa vitesse sol est de :','80 kt','120 kt','100 kt','20 kt','GS = TAS − vent de face = 100 − 20 = 80 kt.'],
['Le nombre de Mach est :','le rapport de la vitesse de l’avion à la vitesse du son','la vitesse du son en km/h','la vitesse maximale d’un avion','la vitesse du vent en altitude','Mach 0,8 : l’avion va à 80 % de la vitesse du son locale.']
]});

C.push({id:'2-3', th:'t2', title:'L’aile : portance, traînée, décrochage', min:20,
goals:['décrire un profil d’aile et définir l’incidence','relier la portance à la vitesse, à la surface et à l’incidence','expliquer le décrochage, la finesse et les dispositifs hypersustentateurs'],
body:`
<p>L’aile est le cœur de l’avion. Elle crée la <b>portance</b>, la force qui soutient l’appareil, en échange d’une inévitable <b>traînée</b>.</p>
<h2>Vocabulaire du profil</h2>
<ul><li><dfn>Bord d’attaque</dfn> : l’avant de l’aile ; <dfn>bord de fuite</dfn> : l’arrière.</li><li><dfn>Extrados</dfn> : le dessus ; <dfn>intrados</dfn> : le dessous.</li><li><dfn>Corde</dfn> : ligne droite du bord d’attaque au bord de fuite.</li><li><dfn>Vent relatif</dfn> : l’air vu depuis l’aile, de direction opposée à la trajectoire.</li><li><dfn>Incidence</dfn> : angle entre la corde et le vent relatif.</li></ul>
<div class="callout attention"><b>Incidence, assiette, pente</b>Ce sont trois angles différents. L’<b>assiette</b> est l’angle du fuselage avec l’horizon. La <b>pente</b> est l’angle de la trajectoire avec l’horizon. Et <b>incidence = assiette − pente</b>.</div>
<h2>Pourquoi l’aile porte</h2>
<p>L’aile <b>dévie l’air vers le bas</b> ; par réaction, l’air pousse l’aile vers le haut. En même temps, l’air accélère sur l’extrados, la pression statique y baisse (Bernoulli) et cette <b>dépression</b> « aspire » l’aile vers le haut ; en dessous, la pression augmente légèrement. Toutes ces petites forces de pression s’additionnent en une seule force : la résultante aérodynamique. On la décompose en :</p>
<div class="figslot" data-fig="airfoil"></div>
<ul><li>la <b>portance</b> (Fz), perpendiculaire au vent relatif ;</li><li>la <b>traînée</b> (Fx), parallèle au vent relatif et qui s’oppose à l’avancement.</li></ul>
<p class="formule">Portance = ½ × ρ × S × V² × Cz</p>
<p>ρ : masse volumique de l’air ; S : surface de l’aile ; V : vitesse ; Cz : coefficient de portance, qui dépend du profil et de l’incidence. Ce que cette formule apprend : la portance est proportionnelle à la <b>surface</b>, à la <b>densité</b> de l’air, et au <b>carré de la vitesse</b>.</p>
<div class="simslot" data-sim="wing"></div>
<h2>Le décrochage</h2>
<p>Quand on augmente l’incidence, Cz augmente… jusqu’à l’<dfn>incidence critique</dfn> (environ 15° sur un avion léger). Au-delà, l’air n’arrive plus à suivre l’extrados : il se <b>décolle</b>, la portance chute, la traînée explose. C’est le <b>décrochage</b>.</p>
<div class="figslot" data-fig="stall"></div>
<ul><li>Le décrochage dépend de l’<b>incidence</b>, pas directement de la vitesse : on peut décrocher à n’importe quelle vitesse, dans n’importe quelle attitude (virage, forte accélération).</li><li><b>Signes avant-coureurs</b> : avertisseur de décrochage, vibrations (buffeting), commandes molles, avion qui s’enfonce.</li><li><b>Récupération</b> : <b>diminuer l’incidence</b> (manche vers l’avant), remettre de la puissance, redresser progressivement.</li><li>La vitesse de décrochage <b>augmente</b> avec la masse, le facteur de charge (virage) et le givrage ; elle <b>diminue</b> avec les volets sortis.</li></ul>
<h2>La traînée</h2>
<ul><li><b>Traînée parasite</b> : forme, frottement, interférences. Elle augmente avec la vitesse (au carré).</li><li><b>Traînée induite</b> : c’est le « prix à payer » pour obtenir de la portance. Elle vient des tourbillons qui se forment au bout des ailes (tourbillons marginaux). Elle est plus forte à basse vitesse, forte incidence. Les winglets la réduisent.</li></ul>
<h2>La finesse</h2>
<p>La finesse est le rapport portance/traînée (Cz/Cx) : elle dit combien de portance tu obtiens pour chaque unité de traînée. C’est aussi la distance parcourue en vol plané pour une hauteur perdue. Un planeur de finesse 40 parcourt 40 km depuis 1 000 m d’altitude (air calme). Un avion de ligne a une finesse d’environ 17, un avion léger de 9 à 10.</p>
<h2>Volets, becs, aérofreins</h2>
<p>Les <b>volets</b> et les <b>becs</b> sont des dispositifs hypersustentateurs (des dispositifs qui augmentent la portance) : ils augmentent Cz, le coefficient de portance, et permettent de voler plus lentement au décollage et à l’atterrissage. Les <b>aérofreins</b> et <b>spoilers</b> augmentent la traînée et diminuent la portance pour descendre ou ralentir.</p>
`,
keep:['Incidence : angle entre la corde et le vent relatif ; incidence = assiette − pente.','Portance = ½ρSV²Cz : proportionnelle à S, ρ, V² et Cz.','Décrochage : incidence trop grande (≈ 15°), écoulement décollé. Le remède : diminuer l’incidence.','Finesse = portance/traînée = distance parcourue / hauteur perdue.','Les volets augmentent la portance et réduisent la vitesse de décrochage.'],
traps:['Le décrochage n’est pas une « vitesse trop faible » seulement : c’est une incidence trop élevée.','Idée fausse très répandue : « l’air met le même temps au-dessus et en dessous ». Ce n’est pas ce qui crée la portance.'],

['Le décrochage se produit quand :','l’incidence dépasse l’incidence critique','la vitesse dépasse la vitesse maximale','le moteur s’arrête','les volets sont rentrés','Au-delà de l’incidence critique, l’écoulement se décolle de l’extrados et la portance chute.'],
['Si la vitesse double (autres paramètres inchangés), la portance :','est multipliée par 4','est multipliée par 2','reste identique','est divisée par 2','La portance est proportionnelle au carré de la vitesse : 2² = 4.'],
['Un planeur de finesse 30 part de 1 000 m d’altitude en air calme. Il peut parcourir environ :','30 km','3 km','300 km','10 km','Finesse = distance / hauteur : 30 × 1 000 m = 30 km.'],
['Pour récupérer d’un décrochage, il faut avant tout :','diminuer l’incidence','tirer sur le manche','couper le moteur','sortir les aérofreins','On diminue l’incidence (manche vers l’avant) pour que l’écoulement se recolle, puis on remet de la puissance.']

C.push({id:'2-4', th:'t2', title:'Les quatre forces et les performances', min:16,
goals:['nommer les quatre forces et les conditions du vol en palier','expliquer la montée, la descente et le vol plané','comprendre l’effet de la masse et du centrage'],
body:`
<p>Un avion en vol subit toujours quatre forces. Tout ce que fait un pilote revient à les équilibrer ou à les déséquilibrer exprès.</p>
<h2>Les quatre forces</h2>
<div class="tw"><table><tr><th>Force</th><th>Origine</th><th>Direction</th></tr><tr><td><dfn>Poids</dfn> (P)</td><td>Gravité, appliquée au centre de gravité</td><td>Verticale, vers le bas</td></tr><tr><td><dfn>Portance</dfn> (Fz)</td><td>Aile</td><td>Perpendiculaire à la trajectoire, vers le haut</td></tr><tr><td><dfn>Traction</dfn> (T)</td><td>Hélice ou réacteur</td><td>Dans l’axe, vers l’avant</td></tr><tr><td><dfn>Traînée</dfn> (Fx)</td><td>Résistance de l’air</td><td>Parallèle à la trajectoire, vers l’arrière</td></tr></table></div>
<p>En <b>palier stabilisé</b> (vol horizontal à vitesse constante) : <b>portance = poids</b> et <b>traction = traînée</b>. Si les forces ne s’équilibrent pas, l’avion accélère, ralentit, monte ou descend.</p>
<div class="figslot" data-fig="forces"></div>
<div class="simslot" data-sim="flight"></div>
<div class="simslot" data-sim="forces"></div>
<h2>Montée, descente, plané</h2>
<ul><li><b>Montée</b> : la traction doit compenser la traînée <b>et</b> la part du poids qui retient l’avion. La vitesse de montée dépend de la <b>puissance en excès</b>, pas de l’assiette seule.</li><li><b>Descente moteur réduit</b> : une part du poids aide à avancer.</li><li><b>Vol plané</b> (planeur ou moteur coupé) : la traction est nulle ; la composante du poids selon la trajectoire équilibre la traînée. La pente de plané dépend de la finesse. La meilleure finesse donne la plus grande <b>distance</b>.</li></ul>
<div class="callout en-clair"><b>En clair</b>Un avion en panne de moteur est un planeur. C’est pourquoi on apprend à planer jusqu’à un champ : choisir la vitesse de meilleure finesse, puis un terrain.</div>
<h2>Masse et centrage</h2>
<ul><li>Plus l’avion est <b>lourd</b>, plus il faut de portance : la vitesse de décrochage augmente, le décollage est plus long, la montée plus lente.</li><li>Le <b>centre de gravité</b> doit rester dans des limites : trop avant, l’avion est lourd à cabrer ; trop arrière, il devient instable et difficile à redresser en cas de décrochage. D’où le calcul du devis de masse et centrage avant chaque vol.</li></ul>
<h2>Vitesses repères</h2>
<p><b>Vs</b> : vitesse de décrochage. <b>Vfe</b> : vitesse maximale volets sortis. <b>Vno</b> : limite de l’utilisation normale. <b>Vne</b> : vitesse à ne jamais dépasser. L’anémomètre les code en couleurs (arc blanc, arc vert, arc jaune, trait rouge).</p>
<h2>Facteur de charge</h2>
<p>Le <dfn>facteur de charge</dfn> n est le rapport portance / poids. Il vaut 1 en palier. Il augmente en virage, quand on redresse l’avion après un piqué (la « ressource ») et en turbulence, jusqu’à une limite de structure (par exemple +3,8 g pour un avion de catégorie normale).</p>
`,

traps:['Monter ne se fait pas seulement en tirant sur le manche : il faut de la puissance en excès.','Centre de gravité trop arrière : plus de maniabilité apparente mais risque d’instabilité.'],

['Quand la masse de l’avion augmente, la vitesse de décrochage :','augmente','diminue','reste identique','devient nulle','Plus de poids exige plus de portance : il faut voler plus vite ou à plus forte incidence.'],

C.push({id:'2-5', th:'t2', title:'Commandes, stabilité et virage', min:18,
goals:['relier chaque axe à sa gouverne et à sa commande','expliquer le virage, le facteur de charge et la vitesse de décrochage en virage','citer les éléments qui assurent la stabilité'],
body:`
<p>Un avion peut tourner autour de trois axes qui passent tous par son centre de gravité. Chaque axe a sa gouverne et sa commande.</p>
<h2>Trois axes, trois commandes</h2>
<div class="tw"><table><tr><th>Mouvement</th><th>Axe</th><th>Gouverne</th><th>Commande</th></tr><tr><td><dfn>Tangage</dfn> (nez haut / bas)</td><td>Transversal</td><td>Profondeur</td><td>Manche avant / arrière</td></tr><tr><td><dfn>Roulis</dfn> (inclinaison des ailes)</td><td>Longitudinal</td><td>Ailerons</td><td>Manche à gauche / droite</td></tr><tr><td><dfn>Lacet</dfn> (nez à gauche / droite)</td><td>Vertical</td><td>Direction</td><td>Palonnier (pédales)</td></tr></table></div>
<p>La manette des gaz commande la puissance. Le <b>compensateur</b> (trim) soulage la pression sur le manche pour garder l’assiette sans effort.</p>
<div class="figslot" data-fig="axes"></div>
<div class="simslot" data-sim="controls"></div>
<h2>Le virage</h2>
<p>Pour tourner, on <b>incline</b> les ailes. La portance, perpendiculaire aux ailes, se décompose en deux : une composante <b>verticale</b> qui soutient l’avion, et une composante <b>horizontale</b> qui le fait tourner. La composante verticale est plus petite que la portance totale : pour rester en palier il faut donc <b>augmenter la portance</b>, en tirant légèrement sur le manche.</p>
<div class="figslot" data-fig="bank"></div>
<p class="formule">n = 1 / cos(inclinaison)</p>
<ul><li>À 60° d’inclinaison, n = 2 : l’avion et ses occupants « pèsent » deux fois plus.</li><li>La vitesse de décrochage est multipliée par √n (la racine carrée de n) : à 60°, n = 2 et √2 ≈ 1,4, donc la vitesse de décrochage est 40 % plus élevée. On peut donc décrocher en virage serré à une vitesse où l’on volait très bien en palier.</li></ul>
<div class="simslot" data-sim="turn"></div>
<p>Un <b>virage coordonné</b> est un virage sans dérapage : la <b>bille</b> de l’indicateur de virage est au centre. On l’obtient en actionnant ensemble manche (roulis) et palonnier (lacet).</p>
<h2>Stabilité</h2>
<ul><li>L’<b>empennage horizontal</b> stabilise le tangage ; la <b>dérive</b> stabilise le lacet ; le dièdre des ailes (ailes légèrement relevées en V, comme un oiseau qui plane) stabilise le roulis.</li><li>Un <b>avion stable</b> revient de lui-même vers son équilibre après une perturbation.</li><li>Le <b>centre de gravité</b> bien placé est essentiel à la stabilité.</li></ul>
<h2>La vrille</h2>
<p>La vrille est un décrochage où une aile décroche plus que l’autre : l’avion tourne sur lui-même en descendant. En sortie : réduire les gaz, contrer la rotation au palonnier, manche vers l’avant pour diminuer l’incidence, puis redresser en douceur.</p>
`,
keep:['Tangage : profondeur / manche avant-arrière. Roulis : ailerons / manche latéral. Lacet : direction / palonnier.','Virage : on incline, la portance se décompose, il faut en augmenter la valeur.','Facteur de charge en virage n = 1/cos φ ; à 60°, n = 2.','Vitesse de décrochage en virage : Vs × √n.','Virage coordonné : bille centrée.'],
traps:['Le palonnier ne sert pas à tourner : il sert à coordonner le virage et à contrôler le lacet.','Le facteur de charge ne dépend pas de la vitesse, seulement de l’inclinaison en virage en palier.'],
qs:[

C.push({id:'3-1', th:'t3', title:'Familles d’aéronefs et structure d’un avion', min:15,
goals:['classer les aéronefs : aérostats et aérodynes','nommer les éléments d’un avion et leur rôle','calculer allongement et charge alaire'],
body:`
<h2>Les grandes familles</h2>
<p>Un <dfn>aéronef</dfn> est tout appareil qui peut s’élever et circuler dans l’air. On les classe d’après ce qui les soutient.</p>
<div class="figslot" data-fig="families"></div>
<div class="tw"><table><tr><th>Famille</th><th>Principe</th><th>Exemples</th></tr>
<tr><td><dfn>Aérostats</dfn> (plus légers que l’air)</td><td>Poussée d’Archimède</td><td>Ballons libres, dirigeables</td></tr>
<tr><td><dfn>Aérodynes</dfn> à voilure fixe</td><td>Portance d’une aile fixe grâce au mouvement dans l’air</td><td>Avions, planeurs, ULM multiaxes ou pendulaires</td></tr>
<tr><td><dfn>Aérodynes</dfn> à voilure tournante</td><td>Portance d’un rotor</td><td>Hélicoptères, autogires</td></tr>
<tr><td>Autres</td><td>Vol libre, sans pilote</td><td>Parapente, deltaplane, drones</td></tr></table></div>
<p>Les <b>engins spatiaux</b> (fusées, satellites, sondes) évoluent hors de l’atmosphère : on les étudie à part.</p>
<h2>L’avion : ses éléments</h2>
<p>Touche chaque partie de l’avion pour la découvrir.</p>
<div class="simslot" data-sim="plane"></div>
<ul><li>Le <b>fuselage</b> relie toutes les parties et accueille les occupants.</li><li>La <b>voilure</b> (les ailes) porte l’avion. Elle peut être haute, médiane ou basse, et contient souvent les réservoirs. On y trouve ailerons et volets.</li><li>L’<b>empennage</b> stabilise et dirige : plan fixe horizontal + gouverne de profondeur ; dérive + gouverne de direction. Il peut être en T, en croix, en V, ou remplacé par un plan canard à l’avant.</li><li>Le <b>train d’atterrissage</b> : classique (deux roues devant, une roulette de queue) ou tricycle (roue avant). Il peut être fixe ou rentrant.</li><li>Le <b>groupe motopropulseur</b> : moteur et hélice (ou réacteur).</li></ul>
<h2>Quelques mesures</h2>
<ul><li><dfn>Envergure</dfn> (b) : distance d’un bout d’aile à l’autre ; <dfn>surface alaire</dfn> (S).</li><li><dfn>Allongement</dfn> : λ = b² / S. Une aile longue et étroite (grand λ) produit moins de traînée induite : les planeurs ont de grands allongements.</li><li><dfn>Charge alaire</dfn> : masse / S, en kg/m².</li></ul>
<div class="callout exemple"><b>Exemple</b>Un planeur d’envergure 15 m et de surface 10,5 m² : λ = 15² / 10,5 ≈ 21,4.</div>
<h2>Matériaux et structure</h2>
<p>La structure moderne est le plus souvent <b>semi-monocoque</b> : un squelette (des cadres dans le fuselage, des nervures dans les ailes, reliés par de longues barres : lisses et longerons) recouvert d’une peau métallique qui supporte elle aussi une partie des efforts. C’est comme une canette : une coque fine mais solide, parce qu’elle est bien structurée. Les matériaux : bois et toile (avions anciens), <b>alliages d’aluminium</b> (duralumin), <b>matériaux composites</b> à base de fibres de carbone ou de verre (plus légers à résistance égale, très utilisés sur Airbus A350), titane pour les parties chaudes.</p>
<div class="figslot" data-fig="wingstruct"></div>
`,
