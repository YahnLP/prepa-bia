mount(root,x){
  root.innerHTML=x.r('T','Température au sol (T)',5,38,1,24,' °C')+x.r('Td','Point de rosée (Td)',-5,30,1,12,' °C')+x.r('g','Gradient de l’air environnant',3,10,0.1,6.5,' °C/km')+x.r('ex','Excès de chaleur de la bulle au sol',0,3,0.1,1.2,' °C')+
  '<svg viewBox="0 0 640 310" role="img" aria-label="Courbe de la bulle d’air et de l’air environnant"><g id="'+x.uid+'g"></g></svg><div class="readout"><div><small>Base des nuages</small><b id="'+x.uid+'b"></b></div><div><small>Sommet de la bulle</small><b id="'+x.uid+'s"></b></div></div><div class="verdict" id="'+x.uid+'v"></div>';
  const g=x.q('#'+x.uid+'g'); const X=T=>60+(T+45)/90*560, Y=z=>280-z/10000*260;
  function draw(){
    const T=x.v('T'), Td=Math.min(x.v('Td'),T), gam=x.v('g'), ex=x.v('ex');
    const spread=T-Td, zc=Math.round(125*spread/10)*10;
    const Tp=z=> z<=zc? T+ex-9.8*z/1000 : T+ex-9.8*zc/1000-5*(z-zc)/1000, Te=z=>T-gam*z/1000;
    let zeq=0; if(ex>0){ for(let z=50;z<=10000;z+=50){ if(Tp(z)<=Te(z)){ zeq=z; break;} zeq=z; } }
    let o='';
    for(let k=0;k<=10;k+=2) o+='<line x1="60" x2="620" y1="'+Y(k*1000)+'" y2="'+Y(k*1000)+'" stroke="var(--line)" stroke-width=".6"/><text x="54" y="'+(Y(k*1000)+4)+'" text-anchor="end" fill="var(--mute)" font-size="11">'+k+' km</text>';
    for(let t=-40;t<=40;t+=20) o+='<text x="'+X(t)+'" y="300" text-anchor="middle" fill="var(--mute)" font-size="11">'+t+' °C</text>';
    if(zeq>zc) o+='<rect x="'+(X(Tp(zeq))-6)+'" y="'+Y(zeq)+'" width="'+(X(Tp(zc))-X(Tp(zeq))+60)+'" height="'+(Y(zc)-Y(zeq))+'" rx="14" fill="var(--ink)" opacity=".13"/>';
    o+='<line x1="60" x2="620" y1="'+Y(zc)+'" y2="'+Y(zc)+'" stroke="var(--mute)" stroke-dasharray="4 4"/><text x="618" y="'+(Y(zc)-4)+'" text-anchor="end" fill="var(--mute)" font-size="11">base des nuages '+zc+' m</text>';

    for(let z=0;z<=Math.max(zeq,100);z+=50){ pp+=X(Tp(z))+','+Y(z)+' '; }

    else if(zeq<=zc){ msg='La bulle s’arrête avant de condenser : thermiques « secs », ciel bleu, pas de nuage. Les ascendances s’arrêtent vers '+Math.round(zeq/10)*10+' m.'; }

/* ---------- 1.6 Décodeur METAR ---------- */
const WX={'-':'faible ','+':'fort ','VC':'à proximité : ','MI':'mince ','BC':'en bancs ','PR':'partiel ','DR':'chasse-bas ','BL':'chasse-haut ','SH':'averse de ','TS':'orage avec ','FZ':'se congelant ','DZ':'bruine','RA':'pluie','SN':'neige','SG':'neige en grains','PL':'granules de glace','GR':'grêle','GS':'grésil','UP':'précipitation inconnue','BR':'brume (visibilité 1 à 5 km)','FG':'brouillard (visibilité < 1 km)','FU':'fumée','VA':'cendres volcaniques','DU':'poussière','SA':'sable','HZ':'brume sèche','SQ':'grain','FC':'tornade ou trombe','SS':'tempête de sable','DS':'tempête de poussière','PO':'tourbillons de poussière'};
function decodeMetar(m){
  const toks=m.trim().toUpperCase().split(/\s+/).filter(Boolean), out=[]; let st=false, trend=false;
  toks.forEach(t=>{ let d=null, mm;
    if(t==='METAR'||t==='SPECI') d=[t==='METAR'?'Type : observation régulière (toutes les 30 min ou 1 h).':'Type : observation spéciale, faite quand le temps change vite.'];
    else if(!st && /^[A-Z]{4}$/.test(t)){ st=true; d=['Aérodrome (code OACI à 4 lettres). « LF » = France.']; }
    else if((mm=t.match(/^(\d{2})(\d{2})(\d{2})Z$/))) d=['Jour '+mm[1]+' du mois, à '+mm[2]+'h'+mm[3]+' UTC (heure universelle).'];
    else if(t==='AUTO'||t==='COR'||t==='NIL') d=[t==='AUTO'?'Observation automatique, sans observateur.':t==='COR'?'Message corrigé.':'Pas de message.'];
    else if((mm=t.match(/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/))) d=[(mm[1]==='VRB'?'Vent de direction variable':'Vent venant de '+mm[1]+'° (vraie)')+', '+parseInt(mm[2],10)+' nœuds'+(mm[4]?', avec rafales à '+parseInt(mm[4],10)+' nœuds':'')+'.'];
    else if(/^\d{3}V\d{3}$/.test(t)) d=['Direction du vent variable entre '+t.slice(0,3)+'° et '+t.slice(4)+'°.'];
    else if(t==='CAVOK') d=['CAVOK : visibilité ≥ 10 km, aucun nuage sous 5 000 ft ni cumulonimbus, aucun phénomène significatif.'];
    else if(/^\d{4}$/.test(t)&&!trend||/^\d{4}$/.test(t)) d=[t==='9999'?'Visibilité de 10 km ou plus.':'Visibilité de '+(parseInt(t,10)>=1000?(parseInt(t,10)/1000).toFixed(1).replace('.',',')+' km':parseInt(t,10)+' m')+'.'];
    else if((mm=t.match(/^(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?$/))){ const o={FEW:'1 à 2 octas (peu)',SCT:'3 à 4 octas (épars)',BKN:'5 à 7 octas (fragmenté : c’est un plafond)',OVC:'8 octas (couvert : c’est un plafond)'}; d=['Nuages : '+o[mm[1]]+', base à '+(parseInt(mm[2],10)*100)+' ft au-dessus de l’aérodrome'+(mm[3]==='CB'?', cumulonimbus !':mm[3]==='TCU'?', gros cumulus bourgeonnants (TCU).':'.')]; }
    else if(/^(NSC|NCD|SKC)$/.test(t)) d=['Pas de nuage significatif.'];
    else if((mm=t.match(/^VV(\d{3})$/))) d=['Ciel invisible (brouillard) : visibilité verticale '+(parseInt(mm[1],10)*100)+' ft.'];
    else if((mm=t.match(/^(M?\d{2})\/(M?\d{2})$/))){ const c=s=>parseInt(s.replace('M','-'),10); d=['Température '+c(mm[1])+' °C, point de rosée '+c(mm[2])+' °C. Écart T − Td : '+(c(mm[1])-c(mm[2]))+' °C'+(c(mm[1])-c(mm[2])<=3?' (faible : risque de brume, brouillard ou nuages bas).':'.')]; }
    else if((mm=t.match(/^Q(\d{4})$/))) d=['QNH '+parseInt(mm[1],10)+' hPa : calage de l’altimètre pour lire l’altitude.'];
    else if((mm=t.match(/^A(\d{4})$/))) d=['Calage en pouces de mercure : '+(parseInt(mm[1],10)/100).toFixed(2)+' inHg.'];
    else if(t==='NOSIG') d=['Pas de changement significatif prévu dans les 2 heures.'];
    else if(t==='BECMG'){ trend=true; d=['Évolution durable prévue (« becoming »).']; }
    else if(t==='TEMPO'){ trend=true; d=['Variation temporaire prévue.']; }
    else if(/^R\d\d[LRC]?\//.test(t)) d=['Portée visuelle de piste (RVR).'];
    else { const w=t.match(/^(RE)?(\+|-|VC)?((?:MI|BC|PR|DR|BL|SH|TS|FZ)*)((?:DZ|RA|SN|SG|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|SQ|FC|SS|DS|PO)+)$/);
      if(w){ let s=''; if(w[1]) s+='Récent : '; if(w[2]) s+=WX[w[2]]; (w[3].match(/../g)||[]).forEach(c=>s+=WX[c]+' '); (w[4].match(/../g)||[]).forEach((c,i)=>s+=(i?' et ':'')+WX[c]); d=['Temps présent : '+s+'.']; } }
    out.push({t, d:d?d[0]:'Groupe non reconnu ici : il peut s’agir d’une information locale.'});
  });
  return out;
}
function vfrJudge(m){
  const toks=m.toUpperCase().split(/\s+/); let vis=9999, ceil=99999, wind=0, cav=false, stop=false;
  toks.forEach(t=>{ let mm; if(t==='BECMG'||t==='TEMPO'||t==='NOSIG') stop=true; if(stop) return; if(t==='CAVOK') cav=true; else if(/^\d{4}$/.test(t)&&t.length===4&&vis===9999) vis=parseInt(t,10);
    if((mm=t.match(/^(BKN|OVC)(\d{3})/))) ceil=Math.min(ceil,parseInt(mm[2],10)*100); if((mm=t.match(/^VV(\d{3})/))) ceil=Math.min(ceil,parseInt(mm[1],10)*100);
    if((mm=t.match(/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/))) wind=Math.max(wind,parseInt(mm[4]||mm[2],10)); });
  if(cav){ vis=9999; ceil=99999; }
  const tsb=/TS|FG|\+RA/.test(m);
  if(vis<1500||ceil<500) return ['bad','Très mauvaises conditions : le vol à vue est impossible ou très dangereux.'];
  if(vis>=5000&&ceil>=1500&&!tsb&&wind<=25) return ['ok','Conditions plutôt favorables au vol à vue (VMC). À confirmer avec le reste de ta préparation.'];
  return ['warn','Conditions limites : visibilité, plafond, vent ou orage demandent beaucoup de prudence.'];
}

/* ---------- 2.5 Virage et facteur de charge ---------- */
S.turn={title:'Virage et facteur de charge', th:'t2', ch:'2-5',
desc:'Incline l’avion en virage en palier : la portance doit augmenter, le facteur de charge aussi.',
try:['Passe à 60° d’inclinaison : le facteur de charge vaut 2 et la vitesse de décrochage est multipliée par 1,4.','Observe le rayon : à vitesse égale, plus on incline, plus le virage est serré.','Dépasse 70° : le facteur de charge devient dangereux.'],
mount(root,x){
  root.innerHTML=x.r('p','Inclinaison',0,75,1,30,'°')+x.r('v','Vitesse propre',60,160,5,100,' kt')+
  '<svg viewBox="0 0 640 280" id="'+x.uid+'s" role="img" aria-label="Avion vu de derrière en virage avec les forces"></svg><div class="readout"><div><small>Facteur de charge</small><b id="'+x.uid+'n"></b></div><div><small>Décrochage (55 kt en palier)</small><b id="'+x.uid+'vs"></b></div><div><small>Rayon</small><b id="'+x.uid+'r"></b></div><div><small>Taux de virage</small><b id="'+x.uid+'tx"></b></div></div><div class="verdict" id="'+x.uid+'t"></div>';
  const sv=x.q('#'+x.uid+'s');
  function draw(){
    const p=x.v('p'), V=x.v('v'), n=1/Math.cos(rad(p)), vs=55*Math.sqrt(n), ms=V*0.5144, R=p?ms*ms/(9.81*Math.tan(rad(p))):Infinity, tx=p?(9.81*Math.tan(rad(p))/ms)*180/Math.PI:0;
    const sc=44, L=sc*n, cx=320, cy=150;
    let o='<rect width="640" height="280" fill="var(--sky)" opacity=".4"/><g transform="translate('+cx+' '+cy+') rotate('+p+')"><circle r="18" fill="var(--ink)"/><line x1="-170" y1="0" x2="170" y2="0" stroke="var(--ink)" stroke-width="8"/></g>';
    const ex=cx+L*Math.sin(rad(p))*(-1)*(-1), ey=cy-L*Math.cos(rad(p));
    o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy+sc)+'" stroke="var(--ink)" stroke-width="5"/><polygon points="'+(cx-8)+','+(cy+sc)+' '+(cx+8)+','+(cy+sc)+' '+cx+','+(cy+sc+14)+'" fill="var(--ink)"/><text x="'+(cx+12)+'" y="'+(cy+sc+10)+'" font-size="13" font-weight="700">Poids</text>';
    o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+L*Math.sin(rad(p)))+'" y2="'+(cy-L*Math.cos(rad(p)))+'" stroke="var(--ok)" stroke-width="5"/><text x="'+(cx+L*Math.sin(rad(p))+10)+'" y="'+(cy-L*Math.cos(rad(p)))+'" font-size="13" font-weight="700" fill="var(--ok)">Portance</text>';
    o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-sc)+'" stroke="var(--c1)" stroke-width="3" stroke-dasharray="5 4"/><text x="'+(cx-8)+'" y="'+(cy-sc/2)+'" text-anchor="end" font-size="12" fill="var(--c1)">composante verticale = poids</text>';
    if(p>1) o+='<line x1="'+cx+'" y1="'+(cy-sc)+'" x2="'+(cx+L*Math.sin(rad(p)))+'" y2="'+(cy-sc)+'" stroke="var(--acc)" stroke-width="3" stroke-dasharray="5 4"/><text x="'+(cx+L*Math.sin(rad(p))/2)+'" y="'+(cy-sc-8)+'" text-anchor="middle" font-size="12" fill="var(--acc)">composante horizontale : elle courbe la trajectoire</text>';
    sv.innerHTML=o;
    x.q('#'+x.uid+'n').textContent=f1(n,2)+' g'; x.q('#'+x.uid+'vs').textContent=Math.round(vs)+' kt'; x.q('#'+x.uid+'r').textContent=p?Math.round(R)+' m':'—'; x.q('#'+x.uid+'tx').textContent=p?f1(tx)+' °/s':'—';
    const t=x.q('#'+x.uid+'t');
    if(V<vs){ t.className='verdict bad'; t.textContent='Danger : à '+V+' kt, ta vitesse est inférieure à la vitesse de décrochage dans ce virage ('+Math.round(vs)+' kt). L’avion décrocherait.'; }
    else if(p>=60){ t.className='verdict warn'; t.textContent='Virage très incliné : facteur de charge de '+f1(n,1)+' g. Tu et la structure supportez un poids apparent de '+f1(n,1)+' fois le poids normal.'; }
    else { t.className='verdict ok'; t.textContent='Pour rester en palier, la portance doit valoir '+f1(n,2)+' fois le poids. Plus on incline, plus il faut incidence ou puissance.'; }
  }
  x.bind(draw);
}};
})();

/* ---------- 3.3 Tableau de bord ---------- */
function polar(cx,cy,r,a){ return [cx+r*Math.sin(rad(a)), cy-r*Math.cos(rad(a))]; }
function arcPath(cx,cy,r,a1,a2){ const p1=polar(cx,cy,r,a1), p2=polar(cx,cy,r,a2); return 'M'+p1[0]+' '+p1[1]+' A'+r+' '+r+' 0 '+((a2-a1)>180?1:0)+' 1 '+p2[0]+' '+p2[1]; }
S.panel={title:'Anémomètre et horizon artificiel', th:'t3', ch:'3-3',
desc:'Lis les deux instruments les plus utilisés en vol : la vitesse et l’attitude de l’avion.',
try:['Place la vitesse sur l’arc blanc : les volets sont autorisés. Sur le trait rouge : vitesse à ne jamais dépasser.','Monte le tangage : l’horizon descend dans le cadran. Incline à droite : l’horizon bascule à gauche.','Lance le défi et lis l’horizon avant de répondre.'],
mount(root,x){

  '<div class="sep"></div><div class="row"><button type="button" class="btn sec sm" id="'+x.uid+'g">Défi : lis l’horizon</button></div><div id="'+x.uid+'ch"></div>';

    const r1=polar(100,100,80,kv(163)), r2=polar(100,100,94,kv(163)); o+='<line x1="'+r1[0]+'" y1="'+r1[1]+'" x2="'+r2[0]+'" y2="'+r2[1]+'" stroke="#e5483b" stroke-width="5"/>';
    for(let s=0;s<=200;s+=20){ const p1=polar(100,100,70,kv(s)), p2=polar(100,100,62,kv(s)), t=polar(100,100,50,kv(s)); o+='<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="#fff" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle" font-size="11" fill="#fff">'+s+'</text>'; }
    const n=polar(100,100,76,kv(v)); o+='<line x1="100" y1="100" x2="'+n[0]+'" y2="'+n[1]+'" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="6" fill="#fff"/><text x="100" y="140" text-anchor="middle" font-size="10" fill="#bbb">KT</text>';

    else if(v<=85){ m='Arc blanc : plage où les volets peuvent être sortis (jusqu’à VFE).'; c='ok'; }
    else if(v<=129){ m='Arc vert : plage normale d’utilisation, de la vitesse de décrochage lisse à VNO.'; c='ok'; }

    const opts=[[P,R]]; while(opts.length<4){ const p=[-15,0,15][Math.floor(Math.random()*3)], r=[-35,0,35][Math.floor(Math.random()*3)]; if(!opts.some(o=>o[0]===p&&o[1]===r)) opts.push([p,r]); }
    const sh=window.BIA.shuffle(opts); x.setv('p',P); x.setv('r',R); asi(); hor();
    ch.innerHTML='<p class="q-stem" style="margin-top:10px">Que fait l’avion ?</p><div class="opts">'+sh.map((o,i)=>'<button type="button" class="opt" data-ok="'+(o[0]===P&&o[1]===R?1:0)+'"><span class="l">'+'ABCD'[i]+'</span><span>'+lab(o[0],o[1])+'</span></button>').join('')+'</div><div id="'+x.uid+'cr"></div>';
    ch.onclick=e=>{ const b=e.target.closest('.opt'); if(!b) return; x.qa('#'+x.uid+'ch .opt').forEach(o=>{ o.disabled=true; if(o.dataset.ok==='1') o.classList.add('good'); }); if(b.dataset.ok!=='1') b.classList.add('bad'); x.q('#'+x.uid+'cr').innerHTML='<div class="expl '+(b.dataset.ok==='1'?'ok':'ko')+'">'+(b.dataset.ok==='1'?'Bien lu.':'Regarde bien :')+' Le réticule jaune est l’avion ; l’horizon bascule du côté opposé à l’inclinaison, et descend quand le nez monte.</div>'; };

S.nav={title:'Triangle des vitesses', th:'t4', ch:'4-2',
desc:'Règle ta route et le vent : trouve le cap à afficher, la dérive et la vitesse sol.',
try:['Route 360°, vent d’ouest (270°) : le cap passe à gauche de la route.','Mets le vent dans l’axe de la route : plus de dérive, mais la vitesse sol change.','Augmente le vent à 40 kt avec une vitesse propre faible : la correction devient énorme.'],

  '<svg viewBox="0 0 400 400" id="'+x.uid+'s" role="img" aria-label="Rose des caps et triangle des vitesses" style="max-width:460px;margin:0 auto"></svg><div class="readout"><div><small>Cap à afficher</small><b id="'+x.uid+'cap"></b></div><div><small>Correction de dérive</small><b id="'+x.uid+'dr"></b></div><div><small>Vitesse sol</small><b id="'+x.uid+'gs"></b></div><div><small>Durée du trajet</small><b id="'+x.uid+'t"></b></div></div><div class="verdict" id="'+x.uid+'v"></div>';
  const sv=x.q('#'+x.uid+'s'), sc=0.7, cx=200, cy=200;

  function draw(){
    let Rv=x.v('rv'); if(Rv===0) Rv=360; const tas=x.v('tas'), wd=x.v('wd'), W=x.v('wf'), D=x.v('d');
    const dl=rad(wd-Rv), ws=W*Math.sin(dl), wh=W*Math.cos(dl);

    if(Math.abs(ws)>tas){ sv.innerHTML=o+'<text x="200" y="205" text-anchor="middle" fill="var(--bad)" font-size="16" font-weight="700">Vent trop fort pour tenir cette route</text>'; ['cap','dr','gs','t'].forEach(i=>x.q('#'+x.uid+i).textContent='—'); const v=x.q('#'+x.uid+'v'); v.className='verdict bad'; v.textContent='Le vent traversier ('+Math.round(Math.abs(ws))+' kt) dépasse ta vitesse propre : impossible de tenir la route. Il faut une vitesse plus grande ou un autre trajet.'; return; }
    const wca=Math.asin(ws/tas)*180/Math.PI, hd=((Rv+wca)%360+360)%360, gs=tas*Math.cos(rad(wca))-wh;
    const A=vec(hd,tas*sc), wv=vec(wd+180,W*sc), B=[A[0]+wv[0],A[1]+wv[1]];

    const ar=(x1,y1,x2,y2,c,w)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"/>';

    const tip=(px,py,ang,c)=>'<polygon points="0,-8 14,0 0,8" fill="'+c+'" transform="translate('+px+' '+py+') rotate('+(ang-90)+')"/>';
    o+=tip(cx+A[0],cy+A[1],hd,'var(--acc)')+tip(cx+B[0],cy+B[1],wd+180,'var(--c1)')+tip(cx+B[0]*0.98,cy+B[1]*0.98,Rv,'var(--ok)');
    o+='<circle cx="200" cy="200" r="5" fill="var(--ink)"/>';
    o+='<g font-size="13" font-weight="700"><text x="12" y="22" fill="var(--acc)">Cap + vitesse propre</text><text x="12" y="40" fill="var(--c1)">Vent (vers où il souffle)</text><text x="12" y="58" fill="var(--ok)">Route + vitesse sol</text></g>';
    sv.innerHTML=o;
    x.q('#'+x.uid+'cap').textContent=pad3(hd===0?360:hd)+'°'; x.q('#'+x.uid+'dr').textContent=f1(Math.abs(wca),0)+'° '+(wca>0.5?'à droite':wca<-0.5?'à gauche':'(aucune)'); x.q('#'+x.uid+'gs').textContent=Math.round(gs)+' kt';
    const mins=D/gs*60; x.q('#'+x.uid+'t').textContent=Math.floor(mins/60)+' h '+String(Math.round(mins%60)).padStart(2,'0')+' min';
    const v=x.q('#'+x.uid+'v'); v.className='verdict ok';
    v.textContent=(Math.abs(wh)<1?'Pas de vent de face ni arrière. ':wh>0?'Vent de face de '+Math.round(wh)+' kt : tu perds '+Math.round(tas-gs)+' kt par rapport à ta vitesse propre. ':'Vent arrière de '+Math.round(-wh)+' kt : vitesse sol supérieure à la vitesse propre. ')+(Math.abs(ws)<1?'Pas de vent traversier.':'Vent traversier de '+Math.round(Math.abs(ws))+' kt venant de '+(ws>0?'droite':'gauche')+' : tu dois afficher un cap tourné vers le vent.');
  }
  x.bind(draw);

  let rw='27', cur=0, raf=null; const sv=x.q('#'+x.uid+'s'), tb=x.q('#'+x.uid+'t');

    if(!s.ground){ g.setLineDash([5,5]); g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(px+84,py+2); g.lineTo(px+84+80*Math.cos(-s.gam),py+2+80*Math.sin(-s.gam)); g.stroke(); g.setLineDash([]); g.strokeStyle='rgba(255,230,120,.95)'; g.lineWidth=2; g.beginPath(); g.arc(px+84,py+2,40,-s.gam-.0,-s.gam+(s.gam-s.th)*-1+0.0001,s.gam>s.th); g.stroke(); text(g,'incidence '+s.aoa.toFixed(0)+'°',px+130,py+36,{s:12,w:'700',c:'#ffe27a',sh:1}); text(g,'trajectoire',px+84+82*Math.cos(-s.gam),py+2+82*Math.sin(-s.gam)+4,{s:10,w:'500',sh:1}); }

  }

  const M={

   m1:{t:'Décollage',steps:[
     ['Mets la puissance à fond (100 %).',s=>x.v('thr')>=95,s=>'Monte le curseur Puissance à 100 %.'],
     ['Accélère dans l’axe de la piste jusqu’à 55 kt (vitesse de rotation).',s=>s.V*KT>=55,s=>'Vitesse '+Math.round(s.V*KT)+' kt. Reste dans l’axe avec ← →.'],

  function coachHTML(){ const m=M[mission]; if(!m.steps.length) return '<b>Vol libre.</b> Pilote comme tu veux. Observe comment les instruments réagissent à tes commandes.'; const done=ms.i>=m.steps.length; let h='<div class="ct">Leçon : '+m.t+'</div><ol>'; m.steps.forEach((st,i)=>{ h+='<li class="'+(i<ms.i?'ok':i===ms.i?'cur':'')+'">'+st[0]+'</li>'; }); h+='</ol>'; if(done&&!s.over) h+='<div class="bravo">✔ Leçon réussie !</div>'; else if(m.steps[ms.i]) h+='<div class="hint">💡 '+m.steps[ms.i][2](s)+'</div>'; return h; }

    const kt=s.V*KT, fpm=s.vs*FT*60; gASI(gi,80,86,66,kt); gATT(gi,240,86,66,s.th,s.ph); gALT(gi,400,86,66,s.h*FT); gTURN(gi,80,252,66,s.psiRate||0,s.ball||0); gHDG(gi,240,252,66,((s.psi*R2D)%360+360)%360); gVSI(gi,400,252,66,fpm);
    [['Anémomètre',80,0],['Horizon artificiel',240,0],['Altimètre',400,0],['Virage et bille',80,1],['Conservateur de cap',240,1],['Variomètre',400,1]].forEach(l=>text(gi,l[0],l[1],l[2]?330:164,{s:11,w:'600',a:'center',c:'#9db0c4'})); };

    let kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0), ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0); if(kx||ky){ stick.hx=kx*.6; stick.hy=ky*.45; }
    const dead=v=>Math.abs(v)<.05?0:v;
    const inp={aile:dead(stick.hx),pull:dead(stick.hy),thr:x.v('thr')/100,trim:x.v('trim'),brake};
    if(!paused){ const n=Math.ceil(dt0/.008); for(let i=0;i<n;i++) FM.step(s,inp,dt0/n); missionUpdate(dt0); }
    prop+=dt0;
    if(!fs){ return; }
    if(view==='cock') render3D(t); else renderExt(t);
    // alerte
    if(s.aoa>FM.acrit(s.fl)-2.5&&!s.ground&&!s.stalled&&Math.floor(t*6)%2===0) text(g,'AVERTISSEUR DE DÉCROCHAGE',W/2,38,{s:16,w:'800',a:'center',c:'#ffd23f',sh:1});
    if(s.stalled&&view==='cock'&&Math.floor(t*4)%2===0) text(g,'DÉCROCHAGE',W/2,70,{s:30,w:'800',a:'center',c:'#ff5a4d',sh:1});
    if(s.msg){ g.fillStyle='rgba(8,16,28,.7)'; g.fillRect(W/2-210,H-110,420,56); text(g,s.msg[0]==='ok'?'✔':'✖ '+(s.msg[1].length>60?s.msg[1].slice(0,58)+'…':s.msg[1]),W/2,H-76,{s:14,w:'700',a:'center',c:'#ff8a7d'}); }

      x.q('#'+u+'ro').innerHTML='<div><small>Vitesse air</small><b>'+Math.round(kt)+' kt</b></div><div><small>Altitude</small><b>'+Math.round(s.h*FT)+' ft</b></div><div><small>Variomètre</small><b>'+(fpm>=0?'+':'')+fpm+' ft/min</b></div><div><small>Cap</small><b>'+String(hd).padStart(3,'0')+'°</b></div><div><small>Charge</small><b>'+(s.ground?1:s.nz).toFixed(2).replace('.',',')+' G</b></div><div><small>Incidence</small><b>'+s.aoa.toFixed(0)+'° / '+FM.acrit(s.fl)+'°</b></div><div><small>Vs (décroch.)</small><b>'+Math.round(FM.vstall(s.h,s.fl,Math.max(1,s.ground?1:s.nz)))+' kt</b></div>'+(windMode?'<div><small>Vent</small><b>'+(windMode===1?'de face 12 kt':'de travers 12 kt')+'</b></div>':'');
      x.q('#'+u+'co').innerHTML=coachHTML();
      { const m=M[mission], st=m.steps[ms.i]; const hn=x.q('#'+u+'hn'); hn.innerHTML=st?'<b>'+(ms.i+1)+'/'+m.steps.length+'</b> '+st[0]+'<br><span>💡 '+st[2](s)+'</span>':(m.steps.length?'✔ Leçon réussie !':'Vol libre'); hn.style.display=fs?'':'none'; }
      let c='',m=''; if(s.msg){ c=s.msg[0]; m=s.msg[1]; } else if(s.td&&s.ground&&s.td.vs!==undefined&&!tdShown){ tdShown=true; }
      if(!s.msg&&s.ground&&s.td){ const q=s.td; c=q.vs<350&&q.onRw?'ok':q.vs<700?'warn':'bad'; m='Atterrissage : taux de chute '+q.vs+' ft/min à '+q.kt+' kt'+(q.onRw?'':' (hors de la piste)')+'. '+(q.vs<350?'Très doux : bel arrondi !':q.vs<700?'Correct, mais un arrondi plus tardif et plus doux serait mieux.':'Dur : tire plus au moment de l’arrondi.'); }
      if(!m){ if(s.ground){ m=s.V<1?'Au sol, à l’arrêt. Mets les gaz à 100 % puis, vers 55 kt, tire doucement le manche.':'Roulage : '+Math.round(kt)+' kt. Rotation à 55 kt.'; } else if(s.stalled){ c='bad'; m='Décrochage : l’air ne suit plus l’aile (incidence > '+FM.acrit(s.fl)+'°). Pousse le manche pour réduire l’incidence, puis remets de la puissance.'; } else if(kt<FM.vstall(s.h,s.fl,Math.max(1,s.nz))+6){ c='warn'; m='Vitesse proche du décrochage. Baisse le nez et/ou ajoute de la puissance.'; } else if(fpm>300){ c='ok'; m='Tu montes ('+fpm+' ft/min).'; } else if(fpm<-300){ c='warn'; m='Tu descends ('+(-fpm)+' ft/min).'; } else { c='ok'; m='Vol en palier : la portance équilibre le poids, la traction équilibre la traînée.'; } }
      const vd=x.q('#'+u+'vd'); if(vd._m!==m||vd._c!==c){ vd.className='verdict '+c; vd.textContent=m; vd._m=m; vd._c=c; } }
  });

(function(){
window.BIA.intros={
'1-1':'Imagine l’atmosphère comme une couverture d’air autour de la Terre. Plus tu montes, moins elle est épaisse : il y a moins d’air, il fait plus froid et la pression baisse. Les avions volent tout en bas de cette couverture, dans la couche où se fait la météo.',
'1-2':'L’air est comme une foule qui va des endroits serrés (haute pression) vers les endroits vides (basse pression). Cette « marche » de l’air, c’est le vent. Comme la Terre tourne, le vent ne va pas tout droit : il tourne autour des centres de pression.',
'1-3':'Un nuage, c’est de l’air chaud et humide qui monte, se refroidit, et dont la vapeur d’eau devient de minuscules gouttes. Selon que l’air continue de monter ou retombe, on obtient de gros nuages d’orage ou de simples couches grises.',
'1-4':'Une masse d’air est une grande « bulle » d’air qui a les mêmes caractéristiques (chaude ou froide, humide ou sèche). Quand deux masses se rencontrent, la limite entre elles s’appelle un front : c’est là que se forment les nuages et la pluie.',
'1-5':'Certains phénomènes météo sont dangereux pour les avions : orages, givre, turbulence, brouillard, vent fort. L’idée de ce chapitre : savoir les reconnaître pour les éviter, car un pilote prudent ne cherche jamais à les traverser.',
'1-6':'Avant de voler, le pilote lit la météo de l’aérodrome comme on lit un SMS codé. Le METAR dit le temps qu’il fait maintenant, le TAF dit ce qui est prévu. Chaque groupe de lettres et de chiffres a un sens précis.',
'2-1':'Un ballon monte parce qu’il est plus léger que l’air qu’il remplace, comme un bouchon qui remonte dans l’eau. Pour monter, on chauffe l’air du ballon : l’air chaud est plus léger que l’air froid.',
'2-2':'Quand l’air accélère, sa pression baisse. C’est le principe de Bernoulli, la clé de la portance. Pense à un tuyau qui se rétrécit : l’eau y va plus vite, et la pression sur les parois diminue.',
'2-3':'L’aile est une pièce inclinée qui dévie l’air vers le bas. En réaction, l’air la pousse vers le haut : c’est la portance. Mais si on l’incline trop, l’air décroche et la portance disparaît d’un coup : c’est le décrochage.',
'2-4':'Quatre forces agissent sur l’avion : la portance le soutient, le poids le tire vers le bas, la traction l’avance, la traînée le freine. En vol stable, elles s’équilibrent deux à deux.',
'2-5':'Un avion tourne autour de trois axes, et le pilote a une commande pour chacun : manche pour monter ou descendre le nez et incliner l’avion, pédales pour tourner le nez à gauche ou à droite. Pour tourner, on incline l’avion, car la portance inclinée tire l’avion vers l’intérieur du virage.',
'3-1':'Un aéronef est tout ce qui vole : un ballon, un avion, un hélicoptère, une fusée. On les classe selon qu’ils sont plus légers ou plus lourds que l’air. Un avion se compose de quelques éléments simples : fuselage, ailes, empennage, train d’atterrissage, groupe motopropulseur.',
'3-2':'Un moteur transforme l’énergie du carburant en poussée. Le moteur à pistons fonctionne comme un petit moulin à quatre temps. Le réacteur aspire l’air, le comprime, le brûle et l’éjecte vers l’arrière : par réaction, l’avion avance. La fusée, elle, emporte aussi son oxygène.',
'3-3':'Le tableau de bord, c’est les yeux du pilote quand il ne voit pas dehors. Certains instruments mesurent la pression de l’air (vitesse, altitude, montée), d’autres utilisent un gyroscope (horizon, cap). Savoir ce qu’ils disent, c’est savoir où l’on est et comment on vole.',
'3-4':'Hélicoptère, planeur, ULM et drone volent tous, mais pas de la même façon. L’hélicoptère a une aile qui tourne. Le planeur n’a pas de moteur : il glisse dans l’air et cherche les courants ascendants. Le drone n’a personne à bord.',
'3-5':'Une fusée avance en éjectant des gaz vers l’arrière, comme un ballon de baudruche qui se vide. Pour rester en orbite, un satellite doit aller assez vite pour « tomber » autour de la Terre sans jamais la toucher.',
'4-1':'Pour dire où l’on est, on utilise un quadrillage imaginaire autour de la Terre : latitude et longitude. En aviation, les distances se mesurent en milles nautiques, les vitesses en nœuds, les hauteurs en pieds : ce sont les unités du pilote.',
'4-2':'Naviguer à l’estime, c’est calculer où l’on sera à partir du cap, de la vitesse et du temps. Le vent pousse l’avion de côté : le pilote corrige son cap pour rester sur sa route. Un petit triangle de vitesses suffit pour le trouver.',
'4-3':'Aujourd’hui, on se repère aussi avec des balises radio (VOR) et par satellite (GPS). Ces systèmes donnent la position avec précision, mais le pilote doit toujours savoir vérifier avec sa carte et ses repères.',
'4-4':'L’altimètre mesure en réalité la pression de l’air, puis la convertit en hauteur. On peut le régler de trois façons selon ce qu’on veut savoir : la hauteur au-dessus du terrain, l’altitude au-dessus de la mer, ou le niveau de vol (en croisière, tous les avions utilisent le même réglage).',
'4-5':'Dans le ciel comme sur la route, il y a des règles : qui est prioritaire, à quelle hauteur voler, où on doit demander une autorisation. L’espace aérien est découpé en volumes, certains contrôlés et d’autres libres.',
'4-6':'L’aérodrome est organisé pour que tous les avions suivent le même parcours : le circuit. On décolle et on atterrit face au vent. Le numéro de la piste donne son orientation, et le PAPI (quatre lampes) indique si l’on est trop haut ou trop bas.',
'4-7':'La radio sert à parler aux contrôleurs avec des phrases courtes et codées pour être sûr d’être compris. Quand ça va mal (panne moteur, détresse), il y a une méthode : aviser, naviguer, communiquer. Et rappelle-toi que la plupart des accidents viennent d’une chaîne d’erreurs humaines, pas d’une seule.',
'5-1':'L’histoire de l’aviation commence avec des ballons en 1783, passe par les planeurs, puis les frères Wright réussissent en 1903 le premier vol motorisé et contrôlé. En dix ans, l’avion passe d’un bond de quelques secondes à la traversée de la Manche.',
'5-2':'La Première Guerre mondiale fait progresser les avions à toute vitesse. Dans les années 1920-1930, des pionniers (et pionnières) battent des records et ouvrent les premières lignes aériennes, notamment pour le courrier.',
'5-3':'Le moteur à réaction change tout : les avions volent plus vite, plus haut et plus loin. Les avions de ligne se généralisent, avec Concorde comme symbole, puis Airbus qui montre la force de la coopération européenne.',
'5-4':'À partir de 1957, c’est la course à l’espace entre les États-Unis et l’URSS : premier satellite (Spoutnik), premier homme dans l’espace (Gagarine), premiers pas sur la Lune (Apollo 11, 1969). Retiens surtout ces grandes dates.',
'5-5':'Aujourd’hui, l’espace sert à tous : télécommunications, météo, navigation, observation. On y vit en permanence à bord de l’ISS, on explore Mars avec des robots, et l’aviation cherche à polluer moins.',
'6-1':'En radio, on épelle les lettres avec un alphabet international (Alpha, Bravo, Charlie…) pour ne jamais confondre un B avec un D. Les chiffres se disent aussi de façon spéciale. C’est la base de l’anglais aéronautique.',
'6-2':'Un vocabulaire de base en anglais suffit pour comprendre l’essentiel : les parties de l’avion, la météo, les phases de vol. Apprends-le par petits paquets avec les cartes à retourner.',
'6-3':'Les messages radio suivent des phrases toutes faites. Les connaître par cœur, c’est comprendre le contrôleur même si l’on n’a pas tout compris. Et on répète toujours les instructions importantes.'
};
})();

B.vocab={
'1-1':[['Densité','La quantité d’air dans un volume donné. Air dense = beaucoup de molécules serrées.'],['hPa (hectopascal)','L’unité de la pression de l’air. Au niveau de la mer : environ 1 013 hPa.'],['ISA','Une atmosphère « type » inventée pour que tout le monde compare les avions dans les mêmes conditions.'],['Troposphère','La couche d’air la plus basse, où l’on trouve les nuages et où volent la plupart des avions.'],['Pied (ft)','Unité de hauteur en aviation : 1 ft = 30 cm.']],
'1-2':[['Isobare','Une ligne tracée sur une carte entre tous les endroits où la pression est la même.'],['Anticyclone','Zone de haute pression : l’air descend, le temps est le plus souvent beau.'],['Dépression','Zone de basse pression : l’air monte, on trouve des nuages et du vent.'],['Gradient de pression','La différence de pression entre deux endroits : c’est elle qui « pousse » l’air.'],['Nœud (kt)','Unité de vitesse en aviation : environ 1,85 km/h.'],['Rafale','Un coup de vent bref et plus fort que le vent habituel.']],
'1-3':[['Vapeur d’eau','L’eau sous forme de gaz, invisible. Elle devient visible (gouttelettes) quand elle se condense.'],['Condensation','Quand la vapeur d’eau redevient liquide : c’est ce qui forme les nuages et la buée.'],['Point de rosée','La température à laquelle l’air est saturé : en dessous, la vapeur se condense.'],['Stable / instable','Air stable : une bulle d’air qui monte redescend. Air instable : elle continue de monter.'],['Inversion','Couche où il fait plus chaud en haut qu’en bas, qui bloque la montée de l’air.'],['Octa','Un huitième du ciel. 4 octas = la moitié du ciel couverte.'],['Plafond','La hauteur de la base des nuages qui couvrent au moins la moitié du ciel.']],
'1-4':[['Masse d’air','Un énorme volume d’air qui a partout à peu près la même température et la même humidité.'],['Front','La frontière entre une masse d’air chaud et une masse d’air froid.'],['Perturbation','Un ensemble de fronts et de nuages qui apportent de la pluie et du vent.'],['Secteur chaud','L’air doux situé entre le front chaud et le front froid.'],['Traîne','Le ciel changeant, avec des averses, derrière le front froid.'],['Occlusion','Quand le front froid rattrape le front chaud et soulève l’air chaud.']],
'1-5':[['Cumulonimbus (Cb)','Un énorme nuage d’orage, très haut. À éviter absolument.'],['Givrage','De la glace qui se forme sur l’avion et qui l’alourdit en abîmant la forme des ailes.'],['Cisaillement (windshear)','Un changement brutal du vent sur une courte distance : dangereux près du sol.'],['Turbulence','Des mouvements désordonnés de l’air qui secouent l’avion.'],['Carburateur','La pièce où l’air et l’essence se mélangent avant d’entrer dans le moteur.'],['Visibilité','La distance maximale à laquelle on voit nettement.']],
'1-6':[['Code OACI','Un code de 4 lettres pour chaque aérodrome. LFBO = Toulouse-Blagnac.'],['UTC (Z)','L’heure du méridien de Greenwich, utilisée partout en aviation pour éviter les confusions.'],['QNH','La pression ramenée au niveau de la mer, que l’on affiche sur l’altimètre.'],['METAR','La météo observée maintenant sur un aérodrome.'],['TAF','La prévision météo d’un aérodrome pour les heures qui viennent.'],['CAVOK','« Tout va bien » : bonne visibilité, pas de nuage bas, pas de phénomène dangereux.']],
'2-1':[['Aérostat','Un aéronef qui vole parce qu’il est plus léger que l’air (ballon, dirigeable).'],['Poussée d’Archimède','La force vers le haut que subit un objet plongé dans un fluide (eau ou air).'],['Lest','Du poids (sable, eau) que l’on jette pour que le ballon s’allège et monte.'],['Soupape','Une ouverture que l’on peut ouvrir pour laisser s’échapper de l’air ou du gaz.'],['Hélium','Gaz plus léger que l’air et qui ne brûle pas.']],
'2-2':[['Pression statique','La pression de l’air autour de nous, comme si l’air ne bougeait pas.'],['Pression dynamique','La pression supplémentaire créée par l’air en mouvement : plus c’est rapide, plus elle est grande.'],['Tube de Pitot','Un petit tube pointé vers l’avant qui capte la pression de l’air et permet de calculer la vitesse.'],['IAS / TAS / GS','Vitesse indiquée (lue sur l’instrument) / vitesse propre (dans l’air) / vitesse sol (par rapport au sol).'],['Mach','Le rapport entre la vitesse de l’avion et celle du son. Mach 1 = la vitesse du son.'],['Couche limite','La fine couche d’air collée à la surface de l’avion et freinée par le frottement.']],
'2-3':[['Extrados / intrados','Le dessus / le dessous de l’aile.'],['Bord d’attaque / de fuite','L’avant / l’arrière de l’aile.'],['Incidence','L’angle entre l’aile et l’air qui arrive dessus. Trop grand : décrochage.'],['Décrochage','L’air ne suit plus le dessus de l’aile : la portance s’effondre. Réponse : baisser le nez.'],['Portance','La force qui soutient l’avion en l’air, vers le haut.'],['Traînée','La force de résistance de l’air, qui freine l’avion.'],['Finesse','Le rapport portance/traînée : plus il est grand, plus l’avion plane loin.'],['Volets','Parties mobiles de l’aile que l’on sort pour voler plus lentement.']],
'2-4':[['Palier','Un vol horizontal, à altitude constante.'],['Traction','La force qui tire l’avion vers l’avant (hélice ou réacteur).'],['Centre de gravité','Le point où l’on peut considérer que tout le poids de l’avion est concentré.'],['Facteur de charge (g)','Combien de fois ton poids tu ressens. 1 g = normal ; 2 g = deux fois plus lourd.'],['Centrage','La position du centre de gravité, qui doit rester dans des limites sûres.']],
'2-5':[['Tangage / roulis / lacet','Nez qui monte ou descend / ailes qui s’inclinent / nez qui tourne à gauche ou à droite.'],['Gouverne','Une partie mobile qui oriente l’avion (aileron, profondeur, direction).'],['Palonnier','Les pédales qui commandent la gouverne de direction.'],['Compensateur (trim)','Un réglage qui permet de lâcher le manche sans que l’avion change d’assiette.'],['Dièdre','Les ailes légèrement relevées en V, qui aident l’avion à se remettre à plat tout seul.'],['Virage coordonné','Un virage propre, sans glissade : la bille de l’indicateur reste au centre.'],['Vrille','Une chute en tournant sur soi-même, après un décrochage où une aile décroche plus que l’autre.']],
'3-1':[['Aérodyne','Un aéronef plus lourd que l’air, qui vole grâce au mouvement dans l’air (avion, hélicoptère, planeur).'],['Fuselage','Le « corps » de l’avion, où sont installés les passagers.'],['Empennage','La queue de l’avion : elle le stabilise et l’aide à tourner.'],['Envergure','La distance d’un bout d’aile à l’autre.'],['Charge alaire','La masse de l’avion divisée par la surface de ses ailes.'],['Composite','Un matériau fabriqué en collant des fibres (carbone, verre) : léger et très solide.']],
'3-2':[['Vilebrequin','L’axe tournant du moteur, mis en rotation par les pistons.'],['Admission / échappement','Le moment où le moteur aspire l’air frais / rejette les gaz brûlés.'],['Turboréacteur','Un moteur qui aspire de l’air, le comprime, le brûle avec du carburant et l’éjecte vers l’arrière.'],['Turbopropulseur','Un moteur à turbine qui fait tourner une hélice.'],['Comburant','Ce qui permet au carburant de brûler : le plus souvent l’oxygène.'],['Poussée','La force d’avancement donnée par les gaz éjectés vers l’arrière.']],
'3-3':[['Prise statique','Un petit trou sur le côté de l’avion qui mesure la pression de l’air ambiant.'],['Gyroscope','Une toupie qui tourne vite et garde sa direction : elle sert de référence pour l’horizon et le cap.'],['Variomètre','L’instrument qui indique si l’avion monte ou descend, et à quelle vitesse.'],['Cap','La direction dans laquelle pointe le nez de l’avion.'],['Transpondeur','Un petit émetteur qui répond aux radars en donnant un code et l’altitude.'],['Glass cockpit','Un tableau de bord où les cadrans sont remplacés par des écrans.']],
'3-4':[['Rotor','L’ensemble des pales qui tournent au-dessus de l’hélicoptère.'],['Pas collectif','Le levier qui change l’inclinaison de toutes les pales en même temps : l’hélicoptère monte ou descend.'],['Manche cyclique','Le manche qui incline le disque du rotor : l’hélicoptère avance, recule ou va sur le côté.'],['Autorotation','Posé sans moteur : le rotor continue de tourner grâce à l’air qui le traverse.'],['Thermique','Une colonne d’air chaud qui monte et que les planeurs utilisent pour prendre de l’altitude.'],['Drone','Un aéronef sans pilote à bord.']],
'3-5':[['Étage','Un morceau de fusée avec ses propres réservoirs et moteurs, largué quand il est vide.'],['Orbite','La trajectoire courbe d’un objet qui tourne autour de la Terre.'],['LEO / GEO','Orbite basse (200 à 2 000 km) / orbite géostationnaire (35 786 km, au-dessus d’un point fixe de l’équateur).'],['Apesanteur','La sensation de flotter, parce qu’on est en chute libre autour de la Terre.'],['Ergols','Le carburant et le comburant d’une fusée.']],
'4-1':[['Latitude','L’angle qui dit à quelle distance on est de l’équateur (nord ou sud).'],['Longitude','L’angle qui dit à quelle distance on est du méridien de Greenwich (est ou ouest).'],['Mille nautique (NM)','1 852 m : l’unité de distance en aviation.'],['Échelle','Le rapport entre la carte et le terrain. 1/500 000 : 1 cm = 5 km.'],['Déclinaison','L’écart entre le nord géographique et le nord indiqué par le compas.'],['UTC','L’heure universelle, utilisée partout en aviation.']],
'4-2':[['Route','La direction du chemin réellement suivi au-dessus du sol.'],['Cap','La direction dans laquelle pointe le nez de l’avion.'],['Dérive','L’écart entre le cap et la route, causé par le vent de travers.'],['Vecteur','Une flèche qui représente une direction et une vitesse.'],['Navigation à l’estime','Calculer où l’on est avec la route, la vitesse et le temps écoulé.']],
'4-3':[['VOR','Une balise radio qui permet de savoir sur quelle demi-droite (radial) on se trouve autour d’elle.'],['DME','Un appareil qui mesure la distance à une balise.'],['ILS','Un système qui guide l’avion jusqu’à la piste, par mauvaise visibilité.'],['GNSS','Navigation par satellites (le GPS en fait partie).'],['Radar secondaire','Un radar qui interroge le transpondeur de l’avion et reçoit une réponse.'],['ADS-B','Un système où l’avion diffuse tout seul sa position.']],
'4-4':[['Altitude','La hauteur au-dessus du niveau de la mer.'],['Hauteur','La hauteur au-dessus du sol ou de l’aérodrome.'],['Niveau de vol (FL)','Une altitude mesurée avec le calage standard 1013, utilisée en croisière.'],['Calage','Le réglage de l’altimètre pour qu’il tienne compte de la pression du jour.'],['QNH / QFE / 1013','Trois calages : altitude / hauteur au-dessus de l’aérodrome / niveau de vol.'],['Altitude de transition','L’altitude où l’on passe du calage QNH au calage 1013.']],
'4-5':[['VFR','Vol à vue : le pilote se repère en regardant dehors.'],['IFR','Vol aux instruments : possible dans les nuages, avec une qualification spéciale.'],['Espace contrôlé','Une zone où un contrôleur donne des autorisations aux avions.'],['CTR / TMA','Zone de contrôle autour d’un aérodrome / zone de contrôle plus haute, autour des grandes villes.'],['NOTAM','Un message qui prévient d’un changement temporaire (piste fermée, zone active…).'],['Priorité','Qui doit céder le passage à qui, pour éviter les collisions.']],
'4-6':[['Circuit d’aérodrome','Le « tour de piste » que suivent tous les avions autour d’un aérodrome.'],['Finale','La dernière partie de l’approche, alignée sur la piste.'],['Arrondi','La manœuvre juste avant de toucher la piste : on redresse le nez pour se poser en douceur.'],['Remise de gaz','Abandonner l’atterrissage : plein gaz, on remonte et on recommence.'],['PAPI','Quatre feux à côté de la piste qui indiquent si on est trop haut, trop bas, ou sur la bonne pente.'],['Vent traversier','Un vent qui souffle de côté par rapport à la piste.']],
'4-7':[['Phraséologie','Le langage radio codifié, court et précis.'],['Collationner','Répéter une consigne mot pour mot pour montrer qu’on l’a bien comprise.'],['Mayday / Pan pan','Détresse (danger grave) / urgence (problème sans danger immédiat).'],['Hypoxie','Manque d’oxygène dans le sang, en altitude.'],['CRM','Gestion de l’équipage : bien communiquer et décider ensemble.'],['OACI / AESA / DGAC','Organisations : mondiale / européenne / française de l’aviation civile.']],
'5-1':[['Aérostat / aérodyne','Plus léger que l’air (ballon) / plus lourd que l’air (avion).'],['Dirigeable','Un ballon avec un moteur et un gouvernail.'],['Planeur','Un appareil sans moteur qui vole en glissant dans l’air.'],['Brevet de pilote','Le diplôme officiel qui autorise à piloter.']],
'5-2':[['Reconnaissance','Observer l’ennemi depuis le ciel pour connaître ses positions.'],['Aéropostale','La compagnie qui transportait le courrier par avion entre la France, l’Afrique et l’Amérique du Sud.'],['Biplan / monoplan','Avion avec deux paires d’ailes superposées / avec une seule paire d’ailes.']],
'5-3':[['Turboréacteur','Un moteur à réaction qui éjecte des gaz vers l’arrière pour avancer.'],['Mur du son','La difficulté de dépasser la vitesse du son, où l’air se comprime en une onde de choc.'],['Supersonique','Plus rapide que le son.'],['Consortium','Un groupe d’entreprises qui travaillent ensemble sur un projet commun.']],

(function(){ const B=window.BIA;
/* B.simple[chapitre] = [[fragment du titre h2 de la section, titre de l’encadré, HTML]] ; l’encadré est inséré à la fin de la section */
B.simple={
'1-1':[
['De quoi est faite','L’air, c’est quoi au juste ?','<p>L’air est un mélange de gaz invisibles. Imagine un immense paquet de petites billes qui s’agitent : <b>4 billes sur 5</b> sont du diazote (il ne sert à rien pour respirer), <b>1 bille sur 5</b> est du dioxygène, celui que tu respires. Les nuages, eux, viennent de la vapeur d’eau, un gaz de plus.</p><p>L’air est léger… mais pas sans poids ! Une colonne d’air qui monte jusqu’à l’espace pèse environ 1 kg sur chaque carré de 1 cm de côté. C’est ce poids qui crée la <b>pression</b>.</p>'],
['Les couches','Pourquoi plusieurs couches ?','<p>L’atmosphère ressemble à un mille-feuille. Chaque couche a un comportement différent à cause de ce qui la chauffe : le <b>sol</b> chauffe la couche du bas (la troposphère), l’<b>ozone</b> chauffe celle du dessus (la stratosphère).</p><p>À retenir pour le BIA : <b>tout se passe dans la troposphère</b>. C’est là que sont les nuages, la pluie, le vent… et presque tous les avions.</p>'],
['atmosphère standard','Pourquoi inventer une atmosphère « type » ?','<p>Le temps change tous les jours. Pour comparer deux avions, il faut les mesurer <b>dans les mêmes conditions</b>, comme deux élèves qui passent le même contrôle. L’ISA est cette « météo de référence » : 15 °C et 1 013 hPa au niveau de la mer.</p><p>Ensuite, plus tu montes, plus il fait froid : <b>environ 2 °C de moins tous les 1 000 ft</b>. Si tu es à 3 000 m, tu enlèves 6,5 °C par kilomètre : 15 − 19,5 = −4,5 °C.</p>'],
['Comment l’air change','Pourquoi l’air devient « mince » en altitude ?','<p>Pense à une pile de matelas : celui du bas est écrasé par tous les autres, celui du haut ne porte rien. L’air du bas est <b>écrasé par l’air au-dessus</b> : il est dense. En haut, il y a moins d’air au-dessus, donc l’air est « léger » et peu dense.</p><p>Conséquence pour le pilote : l’aile trouve moins d’air pour la soutenir, le moteur moins d’air pour brûler le carburant. <b>Par temps chaud, en altitude, il faut donc plus de piste pour décoller.</b></p>']],
'1-2':[
['Anticyclone','Haute pression, basse pression : version simple','<p>Imagine un ballon de baudruche : à l’intérieur, la pression est plus forte que dehors. L’air « veut » sortir. C’est pareil dans l’atmosphère :</p><ul><li><b>Anticyclone (A)</b> : l’air est « poussé vers le bas ». En descendant il se réchauffe, les nuages disparaissent : beau temps.</li><li><b>Dépression (D)</b> : l’air est « aspiré vers le haut ». En montant il se refroidit, la vapeur se condense : nuages et pluie.</li></ul><p>Astuce : <b>D comme Dégradation, A comme Agréable</b>.</p>'],
['Pourquoi le vent tourne','Pourquoi le vent ne va pas droit vers la dépression ?','<p>Sans rotation de la Terre, l’air irait tout droit de la haute vers la basse pression, comme l’eau coule du haut vers le bas d’une pente. Mais la Terre tourne sous l’air. Imagine que tu essaies de lancer un ballon à un ami assis sur un manège qui tourne : le ballon semble dévier.</p><p>Résultat : en altitude, le vent <b>tourne autour</b> des centres de pression au lieu d’y aller directement. Plus les isobares sont serrées, plus la pente de pression est forte, donc plus le vent est fort : comme une pente de montagne plus raide.</p><p><b>Règle de Buys-Ballot :</b> dos au vent, la dépression est à ta gauche. Essaie avec ton bras !</p>'],
['Direction et force','Le vent « vient de » : l’erreur n° 1','<p>Un vent de <b>270°</b> ne souffle pas vers 270°. Il vient <b>de</b> l’ouest. Retiens : on donne le vent comme on dit « le vent d’ouest » en français. C’est la direction d’où il vient.</p><p>La manche à air est comme une manche de vêtement : elle est attachée d’un côté (l’origine du vent) et <b>gonflée dans le sens où il souffle</b>.</p>'],
['Vents locaux','La brise de mer en 3 phrases','<p>Le jour, le soleil chauffe la terre plus vite que la mer. L’air au-dessus de la terre chauffe et monte, comme au-dessus d’un radiateur. L’air frais de la mer vient prendre sa place : <b>le vent souffle de la mer vers la terre</b>. La nuit, c’est l’inverse.</p>']],
'1-3':[
['humidité','La vapeur d’eau et le point de rosée','<p>L’air est comme une éponge : l’air <b>chaud</b> peut garder beaucoup d’eau (invisible), l’air <b>froid</b> beaucoup moins. Si on refroidit l’air, l’éponge est pleine puis déborde : <b>l’eau se transforme en gouttelettes</b>.</p><p>Tu l’as déjà vu : sors un verre d’eau glacée en été, il se couvre de buée. La température à laquelle ça arrive s’appelle le <b>point de rosée</b>. Plus la température de l’air (T) est proche du point de rosée (Td), plus l’air est près de former brouillard ou nuage.</p>'],
['Comment se forme','La recette d’un nuage','<p>Il faut <b>3 ingrédients</b> : de l’air humide, du refroidissement, et de minuscules poussières sur lesquelles l’eau s’accroche.</p><ol><li>Le soleil chauffe le sol, qui chauffe une bulle d’air.</li><li>La bulle, plus légère, monte.</li><li>En montant, la pression diminue, la bulle se détend et se <b>refroidit</b> (comme une bombe aérosol qui devient froide).</li><li>Arrivée à son point de rosée : <b>condensation</b>, le nuage apparaît. C’est la base du nuage.</li></ol><p>La formule 125 × (T − Td) te donne la hauteur de cette base : si l’écart T − Td est de 10 °C, la base est vers 1 250 m.</p>'],
['Stable','Stable ou instable : l’image de la balle','<p>Pose une balle au fond d’une cuvette : si tu la pousses un peu, elle revient. C’est <b>stable</b>. Pose-la au sommet d’une colline : au moindre souffle, elle dévale. C’est <b>instable</b>.</p><p>Pour l’air, c’est pareil : une bulle poussée vers le haut <b>revient</b> en bas dans l’air stable (nuages plats, ciel calme, mais brume). Elle <b>continue de monter</b> dans l’air instable (gros nuages gonflés, averses, turbulence, mais bonne visibilité).</p>'],
['Les genres','Comment retenir les noms des nuages ?','<p>Les noms sont des mots latins qu’on assemble :</p><ul><li><b>cirrus</b> = cheveu (nuages tout en haut, en filaments de glace)</li><li><b>cumulus</b> = tas (nuage gonflé, comme du chou-fleur)</li><li><b>stratus</b> = couche (nappe grise)</li><li><b>nimbus</b> = pluie</li><li><b>alto</b> = milieu</li></ul><p>Exemple : <b>cumulonimbus</b> = un tas qui donne de la pluie, donc le nuage d’orage.</p>']],
'1-4':[
['Deux fronts','Front chaud, front froid : l’image de la rampe et du mur','<p>Un front, c’est la ligne où deux grosses masses d’air se rencontrent.</p><ul><li><b>Front chaud</b> : l’air chaud, léger, <b>monte doucement sur une rampe</b> d’air froid. Le ciel se dégrade lentement, pendant des heures : pluie fine et continue.</li><li><b>Front froid</b> : l’air froid, lourd, <b>arrive comme un mur</b> et soulève brutalement l’air chaud. Tout arrive d’un coup : orages, averses, rafales, mais ça passe vite.</li></ul>'],
['perturbation complète','Une perturbation, étape par étape','<p>Imagine que tu es assis dehors et que la perturbation passe au-dessus de toi, d’ouest en est :</p><ol><li>De hauts nuages fins annoncent l’arrivée (front chaud), puis le ciel s’épaissit et la pluie commence.</li><li>Entre les deux fronts, l’air est doux et le temps se calme un peu : le secteur chaud.</li><li>Puis le front froid arrive : averses, vent qui tourne, température qui chute.</li><li>Derrière, c’est la traîne : ciel variable, éclaircies et petites averses.</li></ol>'],
['occlusion','Pourquoi parle-t-on d’occlusion ?','<p>Le front froid avance plus vite que le front chaud. Comme un coureur plus rapide, il finit par le rattraper. L’air chaud, pris en sandwich, est <b>soulevé du sol</b> : il n’est plus en contact avec nous. « Occlusion » veut dire « fermeture ».</p>']],
'1-5':[
['orage','Comment naît un orage ?','<p>Un orage, c’est une usine à courants d’air :</p><ol><li>L’air chaud et humide monte très haut et très vite (jusqu’à 10 km).</li><li>Les gouttelettes grossissent, gèlent, retombent et remontent : cela crée de la grêle et des charges électriques.</li><li>Quand la charge devient trop forte, une étincelle géante jaillit : <b>l’éclair</b>.</li><li>L’éclair chauffe l’air d’un coup, qui se dilate brutalement : <b>le tonnerre</b>.</li></ol><p>Pour un pilote : <b>jamais</b> dans un cumulonimbus. Les courants montants et descendants y sont assez forts pour détruire un avion léger.</p>'],
['givrage','Pourquoi la glace est dangereuse ?','<p>Imagine que tu ajoutes une couche de pâte à modeler sur l’aile : sa forme change, elle porte moins, elle est plus lourde et elle freine davantage. C’est ce que fait la glace. Elle peut aussi boucher le tube de Pitot, donc fausser l’anémomètre.</p><p>Les gouttelettes « surfondues » sont de l’eau restée liquide sous 0 °C ; elles gèlent d’un coup en touchant l’avion.</p>'],
['Turbulence','Turbulence et cisaillement : l’image du torrent','<p>La turbulence, c’est l’air qui se comporte comme l’eau d’un torrent : des remous. Ils viennent du soleil (bulles d’air chaud), du sol (le vent qui contourne un relief ou un bâtiment) ou de forts vents en altitude.</p><p>Le <b>cisaillement</b> (windshear), c’est quand le vent <b>change d’un coup de vitesse ou de direction</b> sur une courte distance. À l’atterrissage, ton avion perd subitement de la vitesse : danger.</p>']],
'1-6':[
['METAR','Lire un METAR comme une phrase','<p>Un METAR est une phrase codée qui se lit <b>toujours dans le même ordre</b> : où (LFBO), quand (061830Z : le 6, à 18 h 30 UTC), le vent (24012 : 240° à 12 nœuds), la visibilité (9999 : 10 km ou plus), les nuages (SCT030 : quelques nuages à 3 000 ft), la température et le point de rosée (12/08), la pression (Q1015).</p><p>Astuce : un METAR, c’est <b>ce qu’il y a maintenant</b>. Un TAF, c’est <b>ce qui est prévu</b>.</p>']],
'2-1':[
['principe d’Archimède','Archimède dans la baignoire','<p>Quand tu t’assois dans un bain, l’eau monte. Plus tu t’enfonces, plus l’eau est repoussée, et plus l’eau te <b>pousse vers le haut</b>. Cette poussée est égale au <b>poids de l’eau que tu as repoussée</b>.</p><p>Un ballon fait la même chose, mais dans l’air : il repousse beaucoup d’air. Si l’ensemble « ballon + nacelle + gaz » est <b>plus léger</b> que cet air repoussé, il monte. Plus lourd, il descend. Pareil : il flotte.</p>'],
['Deux façons','Montgolfière contre ballon à gaz','<p>Les deux ont le même but : être plus léger que l’air autour.</p><ul><li><b>Montgolfière</b> : on <b>chauffe</b> l’air dans l’enveloppe, il devient moins dense (plus léger) que l’air extérieur. On monte en chauffant, on descend en laissant refroidir ou en ouvrant la soupape.</li><li><b>Ballon à gaz</b> : on remplit l’enveloppe d’un gaz <b>naturellement plus léger</b> que l’air (hélium). On monte en lâchant du lest (du sable), on descend en lâchant un peu de gaz.</li></ul>']],
'2-2':[
['Trois pressions','Pression statique et dynamique : le vélo','<p>Quand tu es à l’arrêt à vélo, tu ne sens rien de particulier : c’est la <b>pression statique</b> (la pression de l’air autour). Dès que tu roules vite, tu sens l’air qui te pousse au visage : c’est la <b>pression dynamique</b>. Plus tu vas vite, plus elle est forte, et elle quadruple si tu doubles ta vitesse.</p><p>Le tube de Pitot, pointé vers l’avant, reçoit cette poussée de plein fouet. L’anémomètre l’utilise pour calculer la vitesse.</p>'],
['Bernoulli','Bernoulli, l’image du tuyau d’arrosage','<p>Pince un tuyau d’arrosage avec le pouce : l’eau sort plus vite. Dans l’air, c’est pareil : quand l’air est forcé de passer par un passage étroit, il <b>accélère</b>.</p><p>Bernoulli dit en plus : <b>quand l’air accélère, sa pression baisse</b>. Cette idée est utile pour comprendre l’aile : l’air accélère au-dessus et la pression y baisse.</p><p>Attention : Bernoulli n’explique pas tout à lui seul. L’aile dévie aussi l’air vers le bas, et l’air répond en poussant l’aile vers le haut (action-réaction).</p>'],
['Quatre vitesses','Quatre vitesses : la métaphore du marcheur sur un tapis roulant','<p>Imagine quelqu’un qui marche sur un tapis roulant d’aéroport. <b>TAS</b> = sa vitesse sur le tapis (dans l’air). <b>GS</b> = sa vitesse vue par quelqu’un immobile à côté (sol). Si le tapis va dans le même sens que lui (vent arrière), il va plus vite par rapport au sol. S’il va dans l’autre sens (vent de face), moins vite.</p><p><b>IAS</b> est ce que lit le pilote : elle dépend de la pression sur le Pitot. En altitude, l’air est moins dense, donc pour une même vitesse réelle, l’IAS est plus petite que la TAS.</p>'],
['couche limite','La couche limite en deux mots','<p>Passe ta main dans de l’eau : l’eau tout contre ta peau est un peu « retenue », celle plus loin glisse. Pour l’aile, c’est pareil : une très fine couche d’air collée à la surface est freinée. C’est la <b>couche limite</b>. À forte incidence, elle se décolle de l’aile : c’est le début du décrochage.</p>']],
'2-3':[
['Vocabulaire','L’incidence, l’assiette et la pente : ne pas les confondre','<p>Trois angles :</p><ul><li><b>Assiette</b> : l’angle du <b>nez</b> de l’avion avec l’horizon (« où je regarde »).</li><li><b>Pente</b> : l’angle de la <b>trajectoire</b> avec l’horizon (« où je vais »).</li><li><b>Incidence</b> : l’angle entre l’<b>aile</b> et l’air qui arrive (« comment l’aile attaque l’air »).</li></ul><p>On peut avoir le nez en l’air (assiette +10°) et pourtant descendre (pente −3°) : l’incidence est alors de 13°.</p>'],
['Pourquoi l’aile','Pourquoi l’aile porte : deux façons de voir la même chose','<p><b>Vue 1 – action/réaction :</b> sors la main par la vitre d’une voiture, paume inclinée vers le haut : l’air est dévié vers le bas et ta main est poussée vers le haut. L’aile fait pareil.</p><p><b>Vue 2 – les pressions :</b> l’air accélère sur le dessus de l’aile, donc la pression y baisse. Dessous, la pression est plus forte. L’aile est « poussée » du côté où la pression est la plus forte, donc vers le haut.</p><p>Les deux vues sont vraies : ce sont deux manières de décrire la même force.</p>'],
['décrochage','Le décrochage : ce que ça veut dire vraiment','<p>Sors encore la main de la voiture, paume inclinée : si tu l’inclines trop, l’air ne glisse plus et part en tourbillons, et ta main est « lâchée ». Pour l’aile, c’est pareil : <b>trop d’incidence</b> (environ 15°) et l’air se décolle, la portance s’effondre.</p><p>Le décrochage n’est <b>pas</b> « le moteur qui s’arrête ». L’avion peut décrocher à n’importe quelle vitesse. <b>Le remède : baisser le nez</b> pour réduire l’incidence, puis ajouter de la puissance.</p>'],
['traînée','Deux traînées, une idée','<p>La <b>traînée parasite</b>, c’est le frottement de l’air sur la forme de l’avion : comme ta main dehors, poing fermé ou à plat. Elle augmente avec la vitesse.</p><p>La <b>traînée induite</b> est le « prix » de la portance : plus on demande de portance à l’aile (à basse vitesse), plus elle crée de tourbillons au bout des ailes, qui freinent l’avion.</p>'],
['finesse','La finesse : un exemple concret','<p>Un planeur de finesse 40 avance de <b>40 mètres pour 1 mètre perdu</b>. Depuis 1 000 m, il peut donc faire 40 km (air calme). Plus la finesse est grande, plus l’avion plane loin. C’est pour cela que les planeurs ont de très longues ailes fines.</p>']],
'2-4':[
['Les quatre forces','Les quatre forces : tirer à la corde','<p>Imagine un tir à la corde à quatre équipes : <b>portance</b> vers le haut contre <b>poids</b> vers le bas, <b>traction</b> vers l’avant contre <b>traînée</b> vers l’arrière.</p><p>Si les équipes sont à égalité, rien ne change : l’avion vole droit à vitesse constante (le palier). Si la traction gagne, l’avion accélère. Si le poids gagne, il descend.</p>'],
['Montée','Pourquoi un avion peut planer','<p>Si le moteur s’arrête, il n’y a plus de traction. Mais l’avion est en descente : une partie de son <b>poids</b> le tire alors vers l’avant, comme un skieur sur une pente. Cette « traction gratuite » équilibre la traînée. L’avion n’« tombe » pas : il plane, d’autant plus loin que sa finesse est grande.</p>'],
['Facteur de charge','Le facteur de charge : tu te sens plus lourd','<p>Dans un virage serré en voiture, tu es plaqué contre la portière. Dans un virage en avion, tu es plaqué sur ton siège : tu te sens plus lourd. Ce « poids ressenti » s’exprime en <b>g</b>. À 1 g, tu pèses ton poids normal. À 2 g, deux fois ton poids.</p><p>Plus de g signifie que l’aile doit porter davantage, donc <b>la vitesse de décrochage augmente</b>.</p>']],
'2-5':[
['Trois axes','Les trois mouvements : l’avion comme une flèche','<p>Prends un stylo et tiens-le comme un avion. Tu peux :</p><ul><li>le faire <b>monter/descendre le nez</b> : tangage (le manche avance/recule, <b>gouverne de profondeur</b>) ;</li><li>incliner les ailes <b>à gauche/à droite</b> : roulis (manche à gauche/droite, <b>ailerons</b>) ;</li><li>tourner le nez <b>à gauche/droite</b> à plat : lacet (pédales, <b>gouverne de direction</b>).</li></ul>'],
['Le virage','Pourquoi on tire dans un virage','<p>L’aile pousse perpendiculairement à elle-même. Quand elle est inclinée, cette poussée est penchée : une partie fait <b>tourner</b> l’avion, une autre le <b>soutient</b>. La partie qui soutient est plus petite que la portance totale, donc l’avion aurait tendance à descendre. Pour compenser, on tire un peu sur le manche : on augmente l’incidence, donc la portance.</p>'],
['Stabilité','Un avion stable : la balle dans la cuvette','<p>Un avion bien conçu revient à son équilibre tout seul, comme une balle au fond d’une cuvette. Les ailes en V (dièdre) l’aident à se remettre à plat. La queue (empennage) le garde en ligne comme les plumes d’une flèche.</p>']],
'3-1':[
['Quelques mesures','Allongement et charge alaire : à quoi ça sert ?','<p>Une aile <b>longue et étroite</b> (grand allongement) crée moins de traînée induite : c’est le cas des planeurs. Une aile <b>courte et large</b> est plus robuste et maniable.</p><p>La charge alaire, c’est la masse qu’<b>un mètre carré d’aile</b> doit porter. Plus elle est grande, plus l’avion doit voler vite pour décoller.</p>']],
'3-2':[
['Moteur à pistons','Les 4 temps : « j’aspire, je comprime, j’explose, je rejette »','<p>Pense à une pompe à vélo qui fonctionne à l’envers :</p><ol><li><b>Admission</b> : le piston descend et aspire l’air et l’essence.</li><li><b>Compression</b> : il remonte et écrase le mélange.</li><li><b>Combustion</b> : la bougie enflamme, ça pousse fort le piston. C’est le seul temps qui donne de la puissance.</li><li><b>Échappement</b> : il remonte et chasse les gaz brûlés.</li></ol>'],
['Turbomachines','Le réacteur : un ballon de baudruche qui se vide','<p>Gonfle un ballon et lâche-le : l’air sort d’un côté, le ballon part de l’autre. C’est l’action-réaction. Le réacteur fait pareil en continu : il <b>aspire</b> de l’air, le <b>comprime</b>, le <b>brûle</b> avec du kérosène et l’<b>éjecte</b> à grande vitesse vers l’arrière.</p>'],
['moteur-fusée','Pourquoi une fusée marche dans le vide','<p>Une fusée n’a pas besoin de s’appuyer sur l’air : elle éjecte des gaz vers l’arrière et, par réaction, avance vers l’avant. Comme quelqu’un assis sur un skateboard qui lance un sac lourd : il recule. Elle emporte aussi son oxygène, puisqu’il n’y en a pas dans l’espace.</p>']],
'3-3':[
['pitot-statique','Les trois instruments qui mesurent la pression','<p>Trois instruments utilisent <b>deux prises d’air</b> : le Pitot (face au vent) et la prise statique (sur le côté).</p><ul><li><b>Anémomètre</b> : compare les deux pour trouver la vitesse.</li><li><b>Altimètre</b> : un baromètre qui affiche l’altitude (la pression baisse quand on monte).</li><li><b>Variomètre</b> : indique si la pression baisse ou monte : tu montes ou tu descends.</li></ul>'],
['gyroscopiques','Le gyroscope : une toupie qui ne veut pas bouger','<p>Fais tourner une toupie : tant qu’elle tourne vite, elle reste droite, même si tu inclines la table. Un gyroscope d’avion, c’est cela : une petite toupie qui garde une direction fixe. L’avion tourne autour d’elle, et l’instrument affiche la différence : <b>horizon artificiel</b> (inclinaison), <b>conservateur de cap</b> (direction), <b>indicateur de virage</b> (vitesse de rotation).</p>'],
['prise se bouche','Que se passe-t-il quand une prise se bouche ?','<p>Si le <b>Pitot</b> est bouché, la pression dedans reste figée : l’anémomètre devient faux (il agit comme un altimètre : il indique plus en montant). Si la <b>prise statique</b> est bouchée, l’altimètre reste bloqué, le variomètre indique zéro et l’anémomètre est faux.</p>']],
'3-4':[
['hélicoptère','L’hélicoptère : trois commandes, trois effets','<p>Le rotor est une aile qui tourne. On le commande avec :</p><ul><li><b>Le collectif</b> (levier à gauche) : plus de pas sur toutes les pales : <b>monte</b> ; moins : <b>descend</b>.</li><li><b>Le cyclique</b> (manche) : incline le disque, donc l’hélicoptère va dans cette direction.</li><li><b>Le palonnier</b> (pieds) : commande le rotor de queue, donc le nez à gauche ou à droite.</li></ul><p>Le rotor de queue existe parce que, quand le rotor tourne dans un sens, le fuselage veut tourner dans l’autre (action-réaction).</p>'],
['planeur','Le planeur : comment rester en l’air sans moteur ?','<p>Un planeur descend toujours un peu par rapport à l’air qui l’entoure. Mais si cet air <b>monte plus vite</b> qu’il ne descend, il gagne de l’altitude ! Les pilotes cherchent donc des colonnes d’air chaud (thermiques) sous les cumulus, ou le vent qui remonte le long d’une montagne.</p>']],
'3-5':[
['fusée','La fusée : lancer un sac depuis un skateboard','<p>Sur un skateboard, lance un sac lourd vers l’arrière : tu pars vers l’avant. Une fusée éjecte des gaz brûlants à très grande vitesse : c’est son « sac ». Elle est étagée car, une fois les réservoirs vides, on largue les étages inutiles pour ne pas porter de poids mort.</p>'],
['orbite','Pourquoi un satellite ne tombe pas ?','<p>Lance une balle : plus tu la lances fort, plus elle va loin avant de toucher le sol. Imagine une balle lancée si fort que la Terre s’arrondit sous elle avant qu’elle ne tombe : elle tombe en permanence, mais <b>sans jamais toucher le sol</b>. C’est une orbite.</p><p>À bord de l’ISS, les astronautes flottent parce qu’ils sont en <b>chute libre</b>, pas parce qu’il n’y a plus de pesanteur.</p>']],
'4-1':[
['La Terre','Latitude et longitude : l’adresse sur la Terre','<p>Pour trouver une case dans une feuille quadrillée, on donne deux nombres : la ligne et la colonne. Sur la Terre, c’est pareil : la <b>latitude</b> (distance à l’équateur, vers le nord ou le sud) et la <b>longitude</b> (distance à Greenwich, vers l’est ou l’ouest).</p>'],
['unités','Pourquoi le mille nautique ?','<p>1 mille nautique, c’est <b>1 minute de latitude</b>. Comme 1° = 60 minutes, 1° de latitude = 60 NM. Facile de mesurer des distances directement sur la carte, sur l’échelle de latitude.</p>'],
['heure','UTC : l’heure commune de tous les pilotes','<p>Quand il est midi à Paris, il est 6 h à New York. Pour ne pas se tromper, les pilotes du monde entier utilisent la même heure : <b>UTC</b>. En France : UTC + 1 l’hiver, UTC + 2 l’été. Donc 14 h en été = 12 h UTC.</p>']],
'4-2':[
['triangle','Le triangle des vitesses : le nageur et la rivière','<p>Tu veux traverser une rivière en nageant, mais le courant t’emporte. Pour arriver pile en face, tu dois nager un peu <b>vers l’amont</b>. Le pilote fait pareil : il ne pointe pas son nez exactement vers sa destination, il le décale <b>du côté d’où vient le vent</b>.</p>'],
['1 sur 60','La règle du 1 sur 60','<p>Si tu t’éloignes de 60 NM avec 1° d’erreur de cap, tu es écarté de <b>1 NM</b> de la route. Donc à 30 NM, 2 NM d’écart correspondent à 4° d’erreur : 2 × 60 / 30 = 4. C’est un calcul rapide à faire de tête.</p>']],
'4-3':[
['moyens classiques','VOR : un phare qui émet 360 rayons','<p>Un VOR est comme un phare qui enverrait 360 faisceaux, un par degré. Ton récepteur te dit sur <b>quel faisceau (radial)</b> tu te trouves. Avec le DME, qui donne la distance, tu connais ta position : « radial 090, 25 NM ».</p>'],
['GNSS','Comment le GPS te trouve','<p>Chaque satellite envoie : « il est telle heure et je suis ici ». Le récepteur mesure le <b>temps</b> mis par le signal pour arriver, donc la distance au satellite. Avec 4 satellites, il croise les informations et trouve ta position.</p>']],
'4-4':[
['Trois mots','Altitude, hauteur, niveau de vol','<p>Imagine que tu es sur le toit d’un immeuble posé sur une colline. Ta <b>hauteur</b> est la distance jusqu’au sol sous l’immeuble. Ton <b>altitude</b> est la distance jusqu’au niveau de la mer. Le <b>niveau de vol</b> est une altitude mesurée avec une règle commune à tous les avions, pour éviter les collisions en croisière.</p>'],
['trois calages','Pourquoi caler l’altimètre ?','<p>Un altimètre est un baromètre. Mais la pression change avec la météo : si tu ne le recales pas, il se trompe. Il existe donc trois réglages : <b>QNH</b> (altitude réelle), <b>QFE</b> (zéro sur la piste), <b>1013</b> (référence commune en croisière).</p>'],
['erreur','De haut en bas, attention en dessous','<p>Si tu voles vers une zone de basse pression sans modifier ton calage, l’altimètre croit que tu es plus haut qu’en réalité : <b>tu es plus bas qu’affiché</b>. Dangereux près des montagnes !</p>']],
'4-5':[
['Voler à vue','VFR et IFR : voir ou instruments ?','<p>En <b>VFR</b>, tu pilotes comme on conduit en voiture : tu regardes dehors pour t’orienter et éviter les obstacles. Il faut donc une météo suffisante. En <b>IFR</b>, tu suis tes instruments, même dans les nuages, mais il faut une qualification en plus.</p>'],
['Évitement','Les règles de priorité : plus c’est difficile à manœuvrer, plus c’est prioritaire','<p>Un ballon ne peut pas changer de direction facilement, donc il est prioritaire sur un planeur, qui l’est sur un avion à moteur. Pour deux avions qui se croisent : <b>celui qui voit l’autre à sa droite cède le passage</b>. Face à face : chacun dévie à droite.</p>'],
['espace aérien','Les espaces aériens : une carte routière du ciel','<p>Le ciel est divisé en zones, comme les routes. Dans les zones <b>contrôlées</b>, un contrôleur te donne des autorisations. Dans les zones <b>non contrôlées</b>, c’est à toi de regarder dehors. Certaines zones sont <b>interdites</b> ou <b>dangereuses</b> (tirs, parachutages).</p>']],
'4-6':[
['face au vent','Pourquoi décoller face au vent ?','<p>Cours avec un cerf-volant : s’il y a du vent de face, il monte plus vite. L’avion aussi : avec le vent de face, l’air passe sur les ailes plus vite, donc il décolle <b>plus tôt</b>, sur une distance plus courte. Et à l’atterrissage, il touche le sol à plus faible vitesse par rapport au sol.</p>'],
['circuit','Le tour de piste : comme un rond-point','<p>Tous les avions suivent le même parcours, comme des voitures sur un rond-point : <b>montée</b>, <b>vent traversier</b> (virage à 90°), <b>vent arrière</b> (parallèle à la piste), <b>base</b> (virage à 90°) et <b>finale</b> (alignement sur la piste). Cela évite les collisions.</p>'],
['PAPI','Le PAPI : un feu tricolore de descente','<p>Quatre feux à côté de la piste. De là où tu les vois, ils sont blancs ou rouges selon ton angle de descente. <b>Plus de blanc : tu es haut. Plus de rouge : tu es bas.</b> Deux blancs et deux rouges : tu es pile sur la pente de 3°. Quatre blancs : bien trop haut. Quatre rouges : bien trop bas.</p>']],
'4-7':[
['Détresse','Mayday et Pan pan : à quoi les reconnaître ?','<p>« Mayday » vient du français « m’aider ». Il signale un <b>danger grave et immédiat</b>. « Pan pan » signale une <b>urgence</b> sans danger immédiat (un passager qui se sent mal, par exemple). On les dit trois fois pour qu’on les comprenne bien.</p>'],
['Panne moteur','Aviser, Naviguer, Communiquer','<p>Si le moteur s’arrête, <b>pilote d’abord</b>. Affiche la vitesse de meilleure finesse, choisis un champ, puis appelle à la radio. L’ordre est important : on ne téléphone pas avant d’avoir stabilisé l’avion.</p>']],
'5-1':[['ballons','Pourquoi 1783 est une date clé ?','<p>Avant 1783, l’homme n’a jamais quitté le sol en toute sécurité. Cette année-là, les frères Montgolfier envoient un ballon, puis des hommes montent dedans à Paris. C’est la première conquête de l’air, grâce à Archimède, avant l’avion.</p>']],
'5-2':[['Grande Guerre','Pourquoi la guerre a accéléré l’aviation ?','<p>Quand un pays a besoin d’observer l’ennemi et de contrôler le ciel, il investit beaucoup. En quatre ans (1914-1918), l’avion passe de curiosité fragile à machine de guerre puissante, avec moteurs plus forts, mitrailleuses, bombardiers.</p>']],
'5-3':[['moteur à réaction','Qu’est-ce que le réacteur a changé ?','<p>Avec l’hélice, l’avion est limité en vitesse. Avec le réacteur (1939), l’avion peut aller beaucoup plus vite et plus haut, ce qui permet les vols commerciaux à 900 km/h et le Concorde à Mach 2.</p>']],
'5-4':[['course','Pourquoi une course à l’espace ?','<p>Après 1945, les États-Unis et l’URSS se disputent la première place dans le monde. Chaque exploit spatial montre la supériorité technique d’un camp. Cette compétition a permis de passer en 12 ans du premier satellite (1957) aux premiers pas sur la Lune (1969).</p>']],
'5-5':[['lanceurs','Pourquoi réutiliser les fusées ?','<p>Jeter une fusée après un seul vol, c’est comme jeter un avion après chaque trajet. Avec le premier étage réutilisable de Falcon 9, le coût d’un lancement baisse fortement.</p>']],

function mountFig(slot){
  const f=B.figs&&B.figs[slot.dataset.fig]; if(!f){ slot.remove(); return; }

  if(f.canvas){ const C=f.canvas, fig=document.createElement('figure'); fig.className='fig fig-cv'; fig.dataset.anim='1';
    fig.innerHTML='<canvas role="img" aria-label="'+esc(f.alt||'')+'"></canvas><figcaption>'+f.cap+'<span class="fhint">Touche l’illustration pour mettre l’animation en pause.</span></figcaption>';
    const cv=fig.querySelector('canvas'), g=B.gfx.setup(cv,C.W,C.H); let t0=null, tt=0, paused=false, vis=true, raf=0, last=0;
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    const frame=ts=>{ if(!document.body.contains(cv)){ return; } if(t0===null){ t0=ts; last=ts; } if(!paused&&vis&&!reduce){ tt+=(ts-last)/1000; } last=ts; if(vis||tt===0){ g.clearRect(0,0,C.W,C.H); C.draw(g,reduce?C.still||9:tt); } raf=requestAnimationFrame(frame); };
    if('IntersectionObserver' in window){ new IntersectionObserver(es=>{ vis=es[0].isIntersecting; }).observe(cv); }
    fig.addEventListener('click',()=>{ paused=!paused; fig.classList.toggle('paused',paused); });
    slot.replaceWith(fig); raf=requestAnimationFrame(frame); return; }
  const anim=/animate|animation|class="[^"]*(flow|jig|blink|spin|bob|fade)/.test(f.svg);
  const fig=document.createElement('figure'); fig.className='fig'; if(anim) fig.dataset.anim='1';
  fig.innerHTML=f.svg+'<figcaption>'+f.cap+(anim?'<span class="fhint">Touche l’illustration pour mettre l’animation en pause.</span>':'')+'</figcaption>';
  const svg=fig.querySelector('svg');
  if(svg && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && svg.pauseAnimations) svg.pauseAnimations();
  if(anim) fig.addEventListener('click',()=>{ const p=fig.classList.toggle('paused'); if(svg&&svg.pauseAnimations) p?svg.pauseAnimations():svg.unpauseAnimations(); });
  slot.replaceWith(fig);
}

function examResult(root, res, meta){
  const by={}; TH.forEach(t=>by[t.id]={n:0,ok:0});
  res.items.forEach(it=>{ const b=by[it.q.th]; b.n++; if(it.pick!==null&&it.opts[it.pick].ok) b.ok++; });
  const core=TH.filter(t=>!t.optional&&by[t.id].n>0);
  const sc=t=>by[t.id].n?Math.round(by[t.id].ok/by[t.id].n*20*10)/10:0;
  const total=Math.round(core.reduce((a,t)=>a+sc(t),0)*10)/10;
  const zero=core.some(t=>by[t.id].ok===0);
  const full=meta&&meta.full;
  const weak=core.slice().sort((a,b)=>sc(a)-sc(b)).slice(0,2);
  const enOnly=core.length===0&&by.t6&&by.t6.n>0;
  let h='<div class="quiz"><div class="kicker">Résultat de l’examen blanc</div><div class="score-big">'+(enOnly?by.t6.ok+' / '+by.t6.n:total+' / '+(core.length*20))+'</div>'+(enOnly?'<p>Épreuve facultative : seuls les points au-dessus de 10 sur 20 comptent pour l’examen.</p>':'');
  if(core.length===5){
    h+='<p>'+(zero?'<b style="color:var(--bad)">Attention : une note de 0 sur un thème est éliminatoire.</b> ':'')+(total>=50&&!zero?'Au-dessus de 50/100, tu serais dans la zone d’admission habituelle.':'En dessous de 50/100 : continue, regarde les thèmes les plus faibles ci-dessous.')+(full?'':' (score ramené sur 100 à partir d’un mini-examen).')+'</p>';
  }
  h+=core.map(t=>'<div class="th-bar t'+t.n+'"><span class="small"><span class="dot"></span>'+esc(t.short)+'</span><div class="bar"><i style="width:'+(sc(t)/20*100)+'%"></i></div><span class="mono small">'+sc(t)+'/20</span></div>').join('');
  if(by.t6&&by.t6.n){ h+='<div class="th-bar t6"><span class="small"><span class="dot"></span>Anglais (option)</span><div class="bar"><i style="width:'+(by.t6.ok/by.t6.n*100)+'%"></i></div><span class="mono small">'+by.t6.ok+'/'+by.t6.n+'</span></div>'; }
  if(core.length===5) h+='<p class="small" style="margin-top:12px">À travailler en priorité : '+weak.map(t=>'<a href="#th-'+t.id+'">'+esc(t.short)+'</a>').join(' et ')+'.</p>';
  h+='<div class="row" style="margin-top:12px"><a class="btn" href="#exam">Nouvel examen blanc</a><a class="btn sec" href="#home">Accueil</a></div></div>';
  const bad=res.items.filter(it=>it.pick===null||!it.opts[it.pick].ok);
  h+='<div class="quiz"><div class="kicker">Correction détaillée — erreurs et oublis ('+bad.length+')</div>'+(bad.length?reviewHTML(bad):'<p>Aucune erreur. Beau travail.</p>')+'</div>';
  root.innerHTML=h;
  if(meta&&meta.save){ mem.exams.push({ts:Date.now(), total:Math.round(total*(5/ (core.length||5))), full:!!full, by:Object.fromEntries(core.map(t=>[t.id,sc(t)]))}); save(); }
  window.scrollTo(0,0);
}
function pExam(){
  const hist=mem.exams.slice(-5).reverse();
  let h=topbar()+'<h1>Examen blanc</h1><p class="mute">Même structure que le jour J : un questionnaire par thème, sans correction avant la fin. Chronomètre actif ; ne quitte pas la page pendant l’épreuve.</p><div id="ecfg">';
  h+='<div class="card"><b>Examen complet</b><p class="small mute">100 questions (20 par thème), 2 h 30. À faire une ou deux fois avant le jour J.</p><button type="button" class="btn" id="e-full">Lancer l’examen complet</button></div>';
  h+='<div class="card"><b>Mini-examen</b><p class="small mute">25 questions (5 par thème), 37 minutes. Pour t’évaluer en une séance.</p><button type="button" class="btn sec" id="e-mini">Lancer le mini-examen</button></div>';
  h+='<div class="card"><b>Épreuve facultative d’anglais</b><p class="small mute">20 questions, 30 minutes.</p><button type="button" class="btn sec" id="e-en">Lancer l’anglais</button></div>';
  if(hist.length) h+='<h2>Mes derniers examens</h2>'+hist.map(x=>'<div class="card"><div class="row" style="justify-content:space-between"><b>'+new Date(x.ts).toLocaleDateString('fr-FR')+' · '+(x.full?'complet':'mini')+'</b><span class="mono">'+x.total+' / 100</span></div></div>').join('');
  h+='</div><div id="erun"></div>';
  return {html:h, after:el=>{
    const start=(kind)=>{
      const per=kind==='full'?20:5; let list=[];
      if(kind==='en') list=shuffle(Q.filter(q=>q.th==='t6')).slice(0,20);
      else TH.filter(t=>!t.optional).forEach(t=>{ list=list.concat(shuffle(Q.filter(q=>q.th===t.id)).slice(0,per)); });
      const secs=kind==='full'?9000:kind==='mini'?2220:1800;
      $('#ecfg',el).style.display='none';
      runQuiz($('#erun',el), kind==='en'?list:list, {mode:'exam', secs, title:'Examen blanc', onDone:res=>{ examResult($('#erun',el), res, {full:kind==='full', save:kind!=='en'}); }});
    };
    $('#e-full',el).onclick=()=>start('full'); $('#e-mini',el).onclick=()=>start('mini'); $('#e-en',el).onclick=()=>start('en');
  }};
}

/* ---------- router ---------- */
const main=document.getElementById('main');
function route(){
  cleanup();
  const h=(location.hash||'#home').slice(1);
  const parts=h.split('-'), k=parts[0], rest=parts.slice(1).join('-');
  let p;
  if(k==='c') p=pChapter(rest); else if(k==='sim') p=pSim(rest); else if(k==='th') p=pTheme(rest);
  else p=({home:pHome,cours:pCours,sims:pSims,train:pTrain,exam:pExam,fiches:pFiches,gloss:pGloss}[h]||pHome)();
  main.innerHTML=p.html; setTab(h);
  if(p.after) p.after(main);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
B.mountSim=mountSim; B.shuffle=shuffle; B.esc=esc;
route();
})();
